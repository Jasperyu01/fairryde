questions_for_organizer:   # English, short; O1 to O6 were drafted on 4 Oct
  - {id: O1, q: "Could you share the detailed judging criteria?"}
  - {id: O2, q: "Are there more sample cases besides DISP-002 (e.g., route deviation)?", answered: "14 Oct 2026: the organizer uploaded DISP-001 (route deviation) and DISP-003 (fare dispute, surge) and policy v2.1."}
  - {id: O3, q: "Was DISP-002 an immediate booking or a scheduled booking for 08:45?", answered: "Policy v2.1 Section 2.1 counts the wait from the scheduled pickup time, so the booking type is not needed under organizer_v2_1 (D42)."}
  - {id: O4, q: "For route deviation, are fares fixed at booking or based on distance?", answered: "14 Oct 2026: DISP-001 charges $0.80 per km of the actual distance, so the organizer's route fare is distance based (D46)."}
  - {id: O5, q: "Should we apply the sample cancellation_policy or Ryde's live policy (3 min, S$6.61)?", answered: "14 Oct 2026: policy v2.1 applies to the agents: 5-minute free wait, S$5.00 (D41 to D43)."}
  - {id: O6, q: "Does the GitHub repo need to be public at submission?"}
  - {id: O7, q: "In DISP-002 the pickup pin is about 1.3 km from Tiong Bahru Plaza. Should we treat the pin as the exact pickup point?"}
  - {id: O8, q: "Are refunds paid as Ryde wallet vouchers or to the original payment method?", answered: "14 Oct 2026: DISP-001's recommended ruling refunds to the original payment method (D46)."}
  - {id: O9, q: "In dispute_history, does 'upheld' for riders count disputes the rider filed that were upheld?"}
  - {id: O10, q: "In the sample policy, what do the 5-minute free wait and the 8-minute no-show threshold each control?", answered: "14 Oct 2026: policy v2.1 has one 5-minute period after the scheduled time; there is no separate 8-minute threshold (D42)."}
  - {id: O11, q: "How often are GPS pings logged in your cases?"}
  - {id: O12, q: "If a driver marks arrival before GPS shows them at the pickup, should the wait count from when GPS confirms them, or should no fee be charged?"}
  - {id: O13, q: "Do your case records ever include what was said in a rider's call (a transcript or summary), or only that the call happened?"}
  - {id: O14, q: "For RydeTAXI trips, does Ryde ever refund part of a metered fare after a detour complaint, or is that between the rider and the taxi company?"}
  - {id: O15, q: "For carpool trips, does the driver key the total ERP or only the passenger's half, how is the passenger's half divided among several passengers, and does the case data say that a trip is a carpool trip? And for RydePOOL, RydeHIRE, Ryde X GO and Ryde+, what share of the ERP does the rider pay?"}
  - {id: O16, q: "When a driver follows the in-app GPS onto a route that is longer, or passes an ERP gantry the shortest route avoids, does Ryde count the route as justified?"}
  - {id: O17, q: "Policy v2.1 Section 1.3 gives 'Partial refund of excess distance fare' when the reroute had a traffic reason and the rider was not informed, and 'Full refund of excess distance fare' when it had none. DISP-001 and Precedent 7.1 show the partial refund as the excess distance fare itself. What does 'Full' cover: the same excess distance fare, or the whole excess (distance, tolls, time, surge)?"}
  - {id: O18, q: "Section 2.3 voids the fee if the driver 'fails to meet both contact obligations'. If the driver sent a message but made no call (or the reverse), does the fee stand or is it voided?"}
  - {id: O19, q: "Section 2.1 counts the 5-minute free wait from the scheduled pickup time, but DISP-002's app timer starts at the driver's arrival, two minutes earlier, and its policy object has an 8-minute no-show threshold. Which one does the scoring follow when they differ?"}
  - {id: O20, q: "Section 1.2 accepts a verbal notice with the trip call recording as evidence. Do case files ever carry the recording's transcript or a summary of a call?"}
  - {id: O21, q: "DISP-001 cites 'RydeResolve Driver Policy 4.2', which policy v2.1 does not contain. Is there a Driver Policy document we should have?"}
  - {id: O22, q: "Section 4.4 sends a damage claim the rider disputes to human review, but Section 6.2 lets the AI rule on a cleaning claim up to $50 with verifiable photos. Which applies when the rider disputes a cleaning claim?"}
  - {id: O23, q: "Is the traffic_conditions list of DISP-001 all that the 'historical traffic API' returns? Do incidents have coordinates or a segment id, so that an incident can be placed on the recommended route?"}
  - {id: O24, q: "Section 6.3 names evidence completeness, policy clarity, precedent alignment and party credibility scores as the parts of the confidence. Is there a formula, or is it left to the team?"}
  - {id: O25, q: "DISP-003's file has no expected ruling. Is the expected ruling the refund of the S$4.50 surge differential, and which outcome label should we use (a full refund of the differential, or a partial refund of the fare)?"}
  - {id: O26, q: "Under organizer_v2_1, Section 6.2 says a no-show ruling is final. Should a fee upheld on FairRyde's own GPS presence logic (decision D29, rows R9 and R11) still go to a person, or should Section 6 decide alone? Today it still goes to a person (D52)."}
  - {id: O27, q: "Section 1.3 has no row for a driver who informed the rider without a confirmed agreement (today: escalate). Its unjustified-reroute row has 'rider informed' N/A, so a reroute the rider agreed to without a traffic reason is refunded in full today; should the rider's agreement override that (D56)?"}
  - {id: O28, q: "Are tolls on a justified or an unjustified reroute passed through at cost in every case? Only the reference answer of DISP-001 says so (D47)."}
