# FairRyde Knowledge Base - OPEN DECISIONS AND QUESTIONS (ONT.4 Step 6 to-do, ONT.12)
# Decisions keep the numbering of the 4 Oct research report (D1 to D16); D17 onward are new in KB v0.1.
# Autonomy tiers were renamed: A -> AUTO, B -> APPROVE, C -> HUMAN (so they are not confused with credibility A to D).

meta:
  version: 0.2.0
  updated: 2026-10-14
  owner: Jasper

decisions:
  - {id: D1, topic: "Booking type of DISP-002", default_v0_1: "Inferred ON_DEMAND with flag BOOKING_TYPE_INFERRED (CW-F01). Irrelevant to the organizer outcome because the organizer gives driver_wait_start.", changed: false, decide: "Organizer (question O3)"}
  - {id: D2, topic: "Threshold comparison at exactly 8:00", default_v0_1: "Organizer profile: at least the threshold, evidenced by the organizer's own event 'No-show threshold (8 min) reached.' at exactly 8:00 (credibility A). Ryde profile: more than 3 minutes (A).", changed: "yes: now evidenced by organizer data, not a FairRyde choice", decide: done}
  - {id: D3, topic: "Wait anchor", default_v0_1: "Organizer profile: trip_data.driver_wait_start (A). Ryde profile: 'I'm Here' with GPS at the pick-up point (A).", changed: "yes: was driver_arrival_time", decide: done}
  - {id: D4, topic: "Advance booking with an early driver", default_v0_1: "Wait starts at the later of arrival and scheduled time (CW-F02B, credibility C from Grab and Bolt), Ryde profile only.", changed: false, decide: "Team"}
  - {id: D5, topic: "Pick-up pin far from the named venue", default_v0_1: "Flag PIN_VENUE_MISMATCH; the outcome does not change because the pin is the designated location (CW-R11). An upheld fee needs human approval when the rider says they were at the venue (AUTH-02 trigger 9); rider GPS at the venue is strong evidence and escalates (DT row R7).", changed: "yes: rows renumbered after the independent review", decide: "Team"}
  - {id: D6, topic: "Contact attempts before a no-show cancellation", default_v0_1: "Not a condition of the fee. No contact at all adds CONTACT_NOT_ATTEMPTED and requires human approval (CW-R04).", changed: "yes: was a fee condition; Ryde's text does not require contact and ONT.8 warns against silently substituting generic rules", decide: "Team"}
  - {id: D7, topic: "Who funds a waived fee", default_v0_1: "Ryde wallet voucher (Ryde's own remedy form, CW-R10). Whether to recover the driver's S$4.50 is a separate human decision. Open arithmetic: the rider pays S$6.61, the driver receives S$4.50, and S$0.50 of the S$5.00 base is not explained by the articles read.", changed: "added the payout gap", decide: "Team; organizer (question O8)"}
  - {id: D8, topic: "Role of account history", default_v0_1: "Never decides the outcome (GEN-R03). Feeds the fraud check (FRD-01, FRD-02). Any fraud signal on either party requires human approval (AUTH-02), so a flagged party's losses get the same human check as its wins.", changed: "yes: symmetric, after the independent review", decide: "Team"}
  - {id: D9, topic: "Escalation policy", default_v0_1: "Safety always to a human; TAU starts at 0.60; automatic limit S$10 (all credibility D).", changed: false, decide: "Team; calibrate TAU on the dev set"}
  - {id: D10, topic: "Confidence score", default_v0_1: "Composite C = 0.35 A + 0.25 M + 0.25 E + 0.15 R (AUTH-05).", changed: "written as rule AUTH-05", decide: "Cao (owner of the Judge)"}
  - {id: D11, topic: "Which parameters apply", default_v0_1: "Embedded organizer policy object for organizer cases, Ryde 2026 otherwise (META-01).", changed: false, decide: "Organizer (question O5)"}
  - {id: D12, topic: "Executable source of truth", default_v0_1: "YAML knowledge base + Python engine + checks (build_kb.py).", changed: "yes: YAML files are now the single source; the workbook is generated from them", decide: done}
  - {id: D13, topic: "Label independence", default_v0_1: "Jasper labels everything blind; the junior teammate double-labels 25 to 30 cases and writes 10 to 15 held-out cases; Cao adjudicates.", changed: false, decide: "Team"}
  - {id: D14, topic: "Free text and injection", default_v0_1: "Party text is tier C or D evidence, flagged when it contains instructions; approval needed only when the injecting party would benefit (AUTH-02).", changed: "refined", decide: "Team"}
  - {id: D15, topic: "Zero margin on the threshold", default_v0_1: "A margin within the boundary band needs human approval when the records disagree about the anchor or end time by more than the margin (AUTH-02 trigger 8), whichever party the outcome favors. DISP-002: margin 0 s, the app's wait timer started 10 s after driver_wait_start, so UPHOLD goes to one-click approval (tier APPROVE).", changed: "yes: restores the 4 Oct rule that a zero margin plus a source disagreement escalates; the clause 'or the rider contests' was dropped after the second review so that waivers and upheld fees near the threshold are treated alike", decide: "Team"}
  - {id: D16, topic: "Detour thresholds", default_v0_1: "Ratio 1.20 and 3 km extra (credibility C, DiDi), borderline band 1.10 or 1.5 km (D).", changed: false, decide: "Team"}
  - {id: D17, topic: "Which rules count as decisive for the approval tier", default_v0_1: "On the path (defined): a READ rule whose other readings change the outcome; a C/D parameter that changes the outcome inside its plausible range, or keeps it but moves the case to a row rated C or D; or a decision-table row rated C or D (rules.yaml decisive_definition).", changed: "new; the lower-rated-row case added after the sixth independent review", decide: "Cao"}
  - {id: D18, topic: "Maximum gap between driver pings", default_v0_1: "300 s, plausible range 60 to 420 s as a prior (not set from DISP-002). Inside that range DISP-002's presence finding is sensitive, which is one more reason it needs approval. It is also the look-back window for the moment ping of the arrival check (CW-R06).", changed: new, decide: "Team; ask the organizer how often pings are logged"}
  - {id: D19, topic: "Route deviation under fixed fares", default_v0_1: "Fixed fare and charged = quoted means no fare refund (FC-R01, credibility B); only ERP or destination items can be refunded. The handbook's example 'partial refund of $3.25' suggests organizer cases may carry distance-based fares.", changed: new, decide: "Organizer (question O4)"}
  - {id: D20, topic: "Pick-up pin in DISP-002", default_v0_1: "The pin is 1,259 m from the OneMap address of Tiong Bahru Plaza. Treated as the designated location (ToU s.7.2), flagged PIN_VENUE_MISMATCH.", changed: new, decide: "Organizer (question O7)"}
  - {id: D21, topic: "What the organizer's 5-minute free wait and 8-minute threshold each control", default_v0_1: "5 minutes = free waiting period (waiting fee and rider-side cancellation after arrival); 8 minutes = earliest no-show cancellation (CW-R03, CW-R05). Inferred from DISP-002's events ('Cancellation fee now applicable per policy' at 5 minutes; 'No-show threshold (8 min) reached' at 8).", changed: new, decide: "Organizer (question O10)"}
  - {id: D22, topic: "Missing or contradictory arrival and presence records", default_v0_1: "Platform check and ping disagree: escalate (row R2). No records: the fee is not upheld (burden on the driver) but a human approves, and no fraud signal is raised (rows R3, R5).", changed: "new after the independent review: no automatic waiver plus fraud signal on missing data", decide: "Team"}
  - {id: D23, topic: "Outcome and tier for DISP-002", default_v0_1: "UPHOLD (matches the organizer's expected ruling) with tier APPROVE: zero margin inside a 10 s source spread, pin 1,259 m from the venue the rider names, fraud flag on the rider, and a presence finding that is sensitive to the ping-gap assumption.", changed: "yes: was tier A", decide: "Team"}

  - {id: D24, topic: "GPS outliers, impossible jumps and pings that do not line up with the wait", default_v0_1: "Pings are sorted by time. After the driver is first seen inside the pick-up area, an outside stretch shorter than LEFT_MIN_OUTSIDE_S (60 s, range 30 to 120) from its first to its last ping and followed by an inside ping (a single such ping included), or one reached at an impossible speed, is a GPS outlier and is set aside; a stretch with no later inside ping is never an outlier on duration, because nothing shows it was brief. Impossible speeds also flag GPS_DATA_ERROR and fire gate G1. Pings before the driver is first seen inside are the approach: never outliers on duration. Inside the window, being away counts only for a ping at least TS_TOLERANCE_S before the window end (and, for the approach, more than TS_TOLERANCE_S after its start), so a last ping logged as the driver pulls away at the cancellation does not void a fee. Presence is measured only inside the window; pings outside it are not used. Outliers never count as evidence that the driver was outside (CW-R06 FALSE needs remaining pings).", changed: "new after the second and third independent reviews (offset pings, single glitches and 5-second sampling had produced false CONTESTED, SPARSE and LEFT findings); approach and outlier wording fixed in the fourth review (a driver never seen at the pin had been described as present; a last outside ping with no return had been set aside as brief)", decide: "Team"}
  - {id: D25, topic: "Tier of an ESCALATE_HUMAN outcome", default_v0_1: "Always HUMAN (AUTH-06): there is no AI ruling to approve. APPROVE is used only when FairRyde has a ruling for a person to confirm or change.", changed: "new after the second independent review (policy gaps and contested facts had different tiers)", decide: "Cao"}
  - {id: D26, topic: "When the wait starts and ends for the presence check", default_v0_1: "The wait counts from the later of the anchor and the moment GPS (or the platform's arrival check) confirms the driver at the pick-up point (CW-F03B, credibility D; ARRIVAL_UNCONFIRMED when that is after the arrival indication; burden on the driver, GEN-R01). The two other readings (no fee at all when arrival is indicated before GPS shows the driver there; counting from the anchor regardless of GPS) are tested in every case where CW-F03B moves the start, and the ruling needs approval when either changes the outcome. An advance booking with no arrival indication has no wait. Presence is checked only until the threshold is reached: leaving after that does not void the fee (Ryde: 'waits for > 3 minutes ... and cancels').", changed: "new after the third independent review; split into rule CW-F03B with its own decisive test after the fourth review", decide: "Team; organizer (question O12)"}

  - {id: D27, topic: "Rider calls and messages during the wait (FX1)", default_v0_1: "Any rider call or message from the arrival to the cancellation was STRONG counter-evidence, whatever it said, so routine no-show and waiting-fee cases went to a person (round 1 cases E01, E03, E07). The window was not defined for waiting fees.", changed: "yes in v0.2: CW-F06 reads the content. Placing the rider at the pin or venue, contesting presence, timing or place, or asking where the driver is, is STRONG; admitting lateness or 'coming' is not counter-evidence; a call whose words are not recorded, or a message that fits neither reading or both, gets the reading test (approval when the other reading changes the outcome). The window starts at the arrival indication and ends at the cancellation (no-show fee) or with CW-F04's window (waiting fee). Jasper confirmed the outcomes of E01, E03 and E07 (the fee stands) on 2026-10-11. After Jasper's acceptance, A1b changed three details as FairRyde design, now frozen with the rest (D34): the wait starts TS_TOLERANCE_S before the arrival indication; an acknowledgment answering a question in the driver's last message reads like a bare yes (reading test); down, out and there are no longer filler words. Unsettled readings never give an automatic uphold on the merits; MAT-04 (out of window) and a policy gap decide without them. The reference engine reads messages with phrase lists built so that anything they cannot settle is UNCLEAR (approval), never an automatic uphold; one message that admits lateness and then places the rider reads UNCLEAR, while the same words as two messages read STRONG.", decide: "done: Jasper accepted the reading rule and its windows on 2026-10-11 as FairRyde design (credibility D); readings that cannot be settled go to a person (approval), never to an automatic uphold"}
  - {id: D28, topic: "Detour on a metered RydeTAXI fare (FX2)", default_v0_1: "FC-R03 and FC-R05 computed a refund for METERED fares (S$9.60 in round 1 case E10).", changed: "yes in v0.2: new eligibility rule FC-R00 (an exclusion like CW-R00, but credibility D because it extends Ryde's text) excludes METERED fares from FC-R03 and FC-R05; FairRyde measures the detour and escalates under GEN-R07 with the measurement, the formula's difference (information only) and the driver's response attached. Jasper confirmed E10's outcome (escalate to a person) on 2026-10-11.", decide: "Team; organizer (question O14)"}
  - {id: D29, topic: "Upheld fees that rest on FairRyde's own GPS presence logic", default_v0_1: "Decided by the approval-tier tests case by case; CW-F04 as a whole was rated B (round 1 finding FX4: too high).", changed: "decided by Jasper on 2026-10-11: whenever upholding a fee depends on FairRyde's own GPS logic (outliers, window edges, LEFT, SPARSE, UNKNOWN, GPS_AMBIGUOUS, the ping-gap and radius parameters), the ruling needs human approval (tier APPROVE), never AUTO. To be implemented in step A3 when CW-F04 is split into its Ryde core (B) and FairRyde's presence logic (D).", decide: "done; implemented in A3 (2026-10-14): CW-F04 keeps Ryde's condition (B) and the new rule CW-F04B holds FairRyde's GPS presence logic (D) with its finding F-GPS-LOGIC, true when the logic and not the pings alone makes the driver count as arrived and present (a ping set aside that could change the presence or the arrival, an outside ping in the window not counted as leaving, a later GPS confirmation, SPARSE or GPS_AMBIGUOUS). No-show fees: DT-CW-NOSHOW input gps_logic_decides; R8 (B) needs it false, the new row R11 (D) is the same uphold when it is true, so the row is decisive and the fee needs approval; the engine also lists the trigger. The ping-gap and radius part: a CW-F04B parameter that would make F-GPS-LOGIC true at an end of its plausible range moves a no-show uphold onto R9 or R11, which decisive_definition clause 2 counts as decisive; for waiting fees (no decision table, D31) AUTH-02 trigger 12 and CW-F04B's text state both parts (check round 1 found the parameter part missing for waiting fees, SG-1 and ADV-1), pointed to from PB-CW-WAITING step 5. The decisive parameter is reported against CW-F04B, or CW-R06 when only the arrival finding moves. The set-aside pings that count are those that could change the presence (in the window) or the arrival (one that would otherwise have been CW-R06's moment ping; with the platform check, only one at or after the indication), check rounds 1 and 2. Check round 2 also made GPS_AMBIGUOUS cover both window edges (ADV2-1, CRITICAL): a driver last seen at the pin more than TS_TOLERANCE_S before the window end and next seen away before the cancellation, and a window that starts after the arrival while the driver was last seen away. Tests: V94 to V103 and ten re-rated variants, an A3 rule-card check, and a fuzz invariant (no automatic uphold with F-GPS-LOGIC true, an outside ping in the window, or a first ping away after the window end that follows a last inside ping more than TS_TOLERANCE_S before the window end). Tier report: validation/build_checks/A3/01b_tier_report.md (DISP-002 and E01 to E04 unchanged). Cost, for Jasper (check round 1, ADV-2): the radius part makes a clean uphold with ordinary GPS jitter (a ping between 10 and 50 m from the pin) go to approval, because at the radius's 10 m low end that ping would be set aside; see D39 (g). Jasper, 2026-10-14: the radius's plausible range starts at 20 m, above ordinary phone GPS error (reasons in reference_data.yaml); a ping between 20 and 50 m from the pin still sends the uphold to approval. In the jitter simulation (600 clean upholds, seed 5) automatic upholds go from 29 back to 204 (A2: 235); V99 and V99B pin both sides."}
  - {id: D30, topic: "Rider messages sent before the driver's arrival indication", default_v0_1: "Not defined: CW-F06 said 'during the wait' without a start.", changed: "A1 (before this decision): rider calls, messages and GPS counted from the arrival indication only, so a message such as 'I'm at the pick-up point' sent before the driver marked arrival was not counted. A1b (after the decision): counted, see decide.", decide: "done: Jasper decided on 2026-10-11 that they count as counter-evidence and need at least human approval. Implemented in CW-F06 (A1b, after two review rounds): before the wait (from the driver's assignment to TS_TOLERANCE_S before the arrival indication), a rider message counts unless it is positively known not to place the rider (a call, an admission, an acknowledgment that answers no driver question, or only questions about the driver, contests, pick-up instructions and filler). Counted evidence makes the rider evidence at least WEAK and the reading test takes STRONG as its other reading, so a fee upheld on the merits always needs approval (MAT-04 and a policy gap decide without it). Rider GPS: D33"}
  - {id: D31, topic: "Waiting-fee disputes have no decision table and no reference implementation", default_v0_1: "CW-R05 lists the waiting-fee conditions, but nothing says how presence LEFT, SPARSE or UNKNOWN, or arrival FALSE or UNKNOWN, changes a waiting-fee outcome; CW-R12 points to DT-CW-NOSHOW, whose rows are written for no-show fees. The reference engine runs no-show cases only, so the waiting-fee window of CW-F06 has no executable check.", changed: "new in v0.2 (found by the A1 independent check: the KB applier on E07 and the adversarial reviewer)", decide: "Known limitation of v0.2 (Jasper, 2026-10-11): not done in this version. Waiting-fee disputes are decided by following PB-CW-WAITING (MAT-04, CW-F02 or CW-F02B, CW-R06, CW-F03, CW-F03B, CW-F04, CW-F04B, CW-R05, CW-F06, CW-R12, DQ-06, CW-R10) without a decision table, and the reference engine runs no-show cases only. D29 still covers waiting fees: A3 implements it in the engine and DT-CW-NOSHOW for no-show fees, and must state it in the rule text so that a waiting fee upheld on FairRyde's GPS presence logic is also tier APPROVE (done in A3: AUTH-02 trigger 12 and CW-F04B, see D29)."}
  - {id: D32, topic: "ERP refund after a detour on a metered RydeTAXI trip", default_v0_1: "FC-R08 refunded ERP(actual) minus ERP(recommended) after an unjustified detour with no fare-mode condition, so a RydeTAXI detour that also passed a gantry would be escalated on the fare (FC-R00) but get a platform-computed ERP refund on a cash trip.", changed: "new in v0.2 (found by the A1 review round 2; A1 did not touch FC-R08). Settled in A2.", decide: "done in A2 (Jasper's step prompt, 2026-10-11): FC-R08 does not apply to a METERED fare, in line with FC-R00. FairRyde does not rule on it: the claim escalates under GEN-R07 (GEN-R-POLICY-GAP, tier HUMAN) with ERP(actual), ERP(recommended), their difference (information only, never a proposed refund), any FC-R07 finding and the driver's response attached. FC-R07 (ERP overstated by the driver) still applies to a metered fare: it rests on Ryde's driver article, which covers RydeTAXI, and the overstated amount is a measured fact (gantries passed times published rates), not a fare recomputation. The refund of the difference is FairRyde's remedy for every service (item 5 of D35). Reasons, as for FC-R00: Ryde publishes no rule for refunding any part of a metered fare, the fees follow the taxi company and payment is in cash only; and the route duty FC-R08 rests on (LTA) is verified for private-hire (PDVL) drivers only, with no taxi (TDVL) list found. FC-R08 is rated D (round 1 finding FX3)."}
  - {id: D33, topic: "Rider GPS at the pick-up before the driver's arrival indication", default_v0_1: "Not counted (rider GPS counted only during the wait).", changed: "A1b: counted like a rider message that places the rider at the pick-up (D30): at least WEAK, STRONG as the other reading, so a fee upheld on the merits needs approval. Jasper's D30 named messages only; extending it to rider GPS is FairRyde's choice, made so that the same fact counts whether the rider says it or the phone records it.", decide: "done: Jasper kept it on 2026-10-11"}
  - {id: D34, topic: "Freeze of the rider-message reading (CW-F06 READ part and its engine proxy)", default_v0_1: "n/a", changed: "Jasper, 2026-10-11, after A1b's second review round: the reading of rider calls and messages stops here; later steps (A2 to A5, validation round 2) do not extend it. Gaps are recorded here, not fixed. Known limitations at the freeze (A1b review round 2): (1) unsafe, pre-existing since A1: 'at the mall/MRT/market/clinic/kopitiam/gym/ATM' reads as lateness, so 'I'm at the mall already' is an automatic uphold when the pick-up is such a place (DISP-002's venue is a mall); FIXED in A2 as an exception to the freeze (D38); (2) safe direction, before the wait: 'reach liao?', the Chinese 'arrived?' and plans such as 'I'll meet you at the lobby' or 'I have 2 luggage' are counted, so routine cases go to approval; (3) calls before the wait never count (D30 named messages); (4) the engine's phrase lists stand in for the reading an LLM does at run time and cover only the reviewers' corpus (kb/tools/cw_f06_reading_corpus.json) and the self-test cases.", decide: "done: Jasper froze it on 2026-10-11; a fix needs Jasper's explicit decision (given for limitation 1 on 2026-10-11, see D38). On 2026-10-14 Jasper accepted the handling of the points D38 left open and kept the freeze."}
  - {id: D35, topic: "ERP exceptions and their precedence (FX3)", default_v0_1: "FC-R06 stated that RydeSEND fares include ERP and that carpool ERP is shared 50/50, but F-ERP-EXPECTED (FC-F04) and the detour ERP refund (FC-R08) ignored it, and FC-R01 said the detour is 'conduct information only'.", changed: "yes in v0.2 (A2): one ERP computation. FC-R06 sets the rider's share by service (table ERP_RIDER_SHARE, from Ryde's 2026-09-02 driver article: the six services whose fares exclude ERP 1, RydeSEND 0, carpool 0.5) and takes precedence over the plain gantry sum; FC-F04 applies it; FC-R07 compares the ERP line charged to the rider with it; FC-R08 refunds what the rider paid above ERP(recommended), up to the extra ERP the detour caused (rider's share), FC-R07's refund on top (together at most the ERP charged minus the smaller of ERP(actual) and ERP(recommended)), 0 and FC-R-TOLL-VALID when nothing was charged above ERP(recommended). A trip is a carpool trip only when the record says so (service type CARPOOL or is_carpool true); the half applies to CARPOOL and the six named services, any other service flagged as carpool has no rule; an unrecorded is_carpool reads as not carpool, and for RydeFLASH (offered to carpool drivers) that is RECORDS_MISSING and approval. No share is set (GEN-R07) for RydePOOL, RydeHIRE, Ryde X GO, Ryde+ or a trip that is both RydeSEND and carpool; a trip with no service type is insufficient data (FC-R12). FC-R08 is credibility D, with the PDVL-only scope of the LTA duty (the taxi list was not found). FC-F03 has the GPS most-efficient-route justification (Ryde, B). FC-R01 sends the ERP a longer route caused to its own FC-TOLL claim (CLS-02), opened even when the rider did not name the ERP. Tests: kb/tools/engine_toll.py with 39 ERP cases and the FC-R01 split in kb/tools/selftest.py; round 1 case E11 reruns as TOLL_REFUND S$6.00.", decide: "done in A2 (Jasper's step prompt, 2026-10-11). Corrections after check round 1: the first version defaulted every other service to share 1.0 and capped the refund at the ERP charged; both were wrong (RydePOOL pages say 50%, and a rider charged less than ERP(actual) was refunded money owed on the recommended route). Still open: (1) organizer or Ryde, question O15: RydePOOL (2026 driver pages: each rider pays 50% of the total toll; 2023 driver pages: RydePOOL, RydeHIRE and RydeSEND fares include ERP), RydeHIRE, Ryde X GO and Ryde+, and on a carpool trip whether the driver keys the total ERP or the passenger's half and how the passenger half divides among several passengers (a backlog item in scope.yaml); (2) Jasper to confirm that FC-R01 opens the FC-TOLL claim without the rider naming the ERP (FairRyde design, D), and that it does so only for a fixed fare charged as quoted: on a RECALCULATED fare or a charged fare different from the quote nothing opens the claim unless the rider names the ERP; (3) the same PDVL-only scope applies to the LTA citations in FC-F03 and FC-R03 (not changed in A2), and FC-R08 does not check which kind of driver served the trip (a taxi driver on RydeX, a carpool driver without a PDVL); (4) FC-F03 stays C because of its DiDi element, but Ryde states the GPS permission for fixed fares, so using it for ERP claims extends it: A3's census rates it (done: D in A3, see D39); (5) FC-R07: the refund of the difference is FairRyde's remedy (as in FC-R10, D); by the credibility principle the rule would be D, left at A in A2 for Jasper to decide (recommended: D in A3; done: D in A3 on Jasper's decision of 2026-10-14); (6) the engine takes the gantry log's rate over the LTA table when both exist (E11: the table lists S$6.00 for that gantry in a later window), and a disagreement is not flagged; it also reads the HH:MM of a table lookup without the timestamp's offset and counts two identical rows of the gantry log as two passes (check round 2, not fixed); (7) RydePOOL and RydeHIRE: the 2026 and 2023 driver pages contradict each other (and the 2024 rider page says ERP is excluded for every service but RydeSEND), so this could be a META-04 known conflict (SOURCE_CONFLICT, GEN-R-SOURCE-CONFLICT) instead of GEN-R07; A2 uses GEN-R07, Jasper to choose; (8) the 50% of a carpool trip holds for one passenger, the record has no rider count, and several passengers are a scope.yaml backlog item (check round 2); (9) carpool status: whether the case data can say it at all, and whether Ryde means a trip by a carpool driver (RydeFLASH is offered to them) or a shared ride (organizer or Ryde, O15). Check round 2 (A2) fixed: the carpool flag overriding the no-share list, the RydeFLASH default, route_review without the recommended route, numeric and boolean parsing, the refund-sum sentence. Jasper's decisions of 2026-10-14 on these points: (2) FC-R01 stays as it is (it opens the FC-TOLL claim without the rider naming the ERP, and only for a fixed fare charged as quoted); (5) FC-R07 goes to credibility D in A3; (7) the services with no ERP share in ERP_RIDER_SHARE (RydePOOL, RydeHIRE, Ryde X GO, Ryde+, RydeSEND plus carpool) stay with a person under GEN-R07, not META-04; (8) the carpool half (0.5) stays for one passenger only, and an is_carpool that is not recorded stays as implemented in A2: it goes to a person for confirmation where it matters (RydeFLASH, which Ryde offers to carpool drivers: RECORDS_MISSING, tier APPROVE); for the other services it reads as not carpool (A3 check round 1, CONS-7: to confirm with Jasper whether the decision meant RydeFLASH only, as implemented, or every service). Items (1), (3), (6) and (9) stay open. (8) decided by Jasper on 2026-10-14: an unrecorded is_carpool goes to a person only for RydeFLASH, as implemented; for the other services it reads as not carpool."}
  - {id: D36, topic: "Ryde's 'most efficient route according to GPS' against the LTA duty 'shortest and most direct route' (FC-F03)", default_v0_1: "FC-F03 did not list Ryde's GPS wording as a justification.", changed: "A2: FC-F03 lists 'the route the driver's GPS navigation showed as the fastest or most efficient', shown by the trip's navigation record; a bare statement by the driver (tier C or D, GEN-R04) does not establish it (GEN-R01). The navigation-record requirement is FairRyde's evidence rule. Ryde's route articles (rider article 4412121982745, edited 2024-10-01, and driver article 4412122016153, edited 2023-06-16, so B) allow the GPS route; the LTA offense list says 'shortest and most direct route' and 'without reasonable cause'. FairRyde follows Ryde's contract wording and reads 'reasonable cause' as the bridge. FC-F03 stayed C in A2 (DiDi element); the A3 census rates it D (D39).", decide: "FX3 asked for it (Jasper, 2026-10-11); the tension itself is for the organizer or Ryde (question O16: does a driver who follows GPS onto a route that is longer, or that passes an ERP gantry the shortest route avoids, count as justified?)"}
  - {id: D37, topic: "Gate G3: the history-aware pass or the fraud check disagrees with the history-blind pass (FX5)", default_v0_1: "G3 gave ESCALATE_HUMAN (tier HUMAN), so a flagged rider's win was escalated while a loss only needed approval, against GEN-R03 and FRD-02 ('never changes the outcome').", changed: "A2: G3 keeps the history-blind pass's ruling as the provisional ruling at tier APPROVE and shows the disagreement to the reviewer; the history-aware result changes neither outcome nor amount, for a win and a loss alike. If the history-blind pass has no ruling itself (ESCALATE_HUMAN) the case stays ESCALATE_HUMAN at tier HUMAN. G2 and G8 still leave no single ruling (HUMAN). AUTH-04 carries the gate tiers as data (gate_tiers); kb/tools/engine_gates.py resolves G3; selftest has a flagged and unflagged rider pair for a win and a loss.", decide: "done in A2 (Jasper's step prompt, 2026-10-11). The detection of G3 stays a runtime check (it needs the Judge passes)."}
  - {id: D38, topic: "Exception to the D34 freeze: 'I'm at the mall already' (known limitation 1)", default_v0_1: "n/a", changed: "A2, on Jasper's instruction of 2026-10-11: known limitation (1) of D34 is fixed. The reader's lateness list no longer treats 'at/in the mall, market, clinic, gym, kopitiam, ATM or MRT' as an admission, because the pick-up may be such a place (DISP-002's venue is a mall). Such a message now reads UNCLEAR, in the wait and before the arrival (D30), so the reading test applies and the ruling needs approval; it is never an automatic uphold. Tests: V92 and V93, nine reading cases, three before-arrival cases. Side effect, safe direction: a message that names one of those places together with an admission ('still at the mall, give me 10 min', 'in the mall, otw') now also reads UNCLEAR, so such routine cases go to approval instead of AUTO (check round 1, A2). A second effect, also safe: a place word no longer blocks a placement, so 'I'm at the mall entrance', 'I'm at the mall lobby' and 'I'm at the mall now. where r u' read PLACES (STRONG, ESCALATE_HUMAN, tier HUMAN) where they used to read UNCLEAR (APPROVE); three reading cases pin it (check round 2, A2).", decide: "done in A2. Known limitations (2) and (3) of D34 stay; the rest of the reading remains frozen. For Jasper, not changed: (a) office, house, home, work, room, train, bus, lift, toilet, meeting, traffic and jam still read as admissions, the same hazard when the pick-up is the rider's home or office ('I'm at the office already' is an automatic uphold); (b) the side effect above, if Jasper prefers a place plus an explicit admission to stay an admission; (c) chat rows are read only when the sender is exactly 'rider' and the type exactly 'message' or 'call' (other spellings are ignored); (d) before the arrival an instruction such as 'pls wait at the mall liao' is dropped as a pick-up instruction (check round 2, A2). Jasper accepted (a) to (d) and both side effects as they are on 2026-10-14; the reading stays frozen (D34)."}
  - {id: D39, topic: "Credibility census of the rules rated B or C (FX4)", default_v0_1: "v0.1 rated 17 rules B or C (16 after A2 moved FC-R08 to D); round 1 found 4 of the 8 reviewed rated higher than the credibility principle allows (CW-F04, CW-R06, FC-R08, EXP-01).", changed: "A3 (2026-10-14): validation/round2/census.csv lists every element of the 16 rules, of the new CW-F04B and of FC-R07 with its source or FAIRRYDE and a label; each rule takes its weakest counted element. Relabeled to D: CLS-01 (the safety word list and severity are FairRyde's), CW-R08 (the 'not moving toward the pick-up' ground has no source in the KB), FC-F03 and FC-R03 (the PDVL route duty applied to every driver; the GPS permission extended beyond fixed fares; the navigation-record rule), FC-R02 (the GPS permission, given because the fare is fixed, applied to every fare of a route claim), EXP-01 (the content list and the 30-day reading), and FC-R07 (Jasper, 2026-10-14). Split: CW-F04 (B, Ryde's condition) and CW-F04B (D, FairRyde's GPS logic), see D29. Kept: CW-F02B C (other platforms' practice fills a gap Ryde leaves), CW-F04, CW-R00, CW-R06, FC-F01, FC-R01, SE-R02, SE-R04, GEN-R06 and AUTH-03 at B. Sources added: FC-F01 (the recalculation quote), SE-R02 (examples and breakdown), SE-R04 (the 24-hour traffic accident report, which the statement now names instead of a police report), FC-R07 (the key-in quote), CW-F04 (the article's 'Has waited for more than 3 mins'). The build checks that the census covers every B or C rule and that each label is the weakest counted element.", decide: "done in A3. Judgments for Jasper, not changed: (a) CW-R06 stays B: its FairRyde parts (the outlier step, the later confirmation, CONTESTED, UNKNOWN) are rated D in the rules they belong to (CW-F04B, CW-F03B, GEN-R02, GEN-R01); every row whose ruling rests on them is D (R2, R3, R9, R11), except a short-wait waiver (R6, A) that rests on a later confirmation, which CW-F03B's start test sends to approval when another reading changes it; reading Ryde's GPS condition at the moment of the arrival through the last remaining ping from PING_MAX_GAP_S before to TS_TOLERANCE_S after it is counted as Ryde's condition, with its look-back, tolerance and radius as D parameters tested by the sensitivity test; (b) FC-R01 stays B: recording the deviation as conduct information and opening the FC-TOLL claim are FairRyde's (D) but set no amount and add no condition to the no-refund finding; (c) AUTH-03 stays B: a human deciding (not only approving) safety matters is stricter than the IMDA guidance and only sends more cases to people; (d) R1 and R4 stay B: setting a ping aside only removes evidence that the driver was away, so a FALSE arrival or LEFT found with the logic also holds on the pings alone, except a data error (gate G1, approval); (e) CW-R08 would be C again with a local source for its 'not moving' ground (Grab's cancellation page) and, since A4, for its advance-booking ETA; (f) FX9 leftovers seen in the census, done in A4: CW-F02B cites the 2024 driver page RYDE-20244064619161, and CW-R08 defines the assignment ETA of an advance booking (see D40). Check round 1 (A3) added: (a') the reviewers note that 'delegated' is the builder's category, not FX4's wording; if Jasper reads FX4 literally, CW-R06 is D, R1 and R8 become D, and every no-show uphold and every R1 waiver goes to approval; the alternative is to split CW-R06 as CW-F04 was; (b') and (c') are the same kind of judgment (a FairRyde step in the conclusion of FC-R01; a stricter-than-source reading in AUTH-03); (g) the radius part of D29 (ADV-2): with pings 3 m from the pin and one at 15 m, V99 now goes to approval (it was automatic in A2); a reviewer's simulation of 600 clean upholds on the round 1 draft (parked 0 to 25 m from the pin, normal jitter) found automatic upholds falling from 38% to 5% (198 of the 201 moved cases through ARRIVAL_GEOFENCE_M's 10 m low end, 3 through TS_TOLERANCE_S); the builder's run (validation/build_checks/A3/jitter_sim.py) gives 235 to 29 of 600, every moved case through the radius; options: keep it (D29 as written), exempt the radius from the row-move part of clause 2, or raise the radius's low end above the platform's 10 m check; (h) the toll engine does not mark FC-R07's refund (now D) as a generic assumption: META-05 needs a decisive rule and decisive_definition makes a D outcome rule decisive only through a decision-table row; every FC-R07 refund already needs approval because of the fraud signal; (i) pre-existing engine defect fixed in A3 (ADV-3): pings were sorted by their timestamp text, so pings written with another UTC offset were read out of order (a departure became an outlier); they are now sorted by instant (V98), and read on the trip record's clock. Check round 2 (A3) added: (j) pre-existing, not fixed: a GPS timestamp without a UTC offset makes the engine stop with an error (no ruling, no tier), so such a case reaches no automatic ruling but also no routing; normalizing it needs a data-quality rule (DQ-03 or DQ-04); (k) frozen area (D34), not fixed: the reader's answers_question orders the driver's messages by their timestamp text, the defect fixed for GPS pings in (i); (l) the fuzz generator makes no advance bookings; V101 and V103 pin the advance-booking edges. Jasper's decisions of 2026-10-14: (a), (b) and (c) CW-R06, FC-R01 and AUTH-03 stay B as they are; (g) the radius's low end is raised to 20 m, above ordinary phone GPS error (D29; ARRIVAL_GEOFENCE_M in reference_data.yaml, credibility D); the other points stay as recorded."}
  - {id: D40, topic: "Safety routing without a word list (FX6), several drop-offs (FX7), taxonomy gaps (FX8) and wording (FX9)", default_v0_1: "CLS-01 fired on a word list and CLS-03's safety exception named only CLS-01, so a mid-trip ejection with no listed word went to normal support (complaint C08); SE-CONDUCT had no definition (C02, C05, C06, C11); ENT-TRIP had one drop-off (verdict O08), so a stop the rider added read as a detour; no leaf for a fare that differs from the booking or a charge the driver made up (C15, C07, C18, C19); no rule for an unstated canceling party (C04).", changed: "A4 (2026-10-14): CLS-01 is a definition read for meaning with examples (violence and threats, sexual misconduct, kidnapping or being held, an unsafe drop-off or being stranded, dangerous or impaired driving, an accident or injury, discrimination, a crime), unclear text counts as safety (S1), rudeness alone is feedback; mode READ; most examples are Ryde's Code of Conduct and community standards. CLS-03's exception covers any SE type and CLS-02 makes any SE claim primary. SE-CONDUCT and EX-FEEDBACK are defined. ENT-TRIP has_dropoff is 1:N and ordered; destination_edit_accepted is the destination-change event (a stop_added or destination_edit_requested event alone changes nothing until the driver accepts); FC-F02 measures against the recommended route through the final itinerary, split at the point nearest the car at each accepted change, with the actual path measured whole (a deviation before the change stays a detour), and FC-R01, FC-R03, FC-R05, FC-R08, FC-R12 and FC-F01 follow; the toll engine escalates (FC-R12) when the itinerary changed, or a record points to a change without showing it was accepted, and the recommended route on record is not marked as following it, if that route can change the amount; fc_r01 reads the same records (itinerary_change). New leaves FC-FAREMISMATCH and FC-DRIVERCHARGE (BACKLOG, so GEN-R07 escalates them); new rule CLS-06 (the canceling party comes from the trip record: reason, cancelled_by, the cancel events and the system message; a rider cancellation is CW-RIDERCANCEL; a driver cancellation for another reason or a system cancellation is CW-OTHER; records that disagree, cannot be read or are silent, or a driver cancellation with no reason, give REQUEST_INFO at tier HUMAN with no fee ruling), in the rule text, the DT-CW-NOSHOW precondition, PB-CW-NOSHOW and PB-CW-RIDERCANCEL step 1, and the engine. FX9: EXP-03 exempts numbers in verbatim quotes; CW-F02B's note adds the 2024 driver pages; CW-R08 defines the assignment ETA of an advance booking (the scheduled time, or the app's ETA for a request accepted after the cut-off) and does not count a driver already waiting at the pick-up as not moving; the ontology labels O09 and O10 as FairRyde design. Tests: V104 to V118 (no-show engine), T40 to T53 and FC-R01 R9 and R10 (ERP), a4_check (rule cards, the safety patterns on ordinary and safety text, the EXP-03 quote exemption).", decide: "done in A4. For Jasper: (a) the reference engine's safety check is still a list (SAFETY_PATTERNS, whole-word patterns since check round 1, erring toward safety); it misses paraphrases that use none of its patterns (a reviewer found 22 of 22 such texts missed), so it is a test stand-in, not the classifier; the definition is for the LLM classifier, and validation round 2's taxonomy texts test it; (b) FC-FAREMISMATCH and FC-DRIVERCHARGE are BACKLOG (a person decides); a driver who made up a charge may also deserve a fraud signal (FRD-01 does not cover it yet); (c) discrimination now makes a claim SE-CONDUCT and primary even when the complaint is mainly about a fee (C05's discriminatory refusal is now a safety claim, not CW-DRIVERNOSHOW); (d) the case data has no field for several drop-offs in the organizer's sample (trip_data.stops is a data gap). Check round 1 (A4) added: (e) CLS-01 now counts abuse or harassment of any kind (insults, slurs, personal questions, comments on appearance, personal contact after the trip) as safety content, following Ryde's Code of Conduct item 5, and keeps only an unfriendly manner, a raised voice or a curt reply as feedback; where that line lies is FairRyde's design and Jasper's call; (f) CLS-01 no longer names a rider under the influence (Ryde's text is about the driver), and being stranded counts only when the driver made the passenger leave or left them behind, so a cleaning claim about a drunk rider or a cancellation complaint saying 'stranded' is not safety content by those examples alone; (g) the engine records no secondary EX-FEEDBACK claim for a rudeness complaint (V107); the claim splitting of CLS-02 is for the LLM classifier; (h) FC-R12 for a changed itinerary now applies only when the recommended route can change the amount, so a RydeSEND claim or one with no ERP passed or charged keeps its automatic ruling; (i) a reclassified case with safety content now goes to a person (gate G4), as CLS-01 requires; (j) safety_termination does not name the party, so CLS-06 takes the party from the other records. Check round 2 (A4) added: (k) a CW-R08 waiver can be automatic: CW-R08 is D, but decisive_definition makes a D outcome rule decisive only through a decision-table row and CW-RIDERCANCEL has no table (the same gap as D39 (h) for FC-R07); A4 narrowed the 'not moving' ground for advance bookings (an early driver waiting nearby is not a ground), and whether every CW-R08 waiver should need approval is Jasper's call; (l) the reference engines read the trip record's wording with patterns (canceling_party in engine_noshow.py, itinerary_change in engine_toll.py); a record they cannot read counts as disagreeing or as a possible change, so it goes to a person, never to an automatic ruling. Jasper's decisions of 2026-10-14: (a) the engine's safety pattern list and (d) the missing field for several drop-offs (trip_data.stops) are known limitations of v0.2; (e) the line between rudeness and abuse stays as A4 drew it; (k) every CW-R08 waiver needs approval, in line with D29 (AUTH-02 trigger 13, CW-R08, PB-CW-RIDERCANCEL step 5)."}

