  SOFT_FLAG_PENALTY: {value: 0.10, source_type: FAIRRYDE, credibility: D, plausible_range: [0.05, 0.20], flag_only: true, retrieved: 2026-10-05, note: "AUTH-05: subtracted from E for each soft data flag. Same as the 4 Oct report."}
