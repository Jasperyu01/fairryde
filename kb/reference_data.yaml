  TAU: {value: 0.60, source_type: FAIRRYDE, credibility: D, plausible_range: [0.50, 0.80], retrieved: 2026-10-05, note: "Calibrate on the dev set: the lowest value at which no wrong ruling is auto-resolved. Affects the approval tier only."}
  CONFIDENCE_WEIGHTS: {value: {A_run_agreement: 0.35, M_threshold_margin: 0.25, E_evidence_completeness: 0.25, R_rules_engine_agreement: 0.15}, source_type: FAIRRYDE, credibility: D, retrieved: 2026-10-05, note: "Rule AUTH-05."}
  PROFILE: {value: "organizer_case (built from the case's own policy object) if the case embeds one, else the Ryde profile in force on the trip date", source_type: FAIRRYDE, credibility: D, retrieved: 2026-10-05}

