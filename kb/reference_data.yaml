# FairRyde Knowledge Base - Rules layer, part 2: REFERENCE DATA (参考数据表)
# ChordX ONT.10b: facts the model must not guess are fixed here with value, unit, source, date and note.
# Code answers from these tables and says where the value came from. If a value is missing, the model may estimate,
# but must label the answer as an estimate (一般估算).

meta:
  kb: FairRyde Knowledge Base
  layer: Rules / reference data
  version: 0.3.0
  status: draft
  updated: 2026-10-14
  owner: Jasper
  how_profiles_work: >-
    A case is evaluated under exactly one profile (rule META-01). Profile parameters override shared parameters.
    Shared parameters are FairRyde assumptions (credibility C or D) that apply to every profile unless overridden.
  not_live_integration: >-
    These tables are expert-maintained lookups (values read by a person from an authoritative page or tool on the
    retrieved date). They are not live integrations with Ryde, OneMap or LTA and must never be described as connected.
  fields:
    value: The value used by the code.
    unit: Unit of the value.
    source_type: One of TX-SOURCE-TYPE.
    source: Where the value comes from (document id and quoted words where possible).
    source_date: Date of the source document (Ryde article edited date, organizer file date, table effective date).
    retrieved: Date a person read the value.
    credibility: A to D (rules.yaml credibility_scale).
    plausible_range: "For C and D numeric parameters only: the range of values the team considers reasonable. Used by the AUTH-02 sensitivity test: if the outcome changes inside this range, the rule using the parameter is decisive and the case needs human approval."
    flag_only: "True when the parameter only adds a flag or lowers confidence and can never change an outcome."

# =====================================================================
profiles:

  organizer_v2_1:
    applies_when: >-
      The default for organizer cases (a dispute_id of the form DISP-nnn): the Rider Advocate, Driver Advocate and Judge work under the organizer's
      Ryde Dispute Resolution Policy v2.1, which says so itself ("Applies To: All AI dispute resolution agents (Rider Advocate, Driver Advocate,
      Judge) and human reviewers in the RydeResolve system."). Decision D41 (Jasper, 14 Oct 2026).
    effective_from: 2026-01-01
    effective_note: "Policy v2.1 'Effective Date: 1 January 2026' (Appendix B, revision 2.1 of 2026-01-01). A trip before that date is escalated as a policy gap (META-02, GEN-R07)."
    fallback_profile: ryde_2026
    fallback_note: >-
      Every parameter that v2.1 governs is listed below and none is inherited. What v2.1 does not cover (the rider cancellation fee, the waiting
      time fee, the waiver window, the ERP rates, the destination-edit fee) uses the Ryde profile, and the trace says so (META-01).
    embedded_policy_object: >-
      DISP-002 also embeds a cancellation_policy object. Under this profile it is read as a cross-check, not as the source of the numbers: free_wait_time_min 5
      and cancellation_fee_after_wait 5.00 agree with v2.1 (Sections 2.1 and 2.2); no_show_threshold_min 8 has no counterpart in v2.1 and is not used. Where
      the object and v2.1 give different outcomes the case is escalated (SOURCE_CONFLICT, META-04); decision D41.
    params:
      FREE_WAIT_S: {value: 300, unit: s, source_type: ORGANIZER, source: "ORG-POLICY-V21 Section 2.1: 'free wait time of 5 minutes' from the scheduled pickup time", source_date: 2026-01-01, retrieved: 2026-10-14, credibility: A, note: "Ryde profile: 180 s from the driver's arrival (RYDE-23534478435353). Decision D42."}
      NO_SHOW_THRESHOLD_S: {value: 300, unit: s, source_type: ORGANIZER, source: "ORG-POLICY-V21 Section 2.1: 'After 5 minutes, the driver may cancel the trip as a \"rider no-show.\"'", source_date: 2026-01-01, retrieved: 2026-10-14, credibility: A, note: "The free wait and the no-show threshold are the same 5 minutes in v2.1; there is no separate 8-minute threshold (DISP-002's embedded object has one). Decision D42."}
      THRESHOLD_COMPARISON: {value: more_than, source_type: ORGANIZER, source: "ORG-POLICY-V21 Section 2.1: 'After 5 minutes'", source_date: 2026-01-01, retrieved: 2026-10-14, credibility: A}
      NO_SHOW_FEE_SGD: {value: 5.00, unit: SGD, source_type: ORGANIZER, source: "ORG-POLICY-V21 Section 2.2: 'A no-show cancellation fee of $5.00 is charged to the rider'", source_date: 2026-01-01, retrieved: 2026-10-14, credibility: A, note: "Ryde profile: S$6.61 (S$5.00 base plus platform and transaction fees). Decision D43."}
      FEE_PAYEE: {value: DRIVER, source_type: ORGANIZER, source: "ORG-POLICY-V21 Section 2.2: 'The cancellation fee is transferred to the driver as compensation for time and fuel.'", source_date: 2026-01-01, retrieved: 2026-10-14, credibility: A}
      WAIT_ANCHOR_FIELD: {value: trip_data.scheduled_time, source_type: ORGANIZER, source: "ORG-POLICY-V21 Section 2.1: 'free wait time of 5 minutes from the scheduled pickup time'", source_date: 2026-01-01, retrieved: 2026-10-14, credibility: A, note: "Without a scheduled time the engine falls back to the driver's arrival record (CW-F02C). Decision D42."}
      CONTACT_MIN_CALLS: {value: 1, source_type: ORGANIZER, source: "ORG-POLICY-V21 Section 2.3: 'At least 1 phone call (via the in-app calling system).'", source_date: 2026-01-01, retrieved: 2026-10-14, credibility: A}
      CONTACT_MIN_MESSAGES: {value: 1, source_type: ORGANIZER, source: "ORG-POLICY-V21 Section 2.3: 'At least 1 in-app chat message'", source_date: 2026-01-01, retrieved: 2026-10-14, credibility: A, note: "Both obligations are required (AND), and failing either voids the fee (CW-R13). Decision D44."}
      CONTACT_VOID_WHEN: {value: either_missing, source_type: FAIRRYDE, credibility: D, retrieved: 2026-10-14, source: "ORG-POLICY-V21 Section 2.3: 'If the driver fails to meet both contact obligations, the cancellation fee is voided'", note: "Reading of an ambiguous sentence (decision D44): either_missing voids the fee when the driver sent no message or made no call; both_missing only when the driver did neither (Precedent 7.3's facts). The reading test tests the other value."}
      DRIVER_LATE_GRACE_S: {value: 300, unit: s, source_type: ORGANIZER, source: "ORG-POLICY-V21 Section 2.4: 'scheduled pickup time + 5 minutes'", source_date: 2026-01-01, retrieved: 2026-10-14, credibility: A, note: "Replaces the Ryde profile's 180 s (Grab and Gojek practice, credibility C). The reference is the scheduled pickup time, not the assignment ETA. Decision D45."}
      DRIVER_NOSHOW_CREDIT_SGD: {value: 5.00, unit: SGD, source_type: ORGANIZER, source: "ORG-POLICY-V21 Section 2.4: 'the rider is eligible for a $5.00 goodwill credit'", source_date: 2026-01-01, retrieved: 2026-10-14, credibility: A}
      DEVIATION_TOLERANCE_KM: {value: 1.0, unit: km, source_type: ORGANIZER, source: "ORG-POLICY-V21 Section 1.3: 'Deviation > 1km?'", source_date: 2026-01-01, retrieved: 2026-10-14, credibility: A, note: "More than 1 km is a deviation; 1 km or less is within tolerance. Replaces DETOUR_RATIO_MIN and DETOUR_EXTRA_KM_MIN (DiDi, C) for organizer cases."}
      ROUTE_AI_MAX_KM: {value: 2.0, unit: km, source_type: ORGANIZER, source: "ORG-POLICY-V21 Section 6.2: 'AI agent ruling if confidence \u2265 80% and deviation \u2264 2km, else escalate'", source_date: 2026-01-01, retrieved: 2026-10-14, credibility: A}
      TOLLS_TREATMENT: {value: PASS_THROUGH, source_type: ORGANIZER, source: "ORG-DISP001 recommended_ruling.breakdown.note: 'Only the excess distance fare is refunded. Tolls are passed through at cost.'", source_date: 2026-09, retrieved: 2026-10-14, credibility: D, note: "FC-R08 and the FC-R01 toll claim refund nothing under this profile. Policy v2.1 itself is silent on tolls; the one statement is the reference answer of sample DISP-001, used here as a rule source for this single parameter on Jasper's decision (D47), so it is D. The organizer is asked about tolls together with 'full refund' (O17)."}
      RULING_FINAL_BELOW_SGD: {value: 10.00, unit: SGD, source_type: ORGANIZER, source: "ORG-POLICY-V21 Section 6.1: 'Under $10 | AI agent ruling is final | Any confidence level'", source_date: 2026-01-01, retrieved: 2026-10-14, credibility: A, note: "Strictly under. Replaces AUTO_LIMIT_SGD for organizer cases. Decision D48."}
      HUMAN_REVIEW_ABOVE_SGD: {value: 50.00, unit: SGD, source_type: ORGANIZER, source: "ORG-POLICY-V21 Section 6.1: 'Above $50 | Always human review'", source_date: 2026-01-01, retrieved: 2026-10-14, credibility: A, note: "Strictly above; S$50.00 itself is in the $10 to $50 band."}
      CONFIDENCE_MIN: {value: 0.80, source_type: ORGANIZER, source: "ORG-POLICY-V21 Section 6.1: '$10 - $50 | AI agent ruling with 80%+ confidence'", source_date: 2026-01-01, retrieved: 2026-10-14, credibility: A, note: "Replaces TAU (0.60) for organizer cases."}
      CONFIDENCE_MIN_FRAUD_FLAG: {value: 0.95, source_type: ORGANIZER, source: "ORG-POLICY-V21 Section 6.3: 'If any party has a fraud flag \u2265 1, the confidence threshold is raised to 95% regardless of dispute value.'", source_date: 2026-01-01, retrieved: 2026-10-14, credibility: A}
      D29_CONFIDENCE_PENALTY: {value: 0.10, source_type: FAIRRYDE, credibility: D, plausible_range: [0.05, 0.25], retrieved: 2026-10-14, note: "Decision D52 (Jasper, 14 Oct 2026): D29 (an uphold that rests on FairRyde's own GPS presence logic always needs approval) conflicts with Section 6.2 ('No-show / cancellation | AI agent ruling is final'). Under this profile D29 is a confidence penalty on C; Section 6 decides the tier from C. The penalty changes a tier only where C meets a threshold (95% with a fraud flag, 80% in the S$10 to S$50 band); below S$10 without a fraud flag Section 6.1 accepts any confidence. The old D29 approval also remains through decision-table rows R9 and R11 (D52, question O26)."}
      REMEDY_FORM: {value: ORIGINAL_PAYMENT_METHOD, source_type: ORGANIZER, source: "ORG-DISP001 recommended_ruling.actions[0].method: 'original_payment_method'; ORG-POLICY-V21 precedent 7.3: 'The $5.00 fee is reversed and refunded to the rider.'", source_date: 2026-09, retrieved: 2026-10-14, credibility: A, note: "Section 3.3 does not name a form; the surge refund and the fee void take the form the route sample and Precedent 7.3 show."}

  organizer_case:
    applies_when: >-
      LEGACY (KB v0.2, superseded as the organizer default by organizer_v2_1 on 14 Oct 2026, decision D41). It still applies to a case that is not an
      organizer case (no DISP-nnn id) but embeds its own cancellation_policy object, such as regression case E04, so META-01's reading of an embedded
      object stays testable, and it can be forced to reproduce the v0.2 result for DISP-002.
    built_from_case: >-
      At run time the engine reads the case's own cancellation_policy object through ontology.yaml disp002_mapping (field,
      parameter, scale): the four case_fields below come only from the case. Anything the object does not carry, and every
      other parameter not listed under params, falls back to the fallback_profile (META-01), and the trace says so.
      case_example_DISP002 documents DISP-002's values; the code never reads them, so a case without a field cannot silently
      inherit DISP-002's value.
    effective_from: case-specific
    fallback_profile: ryde_2026
    case_fields: {FREE_WAIT_S: cancellation_policy.free_wait_time_min, NO_SHOW_THRESHOLD_S: cancellation_policy.no_show_threshold_min, NO_SHOW_FEE_SGD: cancellation_policy.cancellation_fee_after_wait, FEE_PAYEE: cancellation_policy.fee_goes_to}
    case_example_DISP002:
      FREE_WAIT_S: {value: 300, unit: s, source_type: ORGANIZER, source: "DISP-002 cancellation_policy.free_wait_time_min = 5", source_date: 2026-09, retrieved: 2026-10-04, credibility: A}
      NO_SHOW_THRESHOLD_S: {value: 480, unit: s, source_type: ORGANIZER, source: "DISP-002 cancellation_policy.no_show_threshold_min = 8", source_date: 2026-09, retrieved: 2026-10-04, credibility: A}
      NO_SHOW_FEE_SGD: {value: 5.00, unit: SGD, source_type: ORGANIZER, source: "DISP-002 cancellation_policy.cancellation_fee_after_wait = 5.00", source_date: 2026-09, retrieved: 2026-10-04, credibility: A}
      FEE_PAYEE: {value: DRIVER, source_type: ORGANIZER, source: "DISP-002 cancellation_policy.fee_goes_to = driver_compensation", source_date: 2026-09, retrieved: 2026-10-04, credibility: A}
    params:
      THRESHOLD_COMPARISON: {value: at_least, source_type: ORGANIZER, source: "DISP-002 app event 08:51:00 'No-show threshold (8 min) reached.' logged exactly 8:00 after driver_wait_start", source_date: 2026-09, retrieved: 2026-10-04, credibility: A}
      WAIT_ANCHOR_FIELD: {value: trip_data.driver_wait_start, source_type: ORGANIZER, source: "DISP-002 trip_data.driver_wait_start", source_date: 2026-09, retrieved: 2026-10-04, credibility: A}
      REMEDY_FORM: {value: WALLET_VOUCHER, source_type: FAIRRYDE, source: "Organizer data does not say how refunds are paid; Ryde's voucher form assumed", source_date: 2026-10-05, retrieved: 2026-10-05, credibility: D, note: "Changes only the form of a remedy, never the outcome."}

