  - id: CW-R03
    name: No-show cancellation fee is valid
    family: CW
    type: outcome
    applies_to: [CW-NOSHOW]
    statement: >-
      The fee stands when all of Ryde's conditions are established: the driver canceled with reason rider_no_show; the arrival
      indication is valid (CW-R06); the driver stayed at the pick-up point during the wait (CW-F04); and the wait meets the
      threshold (CW-F03). How FairRyde handles sparse GPS, missing records and rider counter-evidence is set out row by row in
      decision table DT-CW-NOSHOW, with each row's own credibility.
      Organizer profile: the case's policy object (DISP-002: S$5.00, no-show cancellation at 8 minutes). Ryde profile: S$6.61
      after more than 3 minutes.
    zh: Ryde 的条件全部成立时取消费成立：司机以乘客缺席取消、到达有效、等待期间在上车点、等待达到阈值。稀疏 GPS、记录缺失和乘客反证怎么处理，见决策表 DT-CW-NOSHOW 每一行（各行有自己的可信度）。组织方参数档用案件自带政策（DISP-002：S$5、8 分钟）；Ryde 参数档 S$6.61、超过 3 分钟。
    params: [NO_SHOW_THRESHOLD_S, THRESHOLD_COMPARISON, NO_SHOW_FEE_SGD]
    inputs: [Trip.cancellation_reason, F-ARRIVAL-VALID, F-PRESENCE, F-GPS-LOGIC, F-WAIT-MARGIN]
    produces: [CW-R-NOSHOW-VALID, CW-R-WAIT-SHORT, CW-R-DRIVER-LEFT]
    decision_table: DT-CW-NOSHOW
    sources:
      - {type: ORGANIZER, doc: ORG-DISP002, quote: '"no_show_threshold_min": 8', profile: organizer_case}
      - {type: ORGANIZER, doc: ORG-DISP002, quote: '"cancellation_fee_after_wait": 5.00', profile: organizer_case}
      - {type: RYDE_POLICY, doc: RYDE-23534478435353, quote: 'Rider will be charged a Cancellation Fee of $6.61* if:', profile: ryde_2026, note: "Quoted for the amount; the operative condition is the next quote."}
      - {type: RYDE_POLICY, doc: RYDE-23534478435353, quote: 'The driver presses "I''m Here", waits for > 3 minutes for the rider to arrive at the pick-up point and cancels the trip (Rider NO SHOW and no trip completion)', profile: ryde_2026}
    credibility: A
    mode: HARD
    status: draft

  - id: CW-R04
    name: No contact attempt blocks automatic upholding
    family: CW
    type: procedural
    applies_to: [CW-NOSHOW]
    statement: >-
      If F-CONTACT is NONE (no driver call or message and no rider contact), do not auto-uphold: keep the outcome from CW-R03,
      add flag CONTACT_NOT_ATTEMPTED and require human approval. Ryde's text does not make contact a condition of the fee,
      so FairRyde does not invent a waiver ground from it.
    zh: 完全没有联系记录时不自动维持，打标记并转人工批准；Ryde 未把联系列为收费条件，所以不据此直接免费。
    produces: []
    sources:
      - {type: RYDE_POLICY, doc: RYDE-115001438754, quote: 'If the rider still cannot be reached, you may need to cancel the trip.'}
    credibility: D
    credibility_note: Ryde's driver guidance expects a contact attempt before canceling (B, older article); making its absence a reason for human approval is FairRyde's choice (D). It changes the approval tier only, never the outcome.
    mode: HARD
    status: draft

  - id: CW-R05
    name: Waiting time fee is valid
    family: CW
    type: outcome
    applies_to: [CW-WAITING]
    statement: >-
      A waiting fee stands if the driver pressed "I'm Here", the rider boarded after the free waiting period (FREE_WAIT_S;
      Ryde: more than 3 minutes), the driver completed the trip, and the driver tapped the waiting-fee button at drop-off.
      It cannot be added after the trip is completed.
    zh: 司机按"I'm Here"、乘客在免费等待期（Ryde 为超过 3 分钟）之后才上车、司机完成行程、下车时点了等候费按钮，等候费成立；行程结束后不能补加。
    params: [WAITING_FEE_SGD, FREE_WAIT_S]
    produces: [CW-R-WAITING-VALID, CW-R-WAITING-INVALID]
    sources:
      - {type: RYDE_POLICY, doc: RYDE-23534478435353, quote: 'Riders may be charged a Waiting Time Fee of $5 at the end of the trip if:'}
      - {type: RYDE_POLICY, doc: RYDE-23534478435353, quote: 'The driver presses "I''m Here", waits for > 3 minutes for the rider to board, and continues the trip (Rider boards and driver completes trip).'}
      - {type: RYDE_POLICY, doc: RYDE-4408079464217, quote: 'Drivers are advised to tap on the waiting time fee toggle upon drop-off as we are unable to charge the rider once the trip is completed.'}
    credibility: A
    mode: HARD
    status: draft
    open_question: "What the organizer's 5-minute free wait and 8-minute no-show threshold each control (question O10)."

  - id: CW-R06
    name: Arrival counts only if GPS shows the driver at the pick-up point
    family: CW
    type: eligibility
    applies_to: [CW-NOSHOW, CW-WAITING]
    statement: >-
      An arrival indication is valid only if the driver was at the pick-up location according to GPS. Driver pings are sorted
      by time and GPS outliers are set aside first (CW-F04B: an outside stretch seen for less than LEFT_MIN_OUTSIDE_S before
      the driver is seen inside again, or one reached at an impossible speed; the approach before the driver is first seen
      inside is never an outlier on duration). The moment
      ping is the last remaining ping from PING_MAX_GAP_S before the arrival event to TS_TOLERANCE_S after it. Confirmed at the
      arrival: the platform's own recorded GPS arrival check (DISP-002: "Driver GPS within 10m of pickup point."), or a moment
      ping inside ARRIVAL_GEOFENCE_M. Contradicted: the moment ping is outside the area and was taken at or after the arrival
      event. Values: CONTESTED if the platform check is contradicted (GEN-R02); TRUE if confirmed at the arrival; TRUE with
      flag ARRIVAL_UNCONFIRMED if not confirmed at the arrival but a remaining ping more than TS_TOLERANCE_S after it and
      before the cancellation is inside the area (the wait then counts from that ping, CW-F03); FALSE if neither, and
      remaining pings exist from the arrival to the cancellation (outliers never count as evidence of being outside);
      UNKNOWN otherwise (no arrival indication, or no remaining ping from the arrival on). Ryde's condition is the
      confirmation at the arrival and FALSE; the other parts are FairRyde's and belong to rules rated D: setting outliers
      aside (CW-F04B), the later confirmation (ARRIVAL_UNCONFIRMED, CW-F03B), CONTESTED (GEN-R02, DQ-01) and UNKNOWN
      (GEN-R01). A ruling that rests on one of them is on a row rated D: R2 (CONTESTED, escalation), R3 (UNKNOWN, a waiver
      that needs approval), and R9 or R11 for a fee upheld while F-GPS-LOGIC is true (CW-F04B). A waiver for a short wait (R6, A) can rest on the
      later confirmation, because it moves the wait start; CW-F03B's start test then makes CW-F03B decisive whenever another
      reading changes the outcome (decisive_definition clause 1).
    zh: 只有 GPS 显示司机在上车点，到达才有效。先按时间排序定位点，并剔除 GPS 离群点（见 CW-F04B：在外不到 LEFT_MIN_OUTSIDE_S 又回到半径内的时段，或以不可能车速到达的点；司机第一次进入上车区域之前的驶近点不按时长算离群）。"到达时刻点"取到达前 PING_MAX_GAP_S 到到达后 TS_TOLERANCE_S 之间剩下的最后一个点。平台记录的 GPS 到达校验，或到达时刻点在半径内，算到达时已确认；到达时刻点在半径外且时间不早于到达，算被否定。平台校验被否定为 CONTESTED；到达时已确认为 TRUE；到达时未确认、但到达 TS_TOLERANCE_S 之后、取消之前有剩下的点在半径内，为 TRUE 并打 ARRIVAL_UNCONFIRMED（等待从那个点起算，见 CW-F03）；两者都不满足、但从到达到取消之间还有剩下的点，为 FALSE（离群点不能证明司机在外面）；其余为 UNKNOWN（没有到达记录，或到达之后没有剩下的点）。Ryde 的条件是到达时的确认和 FALSE；其余部分是 FairRyde 的，归可信度为 D 的规则：剔除离群点（CW-F04B）、之后才确认（ARRIVAL_UNCONFIRMED，CW-F03B）、CONTESTED（GEN-R02、DQ-01）和 UNKNOWN（GEN-R01）。裁决依赖其中任何一项时，所在决策表行可信度为 D：R2（CONTESTED，转人工）、R3（UNKNOWN，免除收费但需批准），以及 F-GPS-LOGIC 为真时维持收费的 R9 或 R11（CW-F04B）。因等待时间不足而免除（R6，A）可以依赖之后的确认，因为它后移了等待起点；这时由 CW-F03B 的起点测试判断：另一种读法改变结果时 CW-F03B 是决定性的（decisive_definition 第 1 条）。
    params: [ARRIVAL_GEOFENCE_M, TS_TOLERANCE_S, PING_MAX_GAP_S]
    produces_finding: F-ARRIVAL-VALID
    produces: [CW-R-DRIVER-NOT-AT-PICKUP]
    sources:
      - {type: RYDE_POLICY, doc: RYDE-4407754403353, quote: 'Drivers are only allowed to indicate arrival and impose the Waiting Time Fee only if he/she:'}
      - {type: RYDE_POLICY, doc: RYDE-4407754403353, quote: 'Is at the pick-up location according to GPS data'}
      - {type: RYDE_POLICY, doc: RYDE-4407754403353, quote: 'Otherwise, you will not be charged the $6.61 Waiting Time Fee if any of the above are not fulfilled.'}
      - {type: ORGANIZER, doc: ORG-DISP002, quote: 'Driver GPS within 10m of pickup point. Speed 0 km/h. Auto-arrival confirmed.', profile: organizer_case}
    credibility: B
    credibility_note: >-
      The article calls the S$6.61 charge a "Waiting Time Fee", while the main policy page calls S$6.61 the Cancellation Fee
      (META-04 known conflict). Reading the condition as covering the no-show cancellation fee is an interpretation, so the
      norm is B. The interpretation is made once for all cases (the META-04 resolution), so applying it to a case is HARD.
      The radius, time tolerance and look-back window are FairRyde parameters (D), tested case by case by the sensitivity
      test. The A3 census (validation/round2/census.csv, round 1 finding FX4) found FairRyde elements in the v0.1 card: the
      outlier step, ARRIVAL_UNCONFIRMED, CONTESTED and UNKNOWN. They are rated D in the rules they belong to (CW-F04B,
      CW-F03B, GEN-R02, GEN-R01). Every row whose ruling rests on them is rated D (R2 escalation, R3 waiver, R9 and R11
      upheld fees); a short-wait waiver (R6) that rests on the later confirmation is caught by CW-F03B's start test instead. Ryde's
      condition itself stays B; whether this delegation meets FX4's weakest-element rule, or the card must be split as
      CW-F04 was, is open item D39 (a).
    mode: HARD
    status: draft

  - id: CW-R07
    name: Rider cancellation fee is valid
    family: CW
    type: outcome
    applies_to: [CW-RIDERCANCEL]
    statement: A rider who cancels more than 3 minutes after matching (or after the advance-booking window) is charged S$6.61, unless CW-R08 applies.
    zh: 乘客在匹配 3 分钟后（或预约窗口外）取消，收 S$6.61，除非适用 CW-R08。
    params: [FREE_CANCEL_WINDOW_S, RIDER_CANCEL_FEE_SGD]
    produces: [CW-R-RIDERCANCEL-VALID]
    sources:
