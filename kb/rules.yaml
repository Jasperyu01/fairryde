  - id: FC-R03
    name: Unjustified detour on a recalculated fare
    family: FC
    type: outcome
    applies_to: [FC-ROUTE]
    statement: >-
      For RECALCULATED fares: DR at least DETOUR_RATIO_MIN, extra distance at least DETOUR_EXTRA_KM_MIN, spatial
      confirmation, and no justification (FC-F03) means a confirmed detour; refund per FC-R05. DR and the extra distance are
      measured against the recommended route through the final itinerary (FC-F02), so a stop or a destination change the
      rider made is never a detour. METERED fares (RydeTAXI) are
      excluded by FC-R00.
    zh: 重算车费：绕路比和多出里程都达阈值、空间确认且无正当理由，即认定绕路，按 FC-R05 退款。绕路比和多出里程以经过最终行程单的推荐路线为准（FC-F02），所以乘客自己加的站或改的目的地不算绕路。计程车费（RydeTAXI）按 FC-R00 排除。
    params: [DETOUR_RATIO_MIN, DETOUR_EXTRA_KM_MIN]
    produces: [FC-R-DETOUR-CONFIRMED, FC-R-DETOUR-JUSTIFIED]
    sources:
      - {type: REGULATION, doc: LTA-PDVL-OFFENCES, quote: 'Failing, without reasonable cause, to proceed to destination named by a passenger by shortest and most direct route'}
      - {type: INDUSTRY, doc: IND-DIDI-DETOUR, quote: '实际行驶里程÷腾讯地图里程 ≥120% 且 绕路里程≥3 公里，则判定为绕路'}
      - {type: FAIRRYDE, doc: FAIRRYDE-DECISIONS, quote_kind: none, note: "Applying the private-hire (PDVL) route duty to every driver of a recalculated fare, without checking the license, is FairRyde's extension (open item D35)."}
    credibility: D
    credibility_note: >-
      The duty to take the shortest route is in Singapore regulation (B), verified for private-hire (PDVL) drivers only (the
      taxi list was not found); the numeric thresholds are DiDi's published values used as a generic assumption (C). FC-R03
      does not check which kind of driver served the trip (a RydeX trip may be served by a taxi driver, a carpool driver may
      not hold a PDVL), so it extends the duty: D by its weakest element (A3 census, validation/round2/census.csv; it was C in v0.1), as FC-R08.
    mode: HARD+READ
    status: draft

