  - id: FC-R05
    name: Detour refund amount
    family: FC
    type: remedy
    applies_to: [FC-ROUTE]
    statement: >-
      Refund = fare charged minus the fare recomputed on the recommended route through the final itinerary (FC-F02) with the
      same tariff, fee tiers and surcharges;
      floor 0, capped at the fare charged; paid only if at least MIN_REFUND_SGD. Not for METERED fares (RydeTAXI, FC-R00):
      there the same formula gives a difference that is attached for the reviewer as information and is never proposed as a
      refund.
    zh: 退款 = 实收车费减按经过最终行程单的推荐路线（FC-F02）、用同一费率、费用档位和附加费重算的车费；不低于 0、不超过实收；低于最小金额不退。计程车费（RydeTAXI，见 FC-R00）不适用：同一公式算出的差额只作为参考附给审核人，不作为退款建议。
    params: [MIN_REFUND_SGD, TAXI_TARIFF, PLATFORM_FEE_TIERS, TRANSACTION_FEE_LOCAL]
    sources:
      - {type: INDUSTRY, doc: IND-BENCHMARK-NOTES, quote_kind: paraphrase, note: "DiDi charges only the estimated fare when a detour is found (research notes 02 and 08)."}
    credibility: D
    mode: HARD
    status: draft

  - id: FC-R06
    name: ERP is payable by the rider (with exceptions)
    family: FC
    type: eligibility
    applies_to: [FC-TOLL]
    statement: >-
      ERP for the active gantries a trip passed is payable by the rider in the share the service sets (ERP_RIDER_SHARE): 1 for
      RydeFLASH, RydePET, RydeX, RydeXL, RydeLUXE and RydeTAXI, whose fares exclude ERP; 0 for RydeSEND, whose fares include ERP
      (nothing is added to the fare for ERP); 0.5 for a carpool trip, where the total ERP is shared equally and the driver
      bears 50% while the passenger pays the other 50%. A trip is a carpool trip only when the record says so (service type
      CARPOOL, or is_carpool true); the carpool half applies to CARPOOL and to the six services above, and it holds for one
      passenger (several passengers sharing the passenger half are in the scope.yaml backlog, and the record carries no rider
      count). An is_carpool that is not recorded reads as not a carpool trip; for RydeFLASH, which Ryde offers to carpool
      drivers, that is a records gap (RECORDS_MISSING) and the ruling needs approval. FC-R06 takes precedence over the plain
      gantry sum: every rule that computes or compares an ERP amount (FC-F04, FC-R07, FC-R08) applies it first, through FC-F04.
      No share is set for any other service: RydePOOL (the 2026 driver pages say each rider pays 50% of the total toll, the
      2023 driver pages say its fares include ERP), RydeHIRE (the 2023 pages say its fares include ERP), Ryde X GO and Ryde+,
      alone or flagged as carpool; nor for a trip that is both RydeSEND and carpool. There the pages disagree or are silent,
      no single rule covers it, and GEN-R07 applies. A trip whose service type is not recorded is insufficient data (FC-R12).
    zh: 经过的有效闸门的 ERP 由乘客按服务类型确定的份额支付（ERP_RIDER_SHARE）：RydeFLASH、RydePET、RydeX、RydeXL、RydeLUXE、RydeTAXI 车费不含 ERP，份额为 1；RydeSEND 车费已含 ERP，份额为 0（车费之外不再加 ERP）；拼车总 ERP 司乘平分，司机承担 50%、乘客付另外 50%，份额为 0.5。只有记录写明才算拼车行程（服务类型为 CARPOOL，或 is_carpool 为真）；拼车一半只适用于 CARPOOL 和上述六种服务，且只适用于一名乘客（几名乘客分摊乘客那一半属 scope.yaml 的待办，记录里也没有乘客人数）。没有记录 is_carpool 时按非拼车处理；RydeFLASH 是 Ryde 向拼车司机开放的服务，这时属记录缺失（RECORDS_MISSING），裁决须经批准。FC-R06 优先于直接相加闸门费率：计算或比较 ERP 金额的规则（FC-F04、FC-R07、FC-R08）都先按它取份额，经由 FC-F04。其他服务不设份额：RydePOOL（2026 年司机页面说每位乘客付总过路费的 50%，2023 年司机页面说车费已含 ERP）、RydeHIRE（2023 年页面说车费已含 ERP）、Ryde X GO、Ryde+，单独出现或标为拼车都一样；既是 RydeSEND 又是拼车的行程也不设份额。这些情形页面互相矛盾或没有说明，没有单一规则覆盖，按 GEN-R07 转人工。没有记录服务类型的行程属数据不足（FC-R12）。
    params: [ERP_RIDER_SHARE]
    produces: [GEN-R-POLICY-GAP]
    sources:
      - {type: RYDE_POLICY, doc: RYDE-115000772653, quote: 'If a rider passes through an active ERP gantry, the toll charge will be applicable to the rider.'}
      - {type: RYDE_POLICY, doc: RYDE-115001438614, quote: 'The fares for RydeFLASH / RydePET / RydeX / RydeXL / RydeLUXE / RydeTAXI exclude ERP.'}
      - {type: RYDE_POLICY, doc: RYDE-115001438614, quote: 'The fares for RydeSEND include ERP.'}
      - {type: RYDE_POLICY, doc: RYDE-115001438614, quote: 'The driver bears 50% of the ERP charge, and the passenger pays the remaining 50%.'}
      - {type: RYDE_POLICY, doc: RYDE-33363192453785, quote: 'The tolls for RydePOOL are split equally between riders for a shared trip, with each paying 50% of the total toll.', note: "Not used to set a share: it documents why RydePOOL has none (it contradicts the 2023 pages below)."}
      - {type: RYDE_POLICY, doc: RYDE-23575142762393, quote: 'Note: RydePOOL, RydeHIRE and RydeSEND include ERP.', note: "2023 driver page, not used to set a share: it documents the disagreement for RydePOOL and RydeHIRE."}
    credibility: A
    credibility_note: >-
      Every share is Ryde text in a driver article edited 2026-09-02 (A). The order of application, the default for an
      unrecorded is_carpool and the pointers to GEN-R07 and FC-R12 state how the knowledge base uses the text; they add no norm.
      RYDE-115000772653 (rider article, 2024-04-19, B) says ERP is excluded from the fares of every service but RydeSEND, which
      would give Ryde X GO, Ryde+ and RydeHIRE a share of 1; FairRyde does not use it because the newer driver article lists
      six services only and the 2023 pages say RydeHIRE and RydePOOL fares include ERP. The RydePOOL and RydeHIRE
      disagreement could be a META-04 known conflict instead of GEN-R07 (open item D35).
    mode: HARD
    status: draft

  - id: FC-R07
    name: ERP overstated by the driver
    family: FC
    type: outcome
    applies_to: [FC-TOLL]
    statement: >-
      If the ERP charged to the rider exceeds F-ERP-EXPECTED (the rider's share under FC-R06, computed by FC-F04) by more than
      TOLL_TOLERANCE_SGD, refund the difference and raise FRAUD_SIGNAL against the driver; the fraud consequence is for a
      human to decide. The ERP charged is the ERP line the rider was charged (on a carpool trip only the rider's half counts,
      and on a RydeSEND trip any ERP line exceeds the expected 0).
    zh: 实收乘客的 ERP 超过 F-ERP-EXPECTED（FC-R06 定的乘客份额，由 FC-F04 计算）超过 TOLL_TOLERANCE_SGD，退差额并对司机打欺诈信号；欺诈后果由人决定。实收 ERP 指乘客被收的那一行（拼车只算乘客的一半；RydeSEND 的应收为 0，任何 ERP 行都算超收）。
    params: [TOLL_TOLERANCE_SGD]
    produces: [FC-R-TOLL-OVERSTATED, FC-R-TOLL-VALID]
    credibility_note: >-
      The overstatement rule and its fraud consequence are Ryde's (A), with the rider's share from FC-R06 (A). Refunding the
      difference is FairRyde's remedy, as in FC-R10 (D): Ryde's text says only that an excessive amount keyed in is fraudulent.
      By the credibility_principle that element makes the rule D; A2 left it at A for Jasper, who decided on 2026-10-14 that
      it is D (open item D35, step A3). The fraud signal already sends every overstatement to approval (AUTH-02), so the label
      changes no tier. On a carpool trip the comparison with the rider's 50% assumes the ERP line holds what the rider was
      charged (organizer question O15). The tolerance is FairRyde's (D) and is set to S$0.00; the AUTH-02 sensitivity test
      catches cases where a small tolerance would change the outcome.
    sources:
      - {type: RYDE_POLICY, doc: RYDE-115001438614, quote: 'Please key in ERP based on the ERP gantry you passed during the journey.'}
      - {type: RYDE_POLICY, doc: RYDE-115001438614, quote: 'Please bear in mind that if an additional/excessive amount is keyed in, this will be considered fraudulent and drivers will be liable for permanent suspension.'}
      - {type: RYDE_POLICY, doc: RYDE-115001438614, quote: 'The fares for RydeSEND include ERP.'}
      - {type: RYDE_POLICY, doc: RYDE-115001438614, quote: 'The driver bears 50% of the ERP charge, and the passenger pays the remaining 50%.'}
      - {type: FAIRRYDE, doc: FAIRRYDE-DECISIONS, quote_kind: none, note: "The refund of the difference is FairRyde's remedy (a recommendation under Ryde's discretion, AUTH-00); Ryde's text only calls an excessive amount fraudulent. On a metered fare it is kept (D32): the overstated amount is a measured fact (gantries passed times published rates), not a fare recomputation. On a carpool trip, reading the ERP line as what the rider was charged is FairRyde's assumption too (organizer question O15)."}
    credibility: D
    mode: HARD+READ
    status: draft

  - id: FC-R08
    name: ERP caused by an unjustified detour
    family: FC
    type: outcome
    applies_to: [FC-TOLL]
    statement: >-
      If the actual path passed gantries that the recommended route (through the final itinerary, FC-F02) avoids, or passed
      them more often (FairRyde's reading of the ERP difference), and the deviation is unjustified (FC-F03), refund
      what the rider paid above the ERP the recommended route would have cost, up to the extra ERP the detour caused:
      min(ERP(actual), ERP charged to the rider) minus ERP(recommended), floor 0, with ERP(actual) and ERP(recommended)
      computed as in FC-F04 (FC-R06 first: nothing for RydeSEND, whose fare includes ERP; half on a carpool trip). FC-R07's
      refund of an overstated ERP line comes on top, so together they refund at most the ERP charged minus the smaller of
      ERP(actual) and ERP(recommended), never a negative amount. If nothing was charged above ERP(recommended), the refund is 0 and the ERP charge stands
      (FC-R-TOLL-VALID). FC-R08 does not apply to a METERED fare (RydeTAXI), in line with FC-R00 (D32): FairRyde does not rule
      on it and escalates the claim under GEN-R07 (reason GEN-R-POLICY-GAP, tier HUMAN under AUTH-06), attaching ERP(actual),
      ERP(recommended), their difference (information only, never a proposed refund), any FC-R07 finding and the driver's
      response (GEN-R05). The LTA duty it rests on is verified for private-hire (PDVL) drivers only: the LTA list is the PDVL
      offense list as at 1 Apr 2023 and no taxi (TDVL) list was found. FC-R08 does not check which kind of driver served the
      trip (a RydeX trip may be served by a taxi driver, and a carpool driver may not hold a PDVL), which is one more reason
      the refund needs approval (open item D35).
    zh: 实际路径经过推荐路线（按最终行程单，FC-F02）避开的闸门（或经过的次数更多，这是 FairRyde 对 ERP 差额的读法）且绕路无正当理由，退乘客实付超出推荐路线 ERP 的部分，最多为绕路多出的 ERP：min(ERP(实际), 乘客被收的 ERP) 减 ERP(推荐)，不低于 0；ERP(实际) 和 ERP(推荐) 都按 FC-F04 计算（先 FC-R06：RydeSEND 车费已含 ERP，不退；拼车退一半）。FC-R07 对超收 ERP 的退款另算，两者合计最多为乘客被收的 ERP 减 ERP(实际) 与 ERP(推荐) 中较小的一个，不会是负数。若没有超出 ERP(推荐) 的部分，退款为 0，ERP 收费成立（FC-R-TOLL-VALID）。FC-R08 不适用于计程车费（METERED，RydeTAXI），与 FC-R00 一致（D32）：FairRyde 不作裁决，按 GEN-R07 转人工（原因 GEN-R-POLICY-GAP，按 AUTH-06 为 HUMAN），并附 ERP(实际)、ERP(推荐)、两者差额（仅供参考，不作为退款建议）、FC-R07 的认定（如有）和司机的回应（GEN-R05）。它所依据的 LTA 义务只核实到私召车（PDVL）司机：所用 LTA 清单是截至 2023 年 4 月 1 日的 PDVL 违规清单，没有找到出租车（TDVL）清单。FC-R08 不核对服务该行程的是哪类司机（RydeX 行程可能由出租车司机服务，拼车司机可能没有 PDVL），这也是退款须经批准的原因之一（见 D35）。
    params: [ERP_RIDER_SHARE]
    produces: [FC-R-TOLL-FROM-DETOUR, FC-R-TOLL-VALID, GEN-R-POLICY-GAP]
    sources:
      - {type: REGULATION, doc: LTA-PDVL-OFFENCES, quote: 'Failing, without reasonable cause, to proceed to destination named by a passenger by shortest and most direct route', note: "LTA's list is the PDVL (private-hire driver's vocational license) offense list as at 1 Apr 2023; the taxi (TDVL) list was not retrievable (research note 09, item 24)."}
      - {type: FAIRRYDE, doc: FAIRRYDE-DECISIONS, quote_kind: none, note: "Turning the route duty into an ERP refund, and escalating a metered fare instead (D32), are FairRyde's choices. Settled in step A2 on Jasper's instruction (11 Oct 2026)."}
    credibility: D
    credibility_note: >-
      The route duty is regulatory (B) and verified for PDVL drivers only; turning it into a platform-computed ERP refund is
      FairRyde's generalization (D), and so is the exclusion of metered fares (D32), which extends Ryde's RydeTAXI text as
      FC-R00 does. A Ryde or regulatory condition extended by FairRyde is D under the credibility_principle. FC-R08 was C in
      v0.1 (round 1 finding FX3). FC-F03 is a READ rule: whenever the detour could change the amount (the rider paid more than
      ERP(recommended) and the path passed an extra gantry), reading the justification the other way would change it, so
      FC-F03 is decisive and the ruling needs approval (AUTH-02, decisive_definition 1).
    mode: HARD+READ
    status: draft

  - id: FC-R09
    name: Add/edit destination fee
    family: FC
    type: eligibility
    applies_to: [FC-DEST]
    statement: The S$3.00 add/edit destination fee applies only if the driver accepted the rider's edit request; the fare is recalculated; RydePOOL, RydeTAXI and multiple-stop bookings cannot change the destination.
    zh: 司机接受改目的地请求才收 S$3.00 并重算车费；RydePOOL、RydeTAXI 和多站单不能改目的地。
    params: [DEST_EDIT_FEE_SGD]
    produces: [FC-R-DEST-FEE-VALID, FC-R-DEST-FEE-INVALID]
    sources:
      - {type: RYDE_POLICY, doc: RYDE-51399796192921, quote: 'If the driver accepts your edit destination request, a $3.00 add/edit destination fee will apply.'}
      - {type: RYDE_POLICY, doc: RYDE-50798691815449, quote: '*RydePOOL, RydeTAXI & Multiple stop bookings are not allowed to make any changes in destination.'}
    credibility: A
    mode: HARD
    status: draft

  - id: FC-R10
    name: Trip completed without the rider onboard
    family: FC
    type: outcome
    applies_to: [FC-NOPICKUP]
    statement: >-
      If records show the rider never boarded (the driver tapped Pick Up away from the pick-up point, or the driver trace never
      reached it, or the rider's trace shows them elsewhere), recommend a full fare refund and open a driver fraud review.
      Ryde says it investigates such cases, so a human approves the refund.
    zh: 记录显示乘客从未上车时，建议全额退款并启动司机欺诈复核；Ryde 写的是"调查"，所以退款由人批准。记录显示乘客已上车则维持车费。
    produces: [FC-R-NOPICKUP-CONFIRMED, FC-R-NOPICKUP-NOT-SUPPORTED]
    sources:
      - {type: RYDE_POLICY, doc: RYDE-18230976652185, quote: 'If you have been charged for a trip that you have not taken, kindly share the details with us to investigate the matter.'}
      - {type: RYDE_POLICY, doc: RYDE-33362721809049, quote: 'Drivers who are found to have overcharged riders or completed trips without the rider onboard may face account suspension.'}
    credibility: D
    credibility_note: Investigation and sanctions are Ryde's (A); the full-refund remedy is FairRyde's inference (D).
    mode: HARD+READ
    status: draft

  - id: FC-R11
    name: Platform and transaction fees
    family: FC
    type: remedy
    applies_to: [FC]
    statement: Platform fee S$1.25 for fares of S$18 and below and S$1.47 above (including GST); local card or RydeCoins transaction fee 1.96% + S$0.24; AMEX and foreign cards 3.3% + S$0.50.
    zh: 平台费 18 新元及以下 S$1.25、以上 S$1.47（含 GST）；本地卡或 RydeCoins 交易费 1.96% + S$0.24；AMEX 与外卡 3.3% + S$0.50。
    params: [PLATFORM_FEE_TIERS, TRANSACTION_FEE_LOCAL, TRANSACTION_FEE_FOREIGN]
    sources:
      - {type: RYDE_POLICY, doc: RYDE-22836370596377, quote: '*First Tier Platform Fee: $1.25 (including GST) for fares $18 and below.'}
      - {type: RYDE_POLICY, doc: RYDE-22836370596377, quote: '*Second Tier Platform Fee: $1.47 (including GST) for fares above $18.'}
      - {type: RYDE_POLICY, doc: RYDE-52594357168281, quote: '1.96% + $0.24 for Local Visa, Mastercard, and Rydecoins'}
    credibility: A
    mode: HARD
    status: draft

  - id: FC-R12
    name: Insufficient route or fare evidence
    family: FC
    type: outcome
    applies_to: [FC-ROUTE, FC-TOLL]
    statement: >-
      If the recorded distance, a usable road-matched path, the fare breakdown or the recommended route is missing, or the
      itinerary changed (an accepted destination change or added stop, or a record that points to one without showing it was
      accepted) and the recommended route on record does not follow the final itinerary (FC-F02) while that route could
      change the amount (for ERP: an ERP amount was charged to the rider and the rider's share of the ERP of the actual
      path is above zero, FC-R06 and FC-F04), or pings are
      too sparse to locate the deviation, or, for an ERP claim, the service type, the gantry log, a gantry's rate or the gantries of the
      recommended route are missing or unusable, make no adverse finding against either party and escalate.
    zh: 缺少里程、可用路径、车费明细或推荐路线，或行程单改过（接受了改目的地或加站，或有记录指向改动但看不出是否被接受）而记录里的推荐路线没有按最终行程单走（FC-F02）、且推荐路线会影响金额（ERP：向乘客收了 ERP，且按乘客份额算的实际路径 ERP 大于零，FC-R06、FC-F04），或定位点太稀疏无法判断，或（ERP 争议）服务类型、闸门记录、某闸门的费率或推荐路线的闸门缺失或不可用时，不对任何一方作不利认定，转人工。
    produces: [FC-R-INSUFFICIENT-DATA]
    sources:
      - {type: FAIRRYDE, doc: FAIRRYDE-DECISIONS, quote_kind: none}
    credibility: D
    mode: HARD
    status: draft

