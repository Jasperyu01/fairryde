  - id: FC-R01
    name: Fixed fare means the route did not change the amount
    family: FC
    type: outcome
    applies_to: [FC-ROUTE]
    statement: >-
      If the pricing mode is FIXED_AT_BOOKING and the fare charged equals the quoted fare, a longer route did not change what the
      rider paid for the trip: no fare refund. The deviation is recorded as driver-conduct information only, with one
      exception: a fixed fare does not include ERP (FC-F01; RydeSEND fares do, and for a few services Ryde's pages disagree, FC-R06), so ERP that the longer route caused is a
      separate charge that FC-R01 never decides or closes. Whenever the actual path passed active gantries that the recommended route (through the final itinerary, FC-F02) avoids (or passed them more often),
      FC-R01 sends that ERP to its own FC-TOLL claim (a secondary claim under CLS-02, opened without waiting for the rider to
      name the ERP), decided by PB-FC-TOLL with FC-R08.
    zh: 固定价且实收等于报价时，绕路没有改变乘客为行程付的钱：不退车费；绕路只记作司机行为信息。有一个例外：固定价不含 ERP（FC-F01；RydeSEND 车费已含，且有些服务各页面说法不一，见 FC-R06），绕路造成的 ERP 是另一笔费用，FC-R01 既不裁决也不因此结案。只要实际路径经过了推荐路线（按最终行程单走，FC-F02）避开的有效闸门（或经过次数更多），FC-R01 就把这部分 ERP 交给单独的 FC-TOLL 主张（按 CLS-02 作为次项，不必等乘客提出 ERP），按 PB-FC-TOLL 用 FC-R08 裁决。
    produces: [FC-R-FIXED-FARE]
    sources:
      - {type: RYDE_POLICY, doc: RYDE-4412121982745, quote: 'The trip fare is fixed based on pick-up and drop-off points, hence the driver may decide to take the most efficient route according to GPS.'}
      - {type: RYDE_POLICY, doc: RYDE-30741244296217, quote: 'Fares quoted for our services are generally fixed, except for RydeTAXI.'}
      - {type: RYDE_POLICY, doc: RYDE-360004075214, quote: 'All fares are fixed at the time of booking but does not include toll charges such as ERP.'}
      - {type: RYDE_POLICY, doc: RYDE-115000772653, quote: 'For all services apart from RydeSEND, ERP charges are excluded from the fares.'}
      - {type: FAIRRYDE, doc: FAIRRYDE-DECISIONS, quote_kind: none, note: "Recording the deviation as driver-conduct information only, and opening the FC-TOLL claim without the rider naming the ERP, are FairRyde's design (open item D35; Jasper kept both on 2026-10-14). The claim is opened here only for a fixed fare charged as quoted."}
    credibility: B
    credibility_note: >-
      Both rider articles were edited more than 12 months ago (2024-10-01, 2025-07-17), and the article saying fixed fares
      exclude ERP is from 2024-10-08, so B. Ask the organizer to confirm fixed fares for RydeX. That the ERP is a separate charge
      is Ryde text (ERP is not in the fixed fare), and CLS-02 (D) gives a contested charge its own claim; opening that claim
      when the rider has not named the ERP is FairRyde's design (open item D35, kept by Jasper on 2026-10-14), and so is
      recording the deviation as conduct information only. Neither adds a condition to the no-refund finding or sets an
      amount, so FC-R01 stays B (A3 census, validation/round2/census.csv). Other fares (RECALCULATED, or charged different from quoted) do not
      open the claim here (open item D35).
    mode: HARD
    status: draft

