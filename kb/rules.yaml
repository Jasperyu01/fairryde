    statement: RydeTAXI is METERED; every other service is FIXED_AT_BOOKING, becoming RECALCULATED if a destination edit (a changed drop-off or an added drop-off stop) was accepted.
    zh: RydeTAXI 计程；其他服务下单时固定价，接受改目的地（改下车点或加一个下车站）后重算。
    produces_finding: F-PRICING-MODE
    sources:
      - {type: RYDE_POLICY, doc: RYDE-30741244296217, quote: 'Fares quoted for our services are generally fixed, except for RydeTAXI.'}
      - {type: RYDE_POLICY, doc: RYDE-360004075214, quote: 'All fares are fixed at the time of booking but does not include toll charges such as ERP.'}
      - {type: RYDE_POLICY, doc: RYDE-51399796192921, quote: 'If the driver accepts your edit destination request, a $3.00 add/edit destination fee will apply.'}
      - {type: RYDE_POLICY, doc: RYDE-50798691815449, quote: 'Once the driver accepts, your trip fare will be recalculated, and your route will be updated to the new destination'}
      - {type: RYDE_POLICY, doc: RYDE-34883561600025, quote: 'You will receive a notification or a request pop up on your Ryde Driver app when riders request to change the drop-off and/or add an additional drop-off stop.', note: "Driver article: an added stop is the same request as a changed drop-off."}
      - {type: RYDE_POLICY, doc: RYDE-51399674412441, quote: 'The rider can add another destination, leading to a map confirmation (for multiple stops).', note: "Rider article: an added stop goes through the same edit request as a changed destination."}
      - {type: RYDE_POLICY, doc: RYDE-51399674412441, quote: 'New destination and fare confirmation will be displayed.', note: "The next step of the same article: the edit, an added stop included, ends with a fare confirmation."}
    credibility: B
    credibility_note: "'Fares are fixed' comes from rider articles edited more than 12 months ago, and a driver FAQ describes earnings from driven distance and time (META-04 known conflict). The changed-drop-off part is A (the recalculation quote was added by the A3 census). The added-stop part rests on a driver article and a rider article whose dates and rollout status differ, so it is B, which the rule's B already covers."
    mode: HARD
    status: draft

  - id: FC-F02
    name: Detour measurement
    family: FC
    type: fact
    applies_to: [FC-ROUTE, FC-TOLL]
    statement: >-
      The recommended route runs through the trip's final itinerary: from the pick-up through every drop-off in order
      (ENT-TRIP has_dropoff, 1:N). At each change the driver accepted during the trip (a changed drop-off or an added stop,
      destination_edit_accepted), the recommended route is split at the point C nearest to where the car was at that moment,
      taken on the part of the route the car had not yet passed (where the car was is its GPS position at the acceptance,
      interpolated between the pings around it): up to C it is the recommended route toward the drop-offs then in force, and from C it runs through the new
      drop-offs in order. The actual path is measured whole, so a deviation driven before the change stays in it. Only the
      distance the change itself requires (the route from C through the new drop-offs instead of the rest of the old route)
      is not a detour; a deviation on the way to an added stop is measured like any other. If the itinerary changed and the
      recommended route on record does not follow it, the measurement is unusable (FC-R12). Detour ratio DR = actual
      distance / recommended-route distance; extra distance = actual minus recommended. Actual distance
      comes from the recorded trip distance, else a road-matched path, never the sum of straight lines between sparse pings
      (that sum may only prove a detour, never disprove one). Spatial confirmation needs at least CORRIDOR_MIN_CONSEC_PINGS
      consecutive pings beyond CORRIDOR_HALF_WIDTH_M of the recommended route, ignoring ENDPOINT_EXCLUSION_M at both ends.
    zh: 推荐路线按行程的最终行程单走：从上车点按顺序经过每个下车点（ENT-TRIP has_dropoff，一对多）。行程中司机每接受一次改动（改下车点或加站，destination_edit_accepted），推荐路线就在离车当时位置最近的点 C 分段，C 取在车还没有经过的那段路线上（车当时的位置取接受时的 GPS 位置，在前后定位点之间插值）：C 之前是朝当时有效下车点的推荐路线，C 之后按顺序经过新的下车点。实际路径整段计量，所以改动之前已经开出的绕路仍算在内。只有改动本身需要的里程（从 C 经过新下车点、代替旧路线剩下部分）不算绕路；去乘客加的站途中的偏离照常计量。行程单改过、而记录里的推荐路线没有按它走，测量不可用（FC-R12）。绕路比 DR = 实际里程 / 推荐路线里程；多开里程 = 实际里程减推荐路线里程。实际里程用行程记录，否则用道路匹配路径，不用稀疏定位点之间直线距离之和（这个和只能证明有绕路，不能证明没有）。空间确认需要至少 CORRIDOR_MIN_CONSEC_PINGS 个连续定位点落在推荐路线两侧 CORRIDOR_HALF_WIDTH_M 之外，两端各 ENDPOINT_EXCLUSION_M 不计。
    params: [CORRIDOR_HALF_WIDTH_M, CORRIDOR_MIN_CONSEC_PINGS, ENDPOINT_EXCLUSION_M]
    produces_finding: F-DETOUR
    sources:
      - {type: RYDE_POLICY, doc: RYDE-50798691815449, quote: 'Once the driver accepts, your trip fare will be recalculated, and your route will be updated to the new destination'}
      - {type: FAIRRYDE, doc: FAIRRYDE-DECISIONS, quote_kind: none, note: "Method from research note 08 (sparse-ping simulation)."}
      - {type: FAIRRYDE, doc: FAIRRYDE-DECISIONS, quote_kind: none, note: "The final-itinerary baseline and the split at the point nearest the car at each accepted change are FairRyde's design (step A4, FX7; A4 check round 1), built on Ryde's text that the route is updated to the new destination once the driver accepts."}
    credibility: D
    mode: HARD
    status: draft

  - id: FC-F03
    name: Legitimate reasons for deviation
    family: FC
    type: fact
    applies_to: [FC-ROUTE, FC-TOLL]
    statement: >-
      A deviation is justified if any holds: congestion, an incident or a closure on the recommended route; a route requested or
      agreed by the rider before the deviation (read the chat); avoiding ERP at the rider's request; the driver took the route
      that the driver's GPS navigation showed as the fastest or most efficient (Ryde: the driver "may decide to take the most
      efficient route according to GPS"), shown by the trip's navigation record, because a bare statement by the driver (tier
      C or D evidence, GEN-R04) does not establish it (GEN-R01); an in-app navigation reroute (generic assumption from DiDi's
      terms).
    zh: 推荐路线拥堵、事故或封路；乘客事先要求或同意的路线（需读聊天记录）；应乘客要求避开 ERP；司机的 GPS 导航显示为最快或最有效的路线（Ryde 写明司机"可按 GPS 选最有效路线"；需有行程的导航记录，司机单方面的说明属 C 或 D 级证据，不足以证明，见 GEN-R04 和 GEN-R01）；导航重新规划（来自 DiDi 条款的通用假设），均为正当理由。
    produces_finding: F-JUSTIFICATION
    sources:
      - {type: RYDE_POLICY, doc: RYDE-4412121982745, quote: 'If you have a preferred route, you may recommend this to your driver and reach a mutual agreement before you go.'}
      - {type: RYDE_POLICY, doc: RYDE-4412121982745, quote: 'hence the driver may decide to take the most efficient route according to GPS.'}
      - {type: RYDE_POLICY, doc: RYDE-4412122016153, quote: 'So you may decide to take the fastest or most efficient route based on your GPS.'}
      - {type: REGULATION, doc: LTA-PDVL-OFFENCES, quote: 'Failing, without reasonable cause, to proceed to destination named by a passenger by shortest and most direct route'}
      - {type: FAIRRYDE, doc: FAIRRYDE-DECISIONS, quote_kind: none, note: "Requiring the trip's navigation record for the GPS justification, and not accepting the driver's bare statement, is FairRyde's evidence rule (open item D36). Accepting a route the rider requested or agreed during the trip (including avoiding ERP at the rider's request) extends Ryde's agreement 'before you go' (A3 census)."}
      - {type: INDUSTRY, doc: IND-DIDI-DETOUR, quote: '司机采用 App 导航，导致的乘客投诉绕路，视为司机履约，不承担违约责任'}
    credibility: D
    credibility_note: >-
      Rider agreement and the GPS most-efficient route are Ryde text, but both route articles were edited more than 12 months
      ago (2024-10-01 and 2023-06-16), so B; "reasonable cause" (LTA) is B for private-hire (PDVL) drivers; the
      navigation-reroute exemption comes from DiDi (C). Ryde's "most efficient route according to GPS" is not the same as the
      LTA wording "shortest and most direct route"; FC-F03 follows Ryde's contract wording and treats the LTA phrase "without
      reasonable cause" as the bridge (open item D36). Ryde's agreement covers a route agreed "before you go" (B). Four
      elements are FairRyde's (D): accepting a route the rider requested or agreed during the trip; using the GPS permission,
      which Ryde states for a fixed fare ("The trip fare is fixed based on pick-up and drop-off points"), for ERP claims and
      fares that are not fixed; the navigation-record requirement; and applying the PDVL duty to every driver (open item D35). So the
      rule is D by its weakest element (A3 census, validation/round2/census.csv; it was C in v0.1).
    mode: READ
    status: draft

  - id: FC-F04
    name: Expected ERP (the rider's share)
    family: FC
    type: fact
    applies_to: [FC-TOLL]
    statement: >-
      Expected ERP = the rider's share (ERP_RIDER_SHARE, set by FC-R06: 1, 0 for RydeSEND, 0.5 for a carpool trip) times the sum
      of the rates of the active gantries the trip actually passed, at their time-of-day rates (LTA rate table). The same
      computation on the gantries of another path gives ERP(path), for example ERP(recommended) for FC-R08. This is the one ERP
      computation of the knowledge base, applied in this order: FC-R06 first (it takes precedence over the plain gantry sum),
      then FC-F04, then FC-R07 and FC-R08, which only use its results and never recompute ERP without the share. FC-R00's
      reasoning (D32) takes precedence over FC-R08 for a METERED fare. Where FC-R06 sets no share (another service, alone or flagged as
      carpool, or RydeSEND and carpool at once) GEN-R07 applies; with no service type recorded, FC-R12 applies.
    zh: 应收 ERP = 乘客份额（ERP_RIDER_SHARE，由 FC-R06 定：1，RydeSEND 为 0，拼车为 0.5）乘以实际经过的有效闸门按当时费率之和（LTA 费率表）。同一算法用于其他路径的闸门，得到 ERP(该路径)，例如 FC-R08 用的 ERP(推荐路线)。这是知识库唯一的 ERP 算法，按此顺序使用：先 FC-R06（优先于直接相加闸门费率），再 FC-F04，再 FC-R07 和 FC-R08，后两者只用它的结果，不得不带份额重算 ERP。对计程车费（METERED），FC-R00 的理由优先于 FC-R08（D32）。FC-R06 没有定份额时（其他服务，单独或标为拼车，或既是 RydeSEND 又是拼车）按 GEN-R07 转人工；没有记录服务类型时按 FC-R12。
    params: [ERP_RATE_TABLE, ERP_RIDER_SHARE]
    produces_finding: F-ERP-EXPECTED
    sources:
      - {type: RYDE_POLICY, doc: RYDE-115001438614, quote: 'Please key in ERP based on the ERP gantry you passed during the journey.'}
      - {type: RYDE_POLICY, doc: RYDE-115001438614, quote: 'The fares for RydeSEND include ERP.'}
      - {type: RYDE_POLICY, doc: RYDE-115001438614, quote: 'The driver bears 50% of the ERP charge, and the passenger pays the remaining 50%.'}
    credibility: A
    credibility_note: >-
      The gantry sum and both exceptions are Ryde text in a driver article edited 2026-09-02 (A). The order of application is
      how the knowledge base uses them, not a new norm; for the one case the articles do not order (RydeSEND and carpool at
      once) the rule rules nothing and escalates under GEN-R07. Open item D35: Ryde does not say whether the driver keys the
      total or the passenger's half on a carpool trip, nor how the passenger half divides among several passengers (a
      backlog item in scope.yaml).
    mode: HARD
    status: draft

  # ---------------------------------------------------------------- FC outcomes
  - id: FC-R00
    name: No platform-computed detour refund on a metered RydeTAXI fare
    family: FC
