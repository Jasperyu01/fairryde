    applies_to: [FC-ROUTE]
    statement: >-
      FC-R03 and FC-R05 do not apply to a METERED fare (RydeTAXI, FC-F01), and FC-R00 takes precedence over FC-R04 and
      FC-R12 for such a fare (the escalation is the same; the reason is GEN-R-POLICY-GAP). Ryde's RydeTAXI articles say the fees follow
      those of the respective taxi company, the driver keys in the fare shown on the meter, and payment is in cash only;
      Ryde publishes no rule for refunding a metered fare. FairRyde measures the detour (FC-F02, FC-F03) but does not rule
      on it: it escalates under GEN-R07 (reason GEN-R-POLICY-GAP) and attaches, for the reviewer, the detour measurement,
      the difference FC-R05's formula would give (information only, never a proposed refund; computed with TAXI_TARIFF,
      one operator's tariff, while the trip's taxi company may charge differently) and the driver's response (GEN-R05).
    zh: FC-R03 和 FC-R05 不适用于计程车费（RydeTAXI，见 FC-F01）；对这类车费 FC-R00 优先于 FC-R04 和 FC-R12（同样转人工，原因为 GEN-R-POLICY-GAP）。Ryde 的 RydeTAXI 文章说费用按各出租车公司的标准、司机按计价器显示的金额录入车费、只收现金；Ryde 没有公开计程车费的退款规则。FairRyde 照样测量绕路（FC-F02、FC-F03），但不作裁决：按 GEN-R07 转人工（原因 GEN-R-POLICY-GAP），并附给审核人绕路测量、按 FC-R05 公式算出的差额（仅供参考，不作为退款建议；用的是 TAXI_TARIFF，只是一家运营商的费率，本趟出租车公司的收费可能不同）和司机的回应（GEN-R05）。
    params: [TAXI_TARIFF]
