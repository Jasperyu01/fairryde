    statement: Up to S$40 for spillage of food, drinks, groceries, crumbs or sand; up to S$120 for bodily fluids or stains; up to S$200 for vomit. Pet fur and saliva are not claimable; mess that can be cleaned immediately without professional cleaning is not reimbursed.
