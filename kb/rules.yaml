  - id: CW-F06
    name: Rider counter-evidence strength
    family: CW
    type: fact
    applies_to: [CW-NOSHOW, CW-WAITING]
    statement: >-
      During the wait means from the driver's arrival indication (the wait anchor when there is none; TS_TOLERANCE_S earlier,
      because records of the arrival can differ by that much) to the cancellation for a no-show fee; for a waiting fee it
      ends where CW-F04's window ends (the end of the free wait, or boarding if that comes first). STRONG if a failure to
      notify the rider is logged for the trip (at any time, as in v0.1), or if, during the wait, rider-side records of tier
      A, B or C show the rider at the pin (within ARRIVAL_GEOFENCE_M) or at the named venue (within PIN_VENUE_MAX_M), or a
      call or message from the rider to the driver places the rider at the pin or the venue or contests the driver's
      presence, the timing or the place (for example "I'm at the pick-up point", "where are you?", "I can't see your car").
      A rider call or message that admits being late or still on the way ("still getting ready", "coming, 1 min", "coming
      down") is not counter-evidence, and neither is an acknowledgment ("ok"); an acknowledgment that answers a question in
      the driver's last message reads like a bare "yes" (the reading test applies). Asking
      where the driver is ("are you coming?", "which car?") contests presence. A call whose words are not recorded, or a
      message that fits neither reading or both ("I'm here, coming out now"; a bare "yes"), is read as not placing the rider
      at the pick-up, and the reading test checks whether the other reading changes the outcome (decisive_definition clause
      1); for a fee upheld on the merits (DT-CW-NOSHOW, or CW-R05 for a waiting fee) it always does, so a reading that cannot
      be settled goes to a person (approval), never to an automatic uphold. MAT-04 (a waiver requested out of the window)
      and a policy gap decide without these readings. Before the wait (from the driver's assignment, the earliest assignment
      record, else the booking, or the booking when the assignment is stamped after the arrival, which also flags
      RECORDS_MISSING): a rider message counts as counter-evidence (decision D30) unless it is positively known not to place
      the rider, that is, unless it is a call (its words are not recorded), an admission, an acknowledgment that answers no
      driver question, or consists only of questions about the driver ("where are you?"), contests, pick-up instructions
      ("pick me up at the lobby") and filler; these do not count because the wait had not started. Rider GPS at the pin or
      venue before the wait also counts (D33, confirmed by Jasper). Counted evidence makes the rider evidence at least WEAK,
      and the reading test takes STRONG as its other reading, so a fee upheld on the merits always needs human approval. WEAK
      if the rider's statement contests the driver's presence, the timing or the place without such records or messages
      during the wait, or if only the evidence before the wait counts. NONE if none of these applies and the statement does not contest presence, timing or place (for example the
      rider admits being late or asks for a goodwill waiver). Whether a statement, a call or a message contests presence is
      judged by reading it.
    zh: 等待期间指从司机标记到达（没有到达标记时为等待锚点；再提前 TS_TOLERANCE_S，因为各记录的到达时刻可能差这么多）起算；缺席取消费到取消为止，等候费到 CW-F04 的窗口结束为止（免费等待结束，若先上车则到上车）。本趟有通知乘客失败的日志（不论何时，同 v0.1）为 STRONG；等待期间以下任一项也为 STRONG：乘客侧 A、B、C 级记录显示乘客在上车点（ARRIVAL_GEOFENCE_M 内）或在所说的场馆（PIN_VENUE_MAX_M 内）；乘客打给司机的电话或发的消息说明自己在上车点或场馆，或对司机在场、时间、地点提出异议（例如"我在上车点""你在哪""看不到你的车"）。乘客承认迟到或还在路上的电话或消息（"还在准备""马上到，1 分钟""在下楼"）不算反证；只回"好"之类也不算；但若是在回答司机上一条消息里的提问，就和只回"是"一样处理（适用读法测试）。问司机在哪（"你来了吗""哪辆车"）算对司机在场提出异议。没有通话内容记录的电话、或两种读法都套不上或都套得上的消息（"我到了，马上出来"；只回"是"），先按"没有说明乘客在上车点"读，再由读法测试看另一种读法会不会改变结果（decisive_definition 第 1 条）；按是非曲直维持收费时（DT-CW-NOSHOW，等候费为 CW-R05）一定会改变，所以读不准的一律交人工批准，不会自动维持收费。MAT-04（超出期限的免除申请）和政策空白不看这些读法。等待开始之前（从派单起，取最早的派单记录，没有则从下单起；派单时间晚于到达时也从下单起，并打 RECORDS_MISSING）：乘客的消息算反证（决定 D30），除非能确定它没有说明乘客的位置，也就是：打电话（没有通话内容记录）、承认迟到、不是回答司机提问的"好"，或者只有问司机在哪（"你在哪"）、异议、交代上车地点（"到大堂接我"）和语气词；这些不算，因为等待尚未开始。等待开始之前乘客 GPS 在上车点或场馆也算（D33，Jasper 已确认）。算数的证据使反证至少为 WEAK，读法测试以 STRONG 作为另一种读法，所以按是非曲直维持收费一定要人工批准。乘客陈述对司机在场、时间或地点提出异议，但等待期间没有上述记录或消息；或者只有等待开始之前的证据算数：为 WEAK。以上都不成立、陈述也不争这些点（例如承认迟到、只求善意免除）为 NONE。陈述、电话、消息是否构成异议需读原文判断。
    params: [ARRIVAL_GEOFENCE_M, PIN_VENUE_MAX_M, TS_TOLERANCE_S]
    produces_finding: F-RIDER-EVIDENCE
    sources:
      - {type: FAIRRYDE, doc: FAIRRYDE-DECISIONS, quote_kind: none, note: "Content-based reading of rider calls and messages since KB v0.2 (fix FX1, validation round 1 cases E01, E03 and E07). Jasper confirmed the outcomes of those three cases (the fee stands) on 2026-10-11, and on the same day accepted the reading rule as FairRyde design at credibility D, with readings that cannot be settled going to a person (D27), and decided that rider messages before the arrival indication that place the rider at the pick-up count as counter-evidence needing at least human approval (D30), and that rider GPS there counts the same way (D33). He then froze the reading of rider messages: later steps do not extend it (D34). One exception on his instruction in A2 (D38): a message that names a place the pick-up may be (mall, market, clinic, gym, kopitiam, ATM, MRT) reads UNCLEAR, not as an admission of lateness."}
    credibility: D
    credibility_note: >-
      FairRyde's design (D). Until v0.1 any rider call or message during the wait was STRONG whatever it said, which sent
      routine no-show and waiting-fee cases to a person even when the rider's own message admitted being late. The wait
      window starts at the arrival indication, which can be earlier than CW-F04's window start (CW-F03B), so a rider at the
      pin before GPS confirms the driver still counts. For a no-show fee it runs to the cancellation, past the threshold
      where CW-F04's window stops: a rider who reaches the pick-up before the driver cancels does contest the no-show. For a
      waiting fee it ends with CW-F04's window, as FX1 asked: a rider who first reaches the pick-up after the free wait is
      the late rider the fee is for, and their "I'm downstairs" on arrival is not counter-evidence. Before the wait only the
      rider's own placement counts, from the driver's assignment (D30, D33).
    mode: HARD+READ
    status: draft

