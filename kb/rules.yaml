  - id: CW-R08
    name: Driver lateness makes a rider's cancellation fee waivable
    family: CW
    type: eligibility
    applies_to: [CW-RIDERCANCEL]
    statement: >-
      If, when the rider canceled, the driver was already later than the assignment ETA plus DRIVER_LATE_GRACE_S, or was not
      moving toward the pick-up point (a driver already waiting at the pick-up counts as moving toward it), the rider's
      cancellation fee is eligible for a waiver. Ryde publishes no rule on this. For an advance booking the assignment ETA is
      the scheduled time (FairRyde's reading: the driver is due at the pick-up then), except for a request accepted after the
      cut-off of CW-R02, whose assignment ETA is the ETA the app gave at acceptance, if later than the scheduled time; and a
      driver who is not moving gives this ground only when, by the app's ETA from where the driver was, the driver could no
      longer reach the pick-up by the assignment ETA plus DRIVER_LATE_GRACE_S (an early driver waiting nearby is not a ground).
      A waiver under this rule always needs human approval (AUTH-02 trigger 13), never AUTO.
    zh: 乘客取消时司机已晚于派单 ETA 加宽限、或没有朝上车点移动（已在上车点等候的司机算作朝上车点移动），则乘客取消费可免除。Ryde 未公开此规则（通用假设）。预约单的派单 ETA 取预约时间（FairRyde 的读法：司机应在那时到达上车点）；但在 CW-R02 的截止时间之后才被接的预约单，派单 ETA 取接单时 App 给出的 ETA（若晚于预约时间）；预约单的司机没有移动时，只有按 App 从司机所在位置算的 ETA 已无法在派单 ETA 加宽限内到达上车点，才构成免除理由（提前到附近等候的司机不构成）。按本规则免除一律需人工批准（AUTH-02 第 13 项），不能自动。
    params: [DRIVER_LATE_GRACE_S]
    produces: [CW-R-DRIVER-LATE]
    sources:
      - {type: INDUSTRY, doc: IND-BENCHMARK-NOTES, quote_kind: paraphrase, note: "Grab: a late driver (ETA + 3 min) forfeits the fee; Gojek ETA + 5 min (research note 02)."}
      - {type: FAIRRYDE, doc: FAIRRYDE-DECISIONS, quote_kind: none, note: "Two elements are FairRyde's: the 'not moving toward the pick-up point' condition has no source in the knowledge base (research note 02 covers the ETA only), and the assignment ETA of an advance booking (the scheduled time, or the app's ETA for a request accepted after the cut-off) is FairRyde's reading (step A4, FX9; A4 check round 1)."}
    credibility: D
    credibility_note: >-
      The late-driver waiver is other platforms' practice (C). The 'not moving toward the pick-up point' ground has no source
      in the knowledge base (the round 1 reviewer found it on Grab's page, but research note 02 does not carry it), and the
      advance-booking ETA is FairRyde's reading (A4), so the rule is D by its weakest element (A3 census,
      validation/round2/census.csv; it was C in v0.1). A local source for both would make it C again.
    mode: HARD
    status: draft

