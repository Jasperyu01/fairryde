    statement: >-
      If the pick-up pin is more than PIN_VENUE_MAX_M from the named venue (CW-F07), add flag PIN_VENUE_MISMATCH. When the fee
      is upheld on the no-show facts (DT-CW-NOSHOW rows R8, R9 and R11), also add the secondary note CW-R-PIN-AMBIGUOUS. The outcome
