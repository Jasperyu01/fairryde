      - {type: RYDE_POLICY, doc: RYDE-900003406966, quote: 'Please do note that the payment method accepted for RydeTAXI is only via cash.'}
      - {type: RYDE_POLICY, doc: RYDE-900004230226, quote: 'Key in the fare as indicated on your meter.'}
      - {type: FAIRRYDE, doc: FAIRRYDE-DECISIONS, quote_kind: none, note: "That no platform-computed refund applies and the case escalates is FairRyde's reading (fix FX2, validation round 1 case E10). Jasper confirmed E10's outcome (escalate) on 2026-10-11."}
    credibility: D
    credibility_note: >-
      The RydeTAXI facts are Ryde text (rider and driver articles edited 2026-01-26, A). Excluding metered fares from a
      platform-computed refund extends them, so the rule is D under the credibility_principle. Its only outcome is
      escalation (tier HUMAN under AUTH-06), so it never lets a case be decided automatically.
    mode: HARD
