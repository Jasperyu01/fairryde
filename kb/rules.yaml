# FairRyde Knowledge Base - Layer 3: RULES
# Question this layer answers: "Under which conditions do we conclude or do what?"
# ChordX ONT.2 / ONT.4 Step 5: every rule names its SOURCE (document + clause, verbatim) and its CREDIBILITY,
# and says whether it can be HARD-coded or must be decided by READING the original text.

meta:
  kb: FairRyde Knowledge Base
  layer: Rules
  version: 0.2.0
  status: draft
  updated: 2026-10-14
  owner: Jasper
  reviewers: [Cao]
  authority: >-
    Original document text, not personal experience. In order of authority for this hackathon:
    (1) the organizer's handbook and the policy object embedded in each organizer case;
    (2) Ryde Help Centre articles, which are contract terms because the Terms of Use define "Ryde Policies"
    to include FAQs and make them part of the Agreement (ToU Section A s.1 and s.2);
    (3) Singapore regulation; (4) official guidance; (5) other platforms' published practice;
    (6) FairRyde design assumptions. Levels 5 and 6 are generic assumptions and are always labeled as such.
  placement_test: >-
    Put something in the Rules when it is a condition, threshold, amount, deadline, permission, prohibition or
    precedence that you could cite a clause for. If no clause exists, it is still a rule, but it must carry
    credibility C or D and be shown to users as a generic assumption (ChordX ONT.3, ONT.8).
  quotes: >-
    Every quote must be an exact substring of its source (the build script checks this against the local copies:
    sources/ryde_policy_corpus.json, the organizer files, and the verified-quote research notes). Em and en dashes in
    sources were normalized to hyphens.

credibility_scale:
  A: >-
    Organizer text or data (binding for organizer cases); the Ryde Terms of Use as currently published (the contract in force);
    or a Ryde Help Centre article edited within 12 months of 2026-10-05 and not contradicted by another Ryde page.
  B: Ryde Help Centre text older than 12 months or contradicted by another Ryde page; a regulation that needs interpretation; official non-binding guidance.
  C: Generic assumption from outside (other platforms' published practice, research). Must be labeled.
  D: Generic assumption from inside (FairRyde design choice). Must be labeled and confirmed with the organizer or Ryde.
  method_rules: >-
    Method rules (how the knowledge base and the process work, citing INTERNAL_STANDARD) are A when the ChordX protocol
    itself states the requirement (for example "label generic assumptions"), and D when FairRyde chose the specific design
    (for example "the primary claim is the one contesting the largest charge").
credibility_principle: >-
  Credibility is rated in two places. A rule's credibility rates its NORM (the condition and conclusion as written) and takes
  the credibility of the norm's weakest essential element: a Ryde condition extended by FairRyde to a new situation is D.
  Numeric thresholds are rated separately as parameters in reference_data.yaml; whether a C or D parameter matters for a
  given case is decided by the sensitivity test in decisive_definition, not by lowering every rule that uses it. A source
  only counts toward A if the quoted clause is not itself one side of a META-04 known conflict.
decisive_definition: >-
  The PATH of a case is: the eligibility rules that could stop it (for example MAT-04, CW-R00), the fact rules whose findings
  are inputs of the decision table row that fired, and the rules listed in that row. Procedural, authority, explanation and
  fraud rules (GEN-R05, AUTH, EXP, FRD) are not on the path. For approval-tier purposes (AUTH-01, AUTH-02, META-05) a rule
  or row is DECISIVE when the outcome depends on it:
  (1) a READ or HARD+READ rule on the path whose judged value, if read any other way it could be read, changes the outcome;
  (2) a rule on the path with a C or D parameter where moving that parameter to either end of its plausible_range
  (reference_data.yaml) changes the outcome, or keeps the outcome but moves the case from a row rated A or B to a row rated
  C or D (the same result would then rest on a generic assumption), not only a flag;
  (3) the decision table row that fired has credibility C or D (each row states its credibility; it is the weakest of the
  rules that decide it). Secondary reason notes that do not change the outcome do not count.
  A and B rules applied as written are not decisive in this sense: they can be applied automatically.

modes:
  HARD: Can be written as code (explicit thresholds, amounts, deadlines, conditions).
  READ: Must be decided by reading the original clause at decision time (discretion, interpretation, judgment). The agent quotes the clause verbatim; a decisive READ rule sends the case to human approval (AUTH-02).
  HARD+READ: Hard-coded core with a discretionary part that must be read.

types: [meta, classification, matching, fact, eligibility, outcome, remedy, procedural, authority, explanation, data_quality, fraud]

evaluation_order:
  - "1 META (profile, versioning, conflicts)"
  - "2 CLS and MAT (what is it, which trip, new or update)"
  - "3 DQ and fact rules (findings from evidence)"
  - "4 outcome and remedy rules (decision tables)"
  - "5 FRD (fraud signals, never decisive for the outcome)"
  - "6 AUTH (who decides) and escalation gates, which override everything above"
  - "7 EXP (what each party is told)"

# =====================================================================
rules:

  # ---------------------------------------------------------------- META
  - id: META-01
    name: Policy source precedence
    family: META
    type: meta
    applies_to: [ALL]
    statement: >-
      If a case embeds its own policy object (organizer cases), build profile organizer_case from that object at run time,
      field by field (ontology.yaml disp002_mapping gives the field-to-parameter scales), so a second organizer case with a
      different policy is judged by its own numbers. Otherwise apply the Ryde profile in force on the trip date (META-02).
      Points neither source covers use Ryde defaults first, then FairRyde assumptions, and the explanation says which.
    zh: 组织方案例自带政策对象时以它为准；否则用 Ryde 2026 参数档；两者都没写的点先用 Ryde 默认，再用 FairRyde 假设。
    params: [PROFILE]
    sources:
      - {type: FAIRRYDE, doc: FAIRRYDE-DECISIONS, quote_kind: none, note: "Organizer cases are scored against the organizer's expected ruling, computed under the embedded object. Confirm with the organizer (WhatsApp question 5)."}
    credibility: D
    mode: HARD
    status: draft

  - id: META-02
    name: Use the version in force on the trip date
    family: META
    type: meta
    applies_to: [ALL]
    statement: >-
      Apply the parameter values of the profile whose effective period contains the trip date (reference_data.yaml
      effective_from). For a trip before the earliest loaded period there are no values: escalate as a policy gap (GEN-R07).
    zh: 按行程日期选用当时生效的参数档；行程早于已载入的最早生效日时没有参数，按政策空缺转人工。
    sources:
      - {type: RYDE_POLICY, doc: RYDE-18229758389017, quote: 'The increase is due to the platform fee changes effective 17 Feb 2026.'}
    credibility: D
    credibility_note: Ryde states effective dates (A); choosing parameters by trip date is FairRyde's rule (D).
    mode: HARD
    status: draft

  - id: META-03
    name: Ryde Help Centre articles are contract terms
    family: META
    type: meta
    applies_to: [ALL]
    statement: Ryde Help Centre articles are "Ryde Policies" and part of the Agreement, so rules citing them cite contract terms.
    zh: Ryde 帮助中心文章属于"Ryde Policies"，是合同的一部分。
    sources:
      - {type: RYDE_TOU, doc: RYDE-TOU, clause: "Section A s.1", quote: 'These Terms of Service and the Ryde Policies (as defined below) constitute a legally binding agreement ("Agreement") between you and Ryde (as defined below).'}
      - {type: RYDE_TOU, doc: RYDE-TOU, clause: "Section A s.2 'Ryde Policies'", quote: 'frequently asked questions (FAQs), in-app or website product/service descriptions and information cards'}
    credibility: A
    mode: HARD
    status: draft

  - id: META-04
    name: Source conflicts are surfaced, never silently resolved
    family: META
    type: meta
    applies_to: [ALL]
    statement: >-
      When two Ryde pages disagree, use the rider-facing page for rider charges and the most recently edited page otherwise,
      add flag SOURCE_CONFLICT, and escalate if the outcome or the amount depends on the conflict.
    zh: Ryde 页面互相矛盾时不悄悄选一个：乘客收费用乘客页，其余用最新编辑页；打 SOURCE_CONFLICT；结果或金额取决于该矛盾时转人工。
    produces: [GEN-R-SOURCE-CONFLICT]
    sources:
      - {type: FAIRRYDE, doc: FAIRRYDE-DECISIONS, quote_kind: none}
    credibility: D
    mode: HARD
    status: draft
    known_conflicts:      # clause level: a quoted clause on either side does not count toward credibility A
      - topic: Driver waiting-fee payout
        sides:
          - {doc: RYDE-20244064619161, quote: 'Driver may charge a Waiting Time Fee of $4.50 at the end of the trip if:'}
          - {doc: RYDE-4408071347993, quote: 'Drivers are required to tap on the $5* Waiting Time Fee button upon Drop-off (if applicable).'}
        resolution: "Follow the more recently edited driver page (S$5) for driver payouts; rider charges are unaffected."
      - topic: Name of the S$6.61 charge
        sides:
          - {doc: RYDE-4407754403353, quote: 'Otherwise, you will not be charged the $6.61 Waiting Time Fee if any of the above are not fulfilled.'}
          - {doc: RYDE-23534478435353, quote: 'Rider will be charged a Cancellation Fee of $6.61* if:'}
        resolution: "Treat S$6.61 as the no-show or late-cancellation fee (the main rider policy page); read the GPS condition in RYDE-4407754403353 as applying to it (CW-R06, credibility B)."
      - topic: Fare basis
        sides:
          - {doc: RYDE-30741244296217, quote: 'Fares quoted for our services are generally fixed, except for RydeTAXI.'}
          - {doc: RYDE-52948811893145, quote: 'Fares are calculated from actual driven distance and time'}
          - {doc: RYDE-900005170043, quote: 'Fares vary depending on the service type and are affected by surges.'}
        resolution: "Fixed at booking for rider charges (rider pages); the driver pages describe driver earnings and surge pricing. FC-F01 and FC-R01 are rated B; question O4 asks the organizer."

  - id: META-05
    name: Generic assumptions are labeled
    family: META
    type: meta
    applies_to: [ALL]
    statement: >-
      Whenever a credibility C or D rule is decisive (decisive_definition above), add flag GENERIC_ASSUMPTION_USED and tell
      both parties that Ryde has not published this point and what FairRyde assumed. C or D rules that were used but were not
      decisive are still listed with their credibility label in the explanation (EXP-01).
    zh: C、D 级规则起决定作用时，打 GENERIC_ASSUMPTION_USED，并告诉双方这是通用假设（Ryde 未公开）。
    sources:
      - {type: INTERNAL_STANDARD, doc: INT-CHORDX-ONT, clause: ONT.3, quote: "用行业通用规则先顶上，并显式标注来源为'通用假设'"}
      - {type: INTERNAL_STANDARD, doc: INT-CHORDX-ONT, clause: ONT.8, quote: '会让人误以为系统读了合同'}
    credibility: A
    mode: HARD
    status: draft

  # ---------------------------------------------------------------- CLS
  - id: CLS-01
    name: Safety override
    family: CLS
    type: classification
    applies_to: [ALL]
    statement: >-
      If any free text in the case (description, chat, added evidence) contains safety content, create an SE claim, set
      severity S0 or S1 and route it to a human, whatever else the ticket contains. Safety content is any account, by either
      party, of: violence or its threat (assault or an attempt, hitting, scratching, a weapon, threats and intimidation);
      sexual misconduct (harassment, unwanted advances or touching); abuse or harassment of any kind toward a person (insults,
      slurs or swearing at someone, overly personal questions, comments on someone's appearance, contacting a passenger after
      the trip for personal reasons); being held or taken against one's will (kidnapping or abduction, a driver who will not
      let the passenger out or will not stop when asked); being put in danger (reckless or dangerous driving, a driver under
      the influence of drink or drugs, an unsafe drop-off such as being made to leave the car on an expressway or road
      shoulder, or being made to leave the car, or left behind by the driver, at an isolated place or at night); an accident
      or an injury; discrimination because of race, ethnicity, religion, nationality, disability or a similar ground; or any
      other crime. It is judged by meaning, not by keywords: these are examples, not a closed list, and text that uses none of
      these words can be safety content ("he stopped on the PIE and told me to get out"). When it is unclear whether text is
      safety content, it is treated as safety content (S1), so a person sees it. Rudeness alone (an unfriendly or impatient
      manner, a raised voice, a curt reply) with no abuse, threat, danger or discrimination is not safety content; it is
      feedback (EX-FEEDBACK). A dispute about money (a fare, a fee, an overcharge, a charge the driver made up) or about damage
      to the car is not safety content by itself, even where the conduct may be a crime; it becomes safety content when it
      comes with violence, threats, danger, abuse or discrimination. Severity S0 when someone was hurt, held, assaulted, threatened with harm or put in immediate
      danger; S1 otherwise. The SE type follows the taxonomy definitions (SE-CONDUCT for behavior toward a person,
      SE-DRIVING, SE-ACCIDENT, SE-TERMINATED for a ride ended midway, SE-MISMATCH for a driver or car that does not match the
      app, SE-RECORDING for an in-vehicle recording device, SE-OTHER otherwise).
    zh: 案件里任何自由文本（描述、聊天、补充证据）含有安全相关内容时，单独建 SE 主张，定严重度 S0 或 S1，转人工，不管工单里还有什么。安全相关内容是任何一方讲述的以下情形：暴力或暴力威胁（攻击或企图攻击、打人、抓伤、凶器、威胁恐吓）；性不当行为（骚扰、不受欢迎的示好或触碰）；对人的任何形式的辱骂或骚扰（侮辱、带歧视的辱骂或冲人骂脏话、过分私人的问题、评论外貌、行程后因私联系乘客）；被违背意愿扣留或带走（绑架、劫持，司机不让乘客下车或要求停车也不停）；被置于危险之中（鲁莽或危险驾驶，司机受酒精或药物影响，不安全的下车，例如被赶下车留在快速公路或路肩上，或在偏僻处、夜里被司机赶下车或丢下）；事故或受伤；因种族、族裔、宗教、国籍、残疾或类似理由受到歧视；或其他犯罪。按意思判断，不按关键词：这些只是例子，不是封闭清单，没用这些词的文字也可能是安全内容（"他停在 PIE 上叫我下车"）。拿不准是不是安全内容时按安全内容处理（S1），让人工看到。只是态度不好（不友善或不耐烦、大声、回话生硬），没有辱骂、威胁、危险或歧视，不是安全内容，属于一般反馈（EX-FEEDBACK）。关于钱的争议（车费、费用、多收、司机自己加的收费）或车辆损坏，本身不是安全内容，即使这种行为可能构成犯罪；伴有暴力、威胁、危险、辱骂或歧视时才是安全内容。有人受伤、被扣留、被攻击、受到伤害威胁或处于紧迫危险时为 S0，其余为 S1。SE 类型按分类定义选（对人的行为为 SE-CONDUCT，另有 SE-DRIVING、SE-ACCIDENT，行程中途被终止为 SE-TERMINATED，司机或车辆与 App 不符为 SE-MISMATCH，车内录像设备为 SE-RECORDING，其余为 SE-OTHER）。
    produces: [SE-R-HUMAN-DECIDES]
    sources:
      - {type: RYDE_POLICY, doc: RYDE-15395890865561, quote: 'Assault, harassment, or abuse of any kind will not be tolerated.', note: "Ryde Code of Conduct item 5."}
      - {type: RYDE_POLICY, doc: RYDE-15395890865561, quote: 'We have a zero-tolerance approach to any form of misconduct or inappropriate behavior between drivers and passengers.'}
      - {type: RYDE_POLICY, doc: RYDE-15395890865561, quote: 'Attempted or Actual Physical Assault', note: "Ryde's Code of Conduct list also names 'Verbal or Physical Sexual Harassment', 'Kidnapping', 'Threats and Intimidation' and 'Unwanted Sexual Advances'."}
      - {type: RYDE_POLICY, doc: RYDE-15395890865561, quote: 'Kidnapping'}
      - {type: RYDE_POLICY, doc: RYDE-15395890865561, quote: 'Threats and Intimidation'}
      - {type: RYDE_POLICY, doc: RYDE-15395890865561, quote: "drivers must not ask overly personal questions, comment on anyone's appearance, or contact passengers after a trip for personal reasons."}
      - {type: RYDE_POLICY, doc: RYDE-15395890865561, quote: 'Reckless or dangerous driving that endangers passengers, pedestrians, or other road users is strictly prohibited.'}
      - {type: RYDE_POLICY, doc: RYDE-15395890865561, quote: 'Alcohol, drugs, and weapons are not tolerated.'}
      - {type: RYDE_POLICY, doc: RYDE-15395890865561, quote: 'Do not commit crimes.', note: "Ryde Code of Conduct item 6."}
      - {type: RYDE_POLICY, doc: RYDE-33362721809049, quote: 'Comments on race, ethnicity, national origin, disability, etc', note: "Driver Performance and Community Standards: errant behavior that disables an account."}
      - {type: INDUSTRY, doc: IND-BENCHMARK-NOTES, quote_kind: paraphrase, note: "Lyft, Grab and DiDi route safety incidents to humans (research note 02)."}
      - {type: FAIRRYDE, doc: FAIRRYDE-DECISIONS, quote_kind: none, note: "FairRyde's design (step A4, round 1 finding FX6, and A4 check round 1): the definition by meaning; the examples Ryde's lists do not name (an unsafe drop-off, being made to leave or left behind by the driver at an isolated place or at night, a driver who will not stop, an accident or an injury, religion and similar grounds read into Ryde's 'etc'); treating these as safety content, not only as conduct Ryde prohibits (discrimination and abuse included); the rule that an unclear text counts as safety content; the line between rudeness and safety; and the S0 or S1 severity. Ryde's own help pages file 'rude and/or made me feel unsafe' and 'drove dangerously' under feedback; CLS-01 sends anything beyond rudeness to a person."}
    credibility: D
    credibility_note: >-
      The conduct norm is Ryde's (A); handling safety content as its own claim is industry practice (C), and a human decides
      it as in AUTH-03 (B). Most examples are Ryde's own Code of Conduct and community standards (A); the definition by
      meaning, the examples Ryde does not name, the rule for unclear text and the severity scale are FairRyde's design, so the
      rule is D by its weakest element (A3 census, validation/round2/census.csv; it was C in v0.1). Since step A4 (FX6) it is
      a definition with examples, read for meaning, not a word list; the reference engine's patterns (SAFETY_PATTERNS in
      kb/tools/engine_noshow.py) are only an offline stand-in for that reading.
    mode: READ
    status: draft

  - id: CLS-02
    name: Split a ticket into claims
    family: CLS
    type: classification
    applies_to: [ALL]
    statement: >-
      One claim per contested charge or issue. A safety claim (any SE type, whether CLS-01 created it or the classification
      chose an SE type for it) is always the primary claim; otherwise the primary claim
      is the one contesting the largest charge; otherwise the first stated issue. Other claims are secondary. If the free text
      contradicts the organizer's dispute code, the code stays primary, the text's issue becomes a secondary claim, and the case
      is flagged for review; a safety claim still comes first.
    zh: 每个争议款项或问题一个主张。安全主张（任何 SE 类型，不论是 CLS-01 建的还是分类时选的）永远是主项；没有安全主张时，争议金额最大的主张为主项；再没有时，以最先提出的问题为主项。其他主张为次项。自由文本与组织方争议代码矛盾时，代码仍为主项，文字所述问题列为次项，并标记复核（安全主张仍优先于代码）。
    sources:
      - {type: INTERNAL_STANDARD, doc: INT-CHORDX-ONT, clause: ONT.8, quote: '一封邮件/单据涉及多个事件，只选一个会丢信息，全多选又没主次'}
    credibility: D
    credibility_note: The protocol names the pitfall (A); the ordering of primary and secondary claims is FairRyde's design (D).
    mode: HARD
    status: draft

  - id: CLS-03
    name: Not a dispute
    family: CLS
    type: classification
    applies_to: [EX, OT-OTHER, SE]
    statement: >-
      A claim with no contested charge and no remedy beyond an explanation is routed to normal support, unless CLS-01 applies
      or the claim is any SE type: every SE type is TRIAGE_TO_HUMAN, so a person decides it (AUTH-03), whether or not the text
      names a contested charge (a ride ended midway, SE-TERMINATED, goes to a person even when nothing was charged).
    zh: 没有争议款项、只要解释的主张转普通客服；但触发 CLS-01，或主张属于任何 SE 类型时除外：所有 SE 类型都是 TRIAGE_TO_HUMAN，由人裁决（AUTH-03），不论文字里有没有争议款项（行程中途被终止 SE-TERMINATED 即使没有收费也转人工）。
    produces: [GEN-R-NOT-A-DISPUTE]
    sources:
      - {type: FAIRRYDE, doc: FAIRRYDE-DECISIONS, quote_kind: none, note: "The SE exception covers every SE type since step A4 (round 1 finding FX6: a mid-trip ejection with no listed word was sent to normal support)."}
    credibility: D
    mode: HARD
    status: draft

  - id: CLS-04
    name: Location problem with a contested fee
    family: CLS
    type: classification
    applies_to: [CW-NOSHOW, CW-RIDERCANCEL, EX-LOCATION]
    statement: If a fee is contested because of a pick-up or drop-off location problem, classify by the fee (for example CW-NOSHOW), not EX-LOCATION.
    zh: 因上下车点问题而争议费用时，按费用归类（如 CW-NOSHOW），不归 EX-LOCATION。
    sources:
      - {type: FAIRRYDE, doc: FAIRRYDE-DECISIONS, quote_kind: none}
    credibility: D
    mode: HARD
    status: draft

  - id: CLS-05
    name: Organizer dispute codes
    family: CLS
    type: classification
    applies_to: [ALL]
    statement: Map dispute_ticket.dispute_type through organizer_code (no_show_charge -> CW-NOSHOW). Contradictions between the code and the free text are handled by CLS-02. For a cancellation-fee claim, who canceled according to the trip record decides the type, over the code (CLS-06).
    zh: 用 organizer_code 映射组织方代码；代码与文字矛盾时按 CLS-02 处理。取消费主张的类型按行程记录里是谁取消的来定，优先于代码（CLS-06）。
    sources:
      - {type: ORGANIZER, doc: ORG-DISP002, quote: '"dispute_type": "no_show_charge"'}
    credibility: A
    mode: HARD
    status: draft

  - id: CLS-06
    name: Who canceled decides the cancellation-fee type
    family: CLS
    type: classification
    applies_to: [CW-NOSHOW, CW-RIDERCANCEL, CW-OTHER]
    statement: >-
      A cancellation-fee claim is classified by who canceled according to the trip record (trip_data.cancellation_reason, a
      cancelled_by field when the record has one, the driver_cancelled or rider_cancelled event, the system message), not by
      the parties' text. The driver canceled with reason rider_no_show: CW-NOSHOW. The rider canceled: CW-RIDERCANCEL. The
      driver canceled for another reason (driver_cancelled_other, safety_termination, other), or the system canceled: CW-OTHER,
      which a person decides (GEN-R07); a system cancellation goes there whether or not a reason is recorded. If these
      records disagree, or a record names the canceling party in words that cannot be read, or none of them says who
      canceled, or the driver canceled and the record gives no reason, the type cannot be set: the outcome is REQUEST_INFO
      (reason GEN-R-NEED-INFO, tier HUMAN), the trip record is requested from the platform, and no ruling on the fee is made
      until it arrives.
    zh: 取消费主张按行程记录里是谁取消的来分类（trip_data.cancellation_reason、记录里有的 cancelled_by 字段、driver_cancelled 或 rider_cancelled 事件、系统消息），不按双方的文字。司机以 rider_no_show 取消：CW-NOSHOW。乘客取消：CW-RIDERCANCEL。司机因其他原因取消（driver_cancelled_other、safety_termination、other）或系统取消：CW-OTHER，由人裁决（GEN-R07）；系统取消不论有没有记录原因都归这里。这些记录互相矛盾、某条记录用读不懂的说法写了取消方、都没说谁取消、或司机取消但记录没有原因时，无法定类型：结果为 REQUEST_INFO（理由 GEN-R-NEED-INFO，人工处理），向平台调取行程记录，记录到之前不对收费作任何裁决。
    produces: [GEN-R-NEED-INFO]
    sources:
      - {type: ORGANIZER, doc: ORG-DISP002, quote: '"cancellation_reason": "rider_no_show"'}
      - {type: RYDE_POLICY, doc: RYDE-23534478435353, quote: 'Rider cancels after 3 minutes of matching OR'}
      - {type: FAIRRYDE, doc: FAIRRYDE-DECISIONS, quote_kind: none, note: "Taking the canceling party from the records, sending other cancellations to CW-OTHER and asking when the records are silent or disagree is FairRyde's classification design (step A4, round 1 finding FX8, complaint C04; A4 check round 1)."}
    credibility: D
    credibility_note: Ryde's policy distinguishes a rider cancellation from a driver's no-show cancellation (A); using the records, not the text, to tell them apart, and asking when they are silent or disagree, is FairRyde's design (D).
    mode: HARD
    status: draft

  # ---------------------------------------------------------------- MAT
  - id: MAT-01
    name: Resolve the trip
    family: MAT
    type: matching
    applies_to: [ALL]
    statement: >-
      Every claim must resolve to exactly one trip: use trip_id if given; otherwise match the claimant's account, the time window
      and the place. With zero or several candidates, ask the claimant for the trip.
    zh: 每个主张必须对应唯一行程；没有 trip_id 时按账户、时间窗、地点匹配；匹配不到或多于一个则要求补充信息。
    produces: [GEN-R-NEED-INFO]
    sources:
      - {type: INTERNAL_STANDARD, doc: INT-CHORDX-ONT, clause: ONT.8, quote: '关键实体不出现在正文里（靠线程、发件人、上下文推断）'}
    credibility: D
    mode: HARD
    status: draft

  - id: MAT-02
    name: New, duplicate, update, appeal or counter-claim
    family: MAT
    type: matching
    applies_to: [ALL]
    statement: >-
      Same claimant, trip and charge while a ticket is open: DUPLICATE (merge). The same after it is closed: APPEAL (reopen).
      New information on an open ticket: UPDATE (re-run facts). The other party about the same trip: COUNTER_CLAIM (linked
      claim, shared facts decided once). Different issue on the same trip: RELATED_OTHER.
    zh: 同人同行程同款项且工单未关为重复（合并）；已关为申诉（重开）；补充信息为更新；对方就同一行程提出为反诉；同一行程不同问题为关联。
    produces: [GEN-R-DUPLICATE]
    sources:
      - {type: INTERNAL_STANDARD, doc: INT-CHORDX-ONT, clause: ONT.8, quote: '"更新已有任务"比"新建任务"难，需要判断是不是同一件事'}
      - {type: RYDE_POLICY, doc: RYDE-900004381243, quote: 'You can appeal within 24 hours if you disagree with the outcome of your claim with any additional supporting evidence.', note: "Ryde lets drivers appeal a cleaning-claim outcome, so appeals of decided cases exist."}
    credibility: D
    mode: HARD
    status: draft

  - id: MAT-03
    name: Appeals of automatic rulings go to a human
    family: MAT
    type: procedural
    applies_to: [ALL]
    statement: An appeal against an automatic ruling is always reviewed by a human, who confirms or changes it (autonomy tier APPROVE), with the earlier ruling and its trace attached.
    zh: 对自动裁决的申诉一律由人处理，附上原裁决与推理记录。
    sources:
      - {type: GOV_GUIDANCE, doc: GOV-IMDA-AGENTIC, quote: 'Organisations should define significant checkpoints or action boundaries that require human approval, especially before sensitive actions are executed.'}
      - {type: RYDE_POLICY, doc: RYDE-900004381243, quote: 'You can appeal within 24 hours if you disagree with the outcome of your claim with any additional supporting evidence.', note: "Ryde already lets drivers appeal cleaning-claim outcomes."}
    credibility: D
    credibility_note: Checkpoints are official guidance (B) and Ryde has appeal routes (A); sending every appeal of an automatic ruling to a human is FairRyde's design (D).
    mode: HARD
    status: draft

  - id: MAT-04
    name: Rider waiver filing window
    family: MAT
    type: eligibility
    applies_to: [CW-NOSHOW, CW-RIDERCANCEL, CW-WAITING]
    statement: A rider's request to waive a cancellation or waiting fee filed more than 30 days after the trip is not considered.
    zh: 乘客申请免除取消费或等候费须在行程后 30 天内。
    params: [WAIVER_WINDOW_DAYS]
    produces_finding: F-FILING-WINDOW
    produces: [CW-R-OUT-OF-WINDOW]
    sources:
      - {type: RYDE_POLICY, doc: RYDE-18229758389017, quote: '*Requests submitted after 30 days of the trip will not be considered for waivers.'}
      - {type: RYDE_POLICY, doc: RYDE-27085468660505, quote: 'you may submit a fee waiver request via RydeHELP in our app within 30 days of the trip*'}
    credibility: A
    mode: HARD
    status: draft

  # ---------------------------------------------------------------- DQ
  - id: DQ-01
    name: Cross-source timestamp consistency
    family: DQ
    type: data_quality
    applies_to: [ALL]
    statement: >-
      Records of the same moment must agree within TS_TOLERANCE_S. Moments: the arrival (trip driver_arrival_time, the
      driver_arrived event, the GPS 'arrived' ping); the wait start (trip driver_wait_start, the wait_timer_started event, plus
      the arrival records when the wait starts at the arrival); the end (cancellation time, fee event, system message, GPS
      'cancelled' ping). Beyond tolerance: flag TIMER_ANCHOR_MISMATCH, which fires gate G1, so FairRyde's ruling stays
      provisional for a person to approve (AUTH-04). When the platform's arrival check and the GPS contradict each other about
      the arrival itself, the arrival is CONTESTED and the case escalates (DT-CW-NOSHOW row R2, reason GEN-R-DATA-INCONSISTENT).
    zh: 同一时刻的各条记录相差不超过容差。时刻分三类：到达（行程记录到达时间、到达事件、GPS"arrived"点）；等待开始（行程记录等待开始、计时开始事件，等待从到达起算时加上到达记录）；结束（取消时间、收费事件、系统消息、GPS"cancelled"点）。超出容差打 TIMER_ANCHOR_MISMATCH，触发升级门 G1，FairRyde 的裁决作为暂定裁决交人批准；平台到达校验与 GPS 对到达本身互相矛盾时，到达为 CONTESTED，转人工（决策表 R2 行）。
    params: [TS_TOLERANCE_S]
    produces_finding: F-TS-CONSISTENCY
    produces: [GEN-R-DATA-INCONSISTENT]
    sources:
      - {type: FAIRRYDE, doc: FAIRRYDE-DECISIONS, quote_kind: none, note: "DISP-002 logs wait_timer_started 10 s after driver_arrived."}
    credibility: D
    mode: HARD
    status: draft

  - id: DQ-02
    name: Speed consistency
    family: DQ
    type: data_quality
    applies_to: [ALL]
    statement: >-
      Within the pings the playbook decides on (the wait window for CW, the trip for FC), reported speed above SPEED_RATIO_SOFT
      times the speed implied by consecutive pings is a soft flag (SPEED_INCONSISTENT). Implied speed above SPEED_MAX_KMH is a
      hard data error: the jump is set aside (CW-F04B), flagged GPS_DATA_ERROR, and fires gate G1, so the ruling needs human
      approval.
    zh: 只检查操作指引用来判断的定位点（取消类看等待窗口，车费类看全程）：报告车速超过推算车速的倍数阈值记软标记 SPEED_INCONSISTENT；推算车速超过上限是硬错误：剔除这次跳变（CW-F04B），打 GPS_DATA_ERROR，触发升级门 G1，裁决需人工批准。
    params: [SPEED_RATIO_SOFT, SPEED_MAX_KMH]
    produces_finding: F-SPEED-CONSISTENCY
    sources:
      - {type: FAIRRYDE, doc: FAIRRYDE-DECISIONS, quote_kind: none}
    credibility: D
    mode: HARD
    status: draft

  - id: DQ-03
    name: Coordinates and venue sanity
    family: DQ
    type: data_quality
    applies_to: [ALL]
    statement: All coordinates must fall inside the Singapore bounding box; named venues are looked up in OneMap to obtain reference coordinates.
    zh: 坐标须在新加坡范围内；地名用 OneMap 查参考坐标。
    params: [SG_BBOX]
    sources:
      - {type: FAIRRYDE, doc: FAIRRYDE-DECISIONS, quote_kind: none}
    credibility: D
    mode: HARD
    status: draft

  - id: DQ-04
    name: Timeline ordering
    family: DQ
    type: data_quality
    applies_to: [ALL]
    statement: Events are in time order, the dispute is filed after the trip event it contests, and no event precedes booking.
    zh: 事件按时间排序，申诉晚于被争议事件，任何事件不早于下单。
    sources:
      - {type: FAIRRYDE, doc: FAIRRYDE-DECISIONS, quote_kind: none}
    credibility: D
    mode: HARD
    status: draft

  - id: DQ-05
    name: Fare arithmetic
    family: DQ
    type: data_quality
    applies_to: [FC]
    statement: Fare components (trip fare, platform fee, transaction fee, ERP, destination fee, waiting fee) sum to the total charged within S$0.01.
    zh: 车费各项加总与实收差额不超过 0.01 新元。
    sources:
      - {type: RYDE_POLICY, doc: RYDE-30741244296217, quote: 'For a detailed breakdown of your fare, please refer to your receipt.'}
    params: [MONEY_TOLERANCE_SGD]
    credibility: D
    credibility_note: Ryde says the receipt lists all components (A); the S$0.01 tolerance is FairRyde's (D).
    mode: HARD
    status: draft

  - id: DQ-06
    name: Charged amount versus the policy amount
    family: DQ
    type: data_quality
    applies_to: [CW]
    statement: >-
      Compare the fee actually charged with the profile's policy amount for that fee. Equal within MONEY_TOLERANCE_SGD:
      consistent. Charged more: flag CHARGE_AMOUNT_MISMATCH; the ruling needs human approval (AUTH-02 trigger 7), so the
      excess is never upheld automatically. Charged less: flag only; the claimant was not disadvantaged.
    zh: 实收费用与参数档的政策金额比较；多收则打标记，裁决需人工批准（AUTH-02 第 7 条），多收部分不自动维持；少收只标记。
    params: [NO_SHOW_FEE_SGD, RIDER_CANCEL_FEE_SGD, WAITING_FEE_SGD, MONEY_TOLERANCE_SGD]
    produces_finding: F-CHARGE-AMOUNT
    sources:
      - {type: ORGANIZER, doc: ORG-DISP002, quote: '"cancellation_fee": 5.00', profile: organizer_case}
      - {type: RYDE_POLICY, doc: RYDE-23534478435353, quote: 'Rider will be charged a Cancellation Fee of $6.61* if:', profile: ryde_2026, note: "Quoted for the amount only."}
    credibility: D
    credibility_note: The policy amounts are A; treating a mismatch as a reason to escalate is FairRyde's choice (D).
    mode: HARD
    status: draft

  # ---------------------------------------------------------------- CW facts
  - id: CW-F01
    name: Booking type
    family: CW
    type: fact
    applies_to: [CW]
    statement: >-
      Use the recorded booking type. If it is not recorded: matched within BOOKING_INFER_MATCH_S of booking and ETA within
      BOOKING_INFER_ETA_S of scheduled_time means ON_DEMAND; otherwise ADVANCE. Add flag BOOKING_TYPE_INFERRED. If the
      booking or assignment record or scheduled_time is missing, the type cannot be inferred: ADVANCE, and also flag
      RECORDS_MISSING so a person checks the ruling (FairRyde, GEN-R01).
    zh: 有记录用记录；没有则按派单速度与 ETA 是否贴近预约时间推断，并打 BOOKING_TYPE_INFERRED。缺下单或派单记录或预约时间时无法推断：按 ADVANCE，并打 RECORDS_MISSING，交人工批准（FairRyde，GEN-R01）。
    params: [BOOKING_INFER_MATCH_S, BOOKING_INFER_ETA_S]
    produces_finding: F-BOOKING-TYPE
    sources:
      - {type: ORGANIZER, doc: ORG-DISP002, quote: 'Scheduled pickup 08:45.', note: "DISP-002 says 'Scheduled pickup' yet assigns in 15 s with a 13-minute ETA; booking type is not recorded."}
    credibility: D
    mode: HARD
    status: draft

  - id: CW-F02
    name: Wait anchor (organizer cases and on-demand trips)
    family: CW
    type: fact
    applies_to: [CW-NOSHOW, CW-WAITING]
    statement: >-
      Organizer profile: the wait starts at trip_data.driver_wait_start. Ryde profile, on-demand: the wait starts when the driver
      presses "I'm Here", provided the driver is at the pick-up point according to GPS (CW-R06).
    zh: 组织方案例以 driver_wait_start 为等待起点；Ryde 即时单以司机按"I'm Here"为起点（须 GPS 在点）。
    params: [WAIT_ANCHOR_FIELD]
    produces_finding: F-WAIT-ANCHOR
    sources:
      - {type: ORGANIZER, doc: ORG-DISP002, quote: '"driver_wait_start": "2026-09-13T08:43:00+08:00"', profile: organizer_case}
      - {type: RYDE_POLICY, doc: RYDE-23534478435353, quote: 'waits for > 3 minutes for the rider to arrive at the pick-up point and cancels the trip (Rider NO SHOW and no trip completion)', profile: ryde_2026}
    credibility: A
    mode: HARD
    status: draft

  - id: CW-F02B
    name: Wait anchor for advance bookings when the driver is early
    family: CW
    type: fact
    applies_to: [CW-NOSHOW, CW-WAITING]
    statement: >-
      Ryde profile only. For an ADVANCE booking, the wait starts at the later of the driver's arrival and scheduled_time.
      Ryde's rider policy does not say where the wait starts when the driver is early; an older driver article counts from
      arrival, which read literally would allow a fee before the scheduled time. FairRyde follows Grab and Bolt and records
      the conflict.
    zh: 仅用于 Ryde 参数档。预约单的等待从"司机到达"与"预约时间"中较晚者算起。Ryde 乘客政策没写司机早到时从何时算；一篇较早的司机文章写"到达后 3 分钟内乘客未出现"，按字面会允许在预约时间前收费；FairRyde 采用 Grab 和 Bolt 的做法并记录这一冲突。
    produces_finding: F-WAIT-ANCHOR
    sources:
      - {type: INDUSTRY, doc: IND-GRAB-ADVANCE, quote: 'Your driver will arrive early and wait for you for up to 15 minutes starting from the indicated pickup time.'}
      - {type: INDUSTRY, doc: IND-BOLT-SCHEDULED, quote: 'The scheduled wait time of 5 minutes will be counted only from the scheduled start of the ride.'}
      - {type: RYDE_POLICY, doc: RYDE-23575142762393, quote: 'You arrived at the pickup location and the customer was not present within 3 minutes of your arrival.', note: "Driver article (2023), not specific to advance bookings; conflicts with the rule above for early drivers."}
      - {type: RYDE_POLICY, doc: RYDE-20244064619161, quote: 'The driver pressed "I''m Here", waits for > 3 minutes for rider to arrive at the pick-up point and cancels the trip', note: "Driver policy pages (2024-04-23, and RYDE-33362932998937 of 2024-06-05 with the same words) count an advance trip's wait from 'I'm Here' too; they conflict with the rule above for early drivers in the same way (round 1 finding FX9)."}
    credibility: C
    mode: HARD
    status: draft
    open_question: "Ask the organizer whether DISP-002 was an advance booking (question O3)."

  - id: CW-F03
    name: Elapsed wait and margin
    family: CW
    type: fact
    applies_to: [CW-NOSHOW, CW-WAITING]
    statement: >-
      elapsed = cancellation_time (or boarding time) minus the wait start: the wait anchor (CW-F02, CW-F02B), moved later to
      the GPS confirmation when CW-F03B applies; margin = elapsed minus the threshold of the claim (NO_SHOW_THRESHOLD_S for a
      no-show fee, FREE_WAIT_S for a waiting fee), compared as the profile states (organizer: at least the threshold; Ryde:
      more than the threshold). |margin| within BOUNDARY_BAND_S adds flag BOUNDARY_MARGIN; if the records of the start or end
      time (DQ-01) differ by more than |margin|, also add MARGIN_WITHIN_SPREAD.
    zh: 已等时长 = 取消（或上车）时间减等待起点：等待锚点（CW-F02、CW-F02B），适用 CW-F03B 时后移到 GPS 确认的时刻；余量 = 已等时长减该类主张的阈值（缺席取消费用 no-show 阈值，等候费用免费等待时长）；比较方式按参数档（组织方含等号，Ryde 严格大于）；余量落在边界带内打 BOUNDARY_MARGIN，各记录对起止时刻的差异大于余量时再打 MARGIN_WITHIN_SPREAD。
    params: [NO_SHOW_THRESHOLD_S, FREE_WAIT_S, THRESHOLD_COMPARISON, BOUNDARY_BAND_S]
    flag_only_params: [BOUNDARY_BAND_S]
    produces_finding: [F-WAIT-ELAPSED, F-WAIT-MARGIN]
    sources:
      - {type: ORGANIZER, doc: ORG-DISP002, quote: 'No-show threshold (8 min) reached.', profile: organizer_case, note: "Logged at exactly 8:00 after driver_wait_start, so the organizer counts 'at least 8 minutes'."}
      - {type: RYDE_POLICY, doc: RYDE-4407754403353, quote: 'Has waited for more than 3 mins', profile: ryde_2026}
    credibility: A
    credibility_note: Threshold and comparison are A; the 30 s boundary band is a FairRyde parameter (D) that only adds a flag.
    mode: HARD
    status: draft

  - id: CW-F03B
    name: The wait starts no earlier than the GPS confirmation
    family: CW
    type: fact
    applies_to: [CW-NOSHOW, CW-WAITING]
    statement: >-
      The wait counts from the later of the wait anchor (CW-F02, CW-F02B) and the moment CW-R06 confirmed the driver at the
      pick-up point: the arrival itself when it was confirmed there, or the first inside ping when it was not
      (ARRIVAL_UNCONFIRMED). Ryde makes GPS presence a condition for indicating arrival and for the fee, but does not say what
      happens to a wait whose start the GPS does not support. Two other readings exist: the literal one (no fee at all when
      arrival was indicated before GPS shows the driver there) and counting from the anchor regardless of GPS. FairRyde takes
      the middle reading, so this rule is decisive whenever either other reading would change the outcome (decisive_definition
      clause 1), and the ruling then needs human approval.
    zh: 等待从等待锚点（CW-F02、CW-F02B）和 CW-R06 确认司机在上车点的时刻两者中较晚的那个起算：到达时已确认就是到达时刻，到达时未确认（ARRIVAL_UNCONFIRMED）就是第一个半径内的点。Ryde 把 GPS 在场作为标记到达和收费的条件，但没有说 GPS 不支持的等待起点怎么处理。另有两种读法：字面读法（GPS 显示司机到场之前就标记到达，则完全不收费），以及不管 GPS 一律从锚点起算。FairRyde 取中间读法，所以只要另两种读法之一会改变结果，本规则就是决定性的（decisive_definition 第 1 条），裁决需要人工批准。
    sources:
      - {type: RYDE_POLICY, doc: RYDE-4407754403353, quote: 'Drivers are only allowed to indicate arrival and impose the Waiting Time Fee only if he/she:'}
      - {type: RYDE_POLICY, doc: RYDE-4407754403353, quote: 'Is at the pick-up location according to GPS data'}
      - {type: FAIRRYDE, doc: FAIRRYDE-DECISIONS, quote_kind: none, note: "Where the wait starts when GPS confirms the driver only after the arrival indication is FairRyde's reading (D26)."}
    credibility: D
    credibility_note: The GPS condition is Ryde text (B, see CW-R06); where the wait starts when that condition fails is FairRyde's inference, so D. The decisive test compares it with the two other readings in every case where it moves the start.
    mode: HARD
    status: draft

  - id: CW-F04
    name: Driver presence at the pick-up point
    family: CW
    type: fact
    applies_to: [CW-NOSHOW, CW-WAITING]
    statement: >-
      Ryde's condition: the driver is at the pick-up location according to GPS during the waiting the fee pays for. Window =
      from the confirmed wait start (CW-F03) until the threshold is reached, or until the cancellation (or boarding) if that
      comes first; leaving after the threshold is reached does not count (Ryde: the driver "waits for > 3 minutes ... and
      cancels"). How the driver's pings become the finding F-PRESENCE (CONSISTENT, SPARSE, LEFT or UNKNOWN) is FairRyde's
      presence logic, CW-F04B (credibility D). CW-F04B's finding F-GPS-LOGIC says whether the pings alone show the driver
      arrived and present (false) or the logic makes the driver count as such (true); when it is true, or would be true with
      one of CW-F04B's parameters at an end of its plausible range, an upheld fee needs human approval (decision D29).
    zh: Ryde 的条件：在收费所对应的等待期间，按 GPS 数据司机在上车点。窗口 = 从确认的等待起点（CW-F03）到达到阈值为止（若先取消或上车则到那时）；达到阈值之后离开不算（Ryde："等超过 3 分钟……然后取消"）。定位点怎样变成 F-PRESENCE（CONSISTENT、SPARSE、LEFT 或 UNKNOWN），是 FairRyde 的在场判断逻辑 CW-F04B（可信度 D）。CW-F04B 的 F-GPS-LOGIC 说明是定位点本身就显示司机已到达并在场（假），还是这套逻辑让司机算作如此（真）；为真时，或 CW-F04B 某个参数取其合理区间一端时会为真，维持收费需要人工批准（决定 D29）。
    produces_finding: F-PRESENCE
    sources:
      - {type: RYDE_POLICY, doc: RYDE-4407754403353, quote: 'Is at the pick-up location according to GPS data'}
      - {type: RYDE_POLICY, doc: RYDE-4407754403353, quote: 'Has waited for more than 3 mins', note: "The article's two conditions together (at the pick-up location according to GPS, and has waited more than 3 minutes) are read as presence at the pick-up during the wait up to the threshold."}
      - {type: RYDE_POLICY, doc: RYDE-23534478435353, quote: 'The driver presses "I''m Here", waits for > 3 minutes for the rider to arrive at the pick-up point and cancels the trip (Rider NO SHOW and no trip completion)', note: "The window: the wait the fee pays for ends at the threshold (waits for more than 3 minutes, then cancels)."}
      - {type: ORGANIZER, doc: ORG-DISP002, quote: 'Driver GPS within 10m of pickup point.', note: "The organizer's system uses 10 m for auto-arrival; FairRyde uses a wider radius for presence (CW-F04B)."}
    credibility: B
    credibility_note: >-
      The GPS condition is in a Ryde rider article whose wording about the fee name conflicts with the main policy page
      (META-04). The same article joins it to the wait ('Is at the pick-up location according to GPS data AND Has waited for
      more than 3 mins'); reading the two together as presence at the pick-up for the wait up to the threshold, which ends
      where the main policy page's 'waits for > 3 minutes ... and cancels' does, interprets Ryde text, so the norm is B. Since v0.2 (step A3, round 1 finding FX4) everything FairRyde added to turn pings into the finding is a separate
      rule, CW-F04B (D), with the radius, gap, outlier and tolerance parameters. A decision-table row on which an upheld fee
      rests on that logic is rated D (R9, R11), and so are the rows for UNKNOWN and SPARSE (R5, R10). R4 (LEFT) stays B:
      setting a ping aside or not counting it only removes evidence that the driver was away, so a LEFT found with the logic
      also holds on the pings alone (except a data error, gate G1; see the DT-CW-NOSHOW note and open item D39).
    mode: HARD
    status: draft

  - id: CW-F04B
    name: FairRyde's GPS presence logic
    family: CW
    type: fact
    applies_to: [CW-NOSHOW, CW-WAITING]
    statement: >-
      How FairRyde turns the driver's pings into CW-R06's arrival check and CW-F04's presence finding; Ryde states the
      condition, not how pings settle it. Pings are sorted by time. An outside stretch = consecutive pings more than
      ARRIVAL_GEOFENCE_M from the pick-up pin, after the driver was first seen inside the area. It is a GPS outlier, set aside
      and flagged GPS_OUTLIER, if the driver is seen inside again after it and it lasts less than LEFT_MIN_OUTSIDE_S from its
      first to its last ping (a single such ping included). A stretch with no later inside ping is never an outlier on
      duration, because nothing shows it was brief. A stretch the driver would have had to enter or leave faster than
      SPEED_MAX_KMH is a data error: set aside and flagged GPS_OUTLIER and GPS_DATA_ERROR (DQ-02). Pings before the driver was
      first seen inside are the approach: never outliers on duration (an impossible jump into the area is still a data
      error). F-PRESENCE over CW-F04's window: UNKNOWN if the window has no length or no ping falls inside it. LEFT if an
      outside stretch that is not set aside is seen outside (from its first to its last ping) at some time inside the window
      at least TS_TOLERANCE_S before the window end (for the approach, also more than TS_TOLERANCE_S after the window start),
      because records of the same moment can differ by that much; outside pings closer to the edges of the window are
      reported but do not count as leaving. Otherwise SPARSE if the longest part of the window between its start, the inside
      pings and its end exceeds PING_MAX_GAP_S, else CONSISTENT; but when CW-R06 did not confirm the arrival (any value other
      than TRUE) the window start is not a point at the pick-up, so with no inside ping in the window the value is UNKNOWN.
      Only pings inside the window decide the value; pings outside it only show where a stretch begins and whether the
      driver came back. CONSISTENT means the pings agree with presence; it does not mean the driver was observed
      continuously. GPS_AMBIGUOUS (approval, AUTH-02) is added when the pings cannot settle the question: a stretch set aside
      on duration although the inside pings around it are more than LEFT_MIN_OUTSIDE_S apart, when it is first seen before
      the cancellation (or boarding), or by TS_TOLERANCE_S after the window end, and the inside ping before it is more than
      TS_TOLERANCE_S before the window end; a stretch that is not set aside and does not count, first seen outside between
      the window start and the cancellation (or boarding), or TS_TOLERANCE_S after the window end if that is later, while the last inside ping before it is more than TS_TOLERANCE_S before the window end (the driver may
      have left before the window ended); a window that starts after the confirmed arrival (an advance booking, or a later
      wait start in the trip record) when the last remaining observation before it is outside the area and no inside ping
      comes until more than TS_TOLERANCE_S into the window (the driver may not have been back when it started); a
      departure, or a FALSE arrival (CW-R06), that rests on a single ping. The value itself does not change. F-GPS-LOGIC is true when this
      logic, and not the pings alone, makes the driver count as arrived and present: a ping that could change the arrival
      or the presence was set aside as an outlier or a data error, that is, a ping inside the window, or one that would
      otherwise have been CW-R06's moment ping (in the moment range, from PING_MAX_GAP_S before the indication to
      TS_TOLERANCE_S after it, with no remaining ping after it in that range; when the platform's own arrival check confirms
      the arrival, only one at or after the indication, which could contradict it); a ping outside the
      area inside the window was not counted as leaving (near the window start or end, or the approach); the arrival was
      not confirmed at the indication and only a later ping confirmed it (ARRIVAL_UNCONFIRMED, CW-F03B), whether or not the
      wait start moved; presence is SPARSE; or GPS_AMBIGUOUS holds. Otherwise it is false. A fee upheld on the merits needs
      human approval (tier APPROVE), never AUTO (decision D29), when F-GPS-LOGIC is true, and also when it would be true
      with one of this rule's parameters (ARRIVAL_GEOFENCE_M, PING_MAX_GAP_S, LEFT_MIN_OUTSIDE_S, SPEED_MAX_KMH,
      TS_TOLERANCE_S) at either end of its plausible range, because D29 names the ping-gap and radius parameters as part of
      the logic: a no-show fee through DT-CW-NOSHOW, whose rows for it (R9, R11) are rated D, so the row is decisive and a
      parameter that moves the case onto them is decisive too (decisive_definition clauses 2 and 3); a waiting fee, which
      has no decision table (D31), through AUTH-02 trigger 12, which states both parts. A waiver for LEFT or a FALSE arrival does
      not rest on the logic in this way: setting a ping aside or not counting it only removes evidence that the driver was
      away, so a LEFT or a FALSE arrival found with the logic also holds on the pings alone, except where a data error was
      set aside, which fires gate G1 (approval). A waiver for a short wait (R6) can rest on a later GPS confirmation that
      moved the wait start; CW-F03B's start test covers it.
    zh: FairRyde 怎样把司机的定位点变成 CW-R06 的到达校验和 CW-F04 的在场认定；Ryde 只规定了条件，没有规定怎样用定位点判断。定位点按时间排序。"在外时段"= 司机第一次进入上车区域之后、连续离上车点超过 ARRIVAL_GEOFENCE_M 的定位点。之后又看到司机回到半径内、且持续时间（首点到末点）短于 LEFT_MIN_OUTSIDE_S 的（单个点也算），是 GPS 离群点，剔除并打 GPS_OUTLIER；之后再没有半径内的点的在外时段，不能证明它很短，不按时长算离群。进出所需车速超过 SPEED_MAX_KMH 的是数据错误：剔除，打 GPS_OUTLIER 和 GPS_DATA_ERROR（见 DQ-02）。司机第一次进入区域之前的点是驶近：不按时长算离群（以不可能的车速跳进区域仍是数据错误）。在 CW-F04 的窗口内认定 F-PRESENCE：窗口长度为零或窗口内没有定位点为 UNKNOWN；没被剔除的在外时段（从第一个到最后一个在外点）在窗口内、早于窗口终点至少 TS_TOLERANCE_S 的某个时刻在外（驶近还要晚于窗口起点 TS_TOLERANCE_S 以上）为 LEFT，因为同一时刻的不同记录可能差这么多；更靠近窗口两端的在外点照样报告，但不算离开；否则，窗口起点、半径内各点、窗口终点之间最长的一段超过 PING_MAX_GAP_S 为 SPARSE，否则为 CONSISTENT；但 CW-R06 没有确认到达（不是 TRUE）时，窗口起点不算司机在上车点的证据，窗口内没有半径内的点就为 UNKNOWN。只有窗口内的点决定结果；窗口外的点只用来看在外时段从哪里开始、司机有没有回来。CONSISTENT 只表示定位点与在场一致，不表示司机被连续观测到。定位点无法下结论时加 GPS_AMBIGUOUS（需人工批准，见 AUTH-02）：按时长剔除的在外时段，前后两个半径内的点相隔超过 LEFT_MIN_OUTSIDE_S，且它在取消（或上车）之前、或窗口终点后 TS_TOLERANCE_S 之内出现，前一个半径内的点早于窗口终点 TS_TOLERANCE_S 以上；没被剔除、也不算离开的在外时段，第一次在外出现在窗口起点到取消（或上车）之间（若窗口终点后 TS_TOLERANCE_S 更晚，则到那时），而它前面最后一个半径内的点早于窗口终点 TS_TOLERANCE_S 以上（司机可能在窗口结束前就离开了）；窗口在确认到达之后才开始（预约单，或行程记录里较晚的等待起点），而窗口开始前最后一个剩下的观测在半径外、窗口开始 TS_TOLERANCE_S 以后才有半径内的点（窗口开始时司机可能还没回来）；离开或 CW-R06 的 FALSE 只靠一个点。结果本身不变。是这套逻辑、而不是定位点本身让司机算作已到达并在场时，F-GPS-LOGIC 为真：可能改变到达或在场认定的点被剔除（GPS_OUTLIER 或 GPS_DATA_ERROR），即窗口内的点，或本来会成为 CW-R06 的到达时刻点的点（在到达标记前 PING_MAX_GAP_S 到标记后 TS_TOLERANCE_S 之间、且这段时间里它之后没有剩下的点；平台自己的到达校验已确认到达时，只算标记时刻及之后、可能否定它的点）；窗口内有半径外的点没算作离开（靠近窗口起点或终点，或属驶近）；到达在标记时未确认、只由之后的定位点确认（ARRIVAL_UNCONFIRMED，CW-F03B），不论等待起点是否因此后移；在场为 SPARSE；或有 GPS_AMBIGUOUS。否则为假。按是非曲直维持收费时，F-GPS-LOGIC 为真，或本规则某个参数（ARRIVAL_GEOFENCE_M、PING_MAX_GAP_S、LEFT_MIN_OUTSIDE_S、SPEED_MAX_KMH、TS_TOLERANCE_S）取其合理区间任一端时会为真，一律需人工批准（APPROVE），不能自动（决定 D29，D29 把定位间隔和半径参数列为这套逻辑的一部分）：缺席取消费经由 DT-CW-NOSHOW（对应的 R9、R11 行可信度为 D，所以该行是决定性的，把案件移到这些行的参数也是决定性的，见 decisive_definition 第 2、3 条）；等候费没有决策表（D31），经由 AUTH-02 第 12 项，该项写明了这两部分。因 LEFT 或到达 FALSE 而免除收费，不以这种方式依赖这套逻辑：剔除或不计入某个点，只会去掉司机不在场的证据，所以用这套逻辑得出的 LEFT 或到达 FALSE，只看定位点本身也成立；例外是剔除了数据错误，这时触发升级门 G1（需批准）。因等待时间不足而免除（R6）可能依赖后移了等待起点的之后的 GPS 确认，由 CW-F03B 的起点测试覆盖。
    params: [ARRIVAL_GEOFENCE_M, PING_MAX_GAP_S, LEFT_MIN_OUTSIDE_S, SPEED_MAX_KMH, TS_TOLERANCE_S]
    produces_finding: [F-PRESENCE, F-GPS-LOGIC]
    sources:
      - {type: FAIRRYDE, doc: FAIRRYDE-DECISIONS, quote_kind: none, note: "FairRyde's presence logic (open items D18, D24, D26), split out of CW-F04 in step A3 (round 1 finding FX4). D29 (Jasper, 2026-10-11): an upheld fee that rests on it needs human approval."}
      - {type: RYDE_POLICY, doc: RYDE-4407754403353, quote: 'Is at the pick-up location according to GPS data', note: "The condition the logic serves (CW-F04, CW-R06); Ryde does not say how GPS presence is checked."}
    credibility: D
    credibility_note: >-
      FairRyde's design (D): Ryde does not say how GPS presence at the pick-up is checked (radius, ping gap, outliers). The
      radius, maximum gap, outlier run length, maximum speed and timestamp tolerance are FairRyde parameters (D), tested case
      by case by the sensitivity test (decisive_definition clause 2). An answer from the organizer on how Ryde checks GPS
      presence would lift part of this rule.
    mode: HARD
    status: draft

  - id: CW-F05
    name: Contact attempts
    family: CW
    type: fact
    applies_to: [CW-NOSHOW]
    statement: >-
      ADEQUATE if, between arrival and cancellation, the driver made at least CONTACT_MIN_CALLS call or CONTACT_MIN_MESSAGES
      messages, or the rider contacted the driver; INSUFFICIENT if fewer; NONE if no contact at all.
    zh: 到达至取消之间司机至少打 1 通电话或发 2 条消息（或乘客联系过司机）为 ADEQUATE。
    params: [CONTACT_MIN_CALLS, CONTACT_MIN_MESSAGES]
    produces_finding: F-CONTACT
    sources:
      - {type: RYDE_POLICY, doc: RYDE-115001438754, quote: 'Try to contact the rider by in-app chat or call.'}
      - {type: INDUSTRY, doc: IND-BENCHMARK-NOTES, quote: 'Attempted to contact you (or you contacted them)', note: "Lyft's no-show conditions (research note 02)."}
    credibility: D
    credibility_note: Ryde's driver guidance (an older article) asks drivers to try to contact the rider (B); the minimum counts are FairRyde parameters (D). The finding only feeds CW-R04 (approval tier), never the outcome.
    mode: HARD
