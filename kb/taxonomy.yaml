      - {code: TIMER_ANCHOR_MISMATCH, label: System timers use different start points beyond tolerance}
      - {code: BOOKING_TYPE_INFERRED, label: Booking type not recorded; inferred}
      - {code: PIN_VENUE_MISMATCH, label: Pickup pin far from the named venue (OneMap)}
      - {code: SPARSE_GPS, label: GPS gaps exceed the coverage parameter}
      - {code: SPEED_INCONSISTENT, label: Reported speed inconsistent with distance between pings}
      - {code: NO_RIDER_EVIDENCE, label: No strong rider counter-evidence (CW-F06)}
      - {code: SOURCE_CONFLICT, label: Policy sources disagree}
      - {code: GENERIC_ASSUMPTION_USED, label: A credibility C or D rule was decisive}
      - {code: INJECTION_SUSPECTED, label: Free text contains instructions to the system}
      - {code: FRAUD_SIGNAL, label: Fraud or bad-faith pattern detected (either party)}
      - {code: OUT_OF_WINDOW, label: Filed after the allowed window}
      - {code: CONTACT_NOT_ATTEMPTED, label: No call or message between arrival and cancellation}
      - {code: CHARGE_AMOUNT_MISMATCH, label: Amount charged differs from the policy amount of the profile}
      - {code: MARGIN_WITHIN_SPREAD, label: The decisive margin is not larger than the disagreement between sources about the same moment}
      - {code: RECORDS_MISSING, label: A decisive finding is UNKNOWN because records are missing}
      - {code: GPS_OUTLIER, label: "An outside stretch shorter than LEFT_MIN_OUTSIDE_S followed by a return inside, or reached at an impossible speed, after the driver was seen inside the pick-up area; set aside (CW-F04B)"}
      - {code: GPS_AMBIGUOUS, label: "The driver's GPS cannot settle whether the driver left during the wait (a stretch set aside between inside pings far apart, a departure around the window end, a wait that starts while the driver was last seen away, or a single ping); human approval (CW-F04B, AUTH-02)"}
      - {code: GPS_DATA_ERROR, label: Driver GPS implies a speed above SPEED_MAX_KMH; the jump is set aside and gate G1 fires (DQ-02)}
      - {code: ARRIVAL_UNCONFIRMED, label: "GPS did not confirm the driver at the pick-up point when arrival was indicated; the wait counts from the first confirming ping (CW-R06, CW-F03B)"}
      - {code: OTHER, label: Other}

