  - id: TX-OUTCOME
    name: Ruling outcome
    zh: 裁决结果
    closed: true
    closed_reason: "System decision set. A case that fits no outcome is ESCALATE_HUMAN, so no OTHER value."
    note: "Maps to the handbook's 'refund, compensation, no action'."
    values:
      - {code: UPHOLD, label: Charge upheld / claim rejected, zh: 维持原收费（驳回申诉）, handbook: no action, observed_in_DISP002: true, note: "UPHOLD means the charge stands. In organizer profiles, dispute_history.upheld probably counts disputes the rider WON, the opposite direction (question O9)."}
      - {code: WAIVE_FEE, label: Fee waived (reversed), zh: 免除费用, handbook: refund}
      - {code: PARTIAL_REFUND, label: Partial refund, zh: 部分退款, handbook: refund}
      - {code: FULL_REFUND, label: Full refund, zh: 全额退款, handbook: refund}
      - {code: TOLL_REFUND, label: ERP/toll refund, zh: 退还 ERP 差额, handbook: refund}
      - {code: COMPENSATE_DRIVER, label: Compensate the driver, zh: 补偿司机, handbook: compensation}
      - {code: GOODWILL_CREDIT, label: Goodwill credit without fault finding, zh: 善意补偿（不认定过错）, handbook: compensation}
      - {code: ESCALATE_HUMAN, label: Escalate to a human, zh: 转人工}
      - {code: REQUEST_INFO, label: Ask the claimant for missing information, zh: 要求补充信息}
      - {code: ROUTE_TO_SUPPORT, label: Not a dispute; route to support, zh: 非争议，转普通客服}
