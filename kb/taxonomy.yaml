  # ------------------------------------------------------------------
  - id: TX-REASON
    name: Ruling reason code (closing code)
    zh: 裁决理由代码
    closed: true
    closed_reason: "Closing codes. GEN-R-POLICY-GAP is the catch-all; a new code needs a producing rule."
    note: Assigned at ruling time. Each code is produced by the rule(s) listed; the build check verifies that every code has a producing rule.
    values:
      - {code: CW-R-NOSHOW-VALID, label: "Rider no-show confirmed: driver at pickup, waited past the threshold, rider absent", outcome: UPHOLD}
      - {code: CW-R-DRIVER-NOT-AT-PICKUP, label: Driver indicated arrival but GPS shows the driver was not at the pickup point, outcome: WAIVE_FEE}
      - {code: CW-R-WAIT-SHORT, label: Driver canceled before the no-show threshold, outcome: WAIVE_FEE}
      - {code: CW-R-FREE-WINDOW, label: Canceled inside the free cancellation window, outcome: WAIVE_FEE}
      - {code: CW-R-ARRIVAL-UNVERIFIED, label: Arrival or presence cannot be established because the records are missing (burden on the driver), outcome: WAIVE_FEE}
      - {code: CW-R-DRIVER-LEFT, label: Driver left the pick-up point during the wait, outcome: WAIVE_FEE}
      - {code: CW-R-RIDER-COUNTER-EVIDENCE, label: The rider's system-recorded evidence contradicts the no-show, outcome: ESCALATE_HUMAN}
      - {code: CW-R-PIN-AMBIGUOUS, label: Pickup pin and named venue differ materially, outcome: "secondary note; the outcome is unchanged, and human approval is required when the rider's statement places the rider at the named venue (AUTH-02)"}
      - {code: CW-R-WAITING-VALID, label: Waiting fee conditions met, outcome: UPHOLD}
      - {code: CW-R-WAITING-INVALID, label: Waiting fee conditions not met, outcome: WAIVE_FEE}
      - {code: CW-R-RIDERCANCEL-VALID, label: Rider canceled after the free window, outcome: UPHOLD}
      - {code: CW-R-DRIVER-LATE, label: "Driver was late or not approaching when the rider canceled (generic assumption)", outcome: WAIVE_FEE}
      - {code: CW-R-OUT-OF-WINDOW, label: Waiver request filed after 30 days, outcome: UPHOLD}
      - {code: FC-R-FIXED-FARE, label: Fare fixed at booking; route length did not change the amount charged, outcome: UPHOLD}
      - {code: FC-R-DETOUR-CONFIRMED, label: Unjustified detour increased a recalculated fare, outcome: PARTIAL_REFUND}
      - {code: FC-R-DETOUR-JUSTIFIED, label: "Deviation justified (traffic, closure, rider request, app reroute)", outcome: UPHOLD}
      - {code: FC-R-DETOUR-BORDERLINE, label: Detour near the threshold, outcome: ESCALATE_HUMAN}
      - {code: FC-R-TOLL-OVERSTATED, label: "ERP charged to the rider exceeds the rider's share of the gantries passed (FC-R06)", outcome: TOLL_REFUND}
      - {code: FC-R-TOLL-FROM-DETOUR, label: ERP incurred only because of an unjustified detour, outcome: TOLL_REFUND}
      - {code: FC-R-TOLL-VALID, label: "ERP charged to the rider stands: it does not exceed the rider's share of the gantries passed (FC-R06) and no detour refund is due", outcome: UPHOLD}
      - {code: FC-R-DEST-FEE-VALID, label: Destination edit was accepted by the driver; fee and recalculated fare stand, outcome: UPHOLD}
      - {code: FC-R-DEST-FEE-INVALID, label: Destination fee charged without an accepted edit or on a service that cannot edit, outcome: PARTIAL_REFUND}
      - {code: FC-R-NOPICKUP-CONFIRMED, label: Trip completed without the rider onboard, outcome: FULL_REFUND}
      - {code: FC-R-NOPICKUP-NOT-SUPPORTED, label: Records show the rider was picked up, outcome: UPHOLD}
      - {code: FC-R-INSUFFICIENT-DATA, label: Route or fare evidence insufficient, outcome: ESCALATE_HUMAN}
      - {code: DM-R-CLAIM-ELIGIBLE, label: Cleaning claim meets documentary requirements (human approval needed), outcome: COMPENSATE_DRIVER}
      - {code: DM-R-CLAIM-INELIGIBLE, label: Cleaning claim misses a deadline or required proof, outcome: UPHOLD}
      - {code: SE-R-HUMAN-DECIDES, label: Safety matter decided by a human, outcome: ESCALATE_HUMAN}
      - {code: GEN-R-NOT-A-DISPUTE, label: No contested charge or remedy, outcome: ROUTE_TO_SUPPORT}
      - {code: GEN-R-DUPLICATE, label: Duplicate of an open ticket, outcome: MERGE_DUPLICATE}
      - {code: GEN-R-NEED-INFO, label: Trip or charge cannot be identified, outcome: REQUEST_INFO}
      - {code: GEN-R-POLICY-GAP, label: No written rule covers the case, outcome: ESCALATE_HUMAN}
      - {code: GEN-R-SOURCE-CONFLICT, label: Policy sources conflict and the outcome depends on it, outcome: ESCALATE_HUMAN}
      - {code: GEN-R-DATA-INCONSISTENT, label: Authoritative records contradict each other beyond tolerance, outcome: ESCALATE_HUMAN}
      - {code: GEN-R-ESCALATED, label: A mandatory escalation gate fired, outcome: ESCALATE_HUMAN}

