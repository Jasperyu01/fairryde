# FairRyde Knowledge Base - Layer 1: TAXONOMY (controlled vocabularies)
# Question this layer answers: "Which class does it belong to?"
# Follows the ChordX knowledge-base protocol (ONT.2, ONT.4 Step 4).

meta:
  kb: FairRyde Knowledge Base
  layer: Taxonomy
  version: 0.1.0
  status: draft            # draft -> approved after review by the team lead and, where possible, the organizer / Ryde
  updated: 2026-10-05
  owner: Jasper
  reviewers: [Cao]
  authority: >-
    Business vocabulary. Labels reuse Ryde's own words from the Ryde Help Centre
    (2 categories, 46 sections and their article titles, read through the public Zendesk API on 2026-10-05)
    and the organizer's handbook and sample dataset DISP-002. FairRyde only assigns codes and groups;
    it does not invent business terms where Ryde already has one.
  placement_test: >-
    Put something in the Taxonomy when it names a CLASS from a closed list that could be a dropdown,
    and changing it means renaming or regrouping, not changing logic.
    (Things with identity and attributes go to the Ontology; IF/THEN conditions, thresholds, amounts,
    deadlines and permissions go to the Rules.)
  editing_rules:
    - Every vocabulary keeps an OTHER value plus a free-text field (ONT.4 Step 4).
    - Reuse Ryde wording when it exists and record where each label came from (term_sources).
    - Add a value only when a real or synthetic case cannot be placed; stop when every case fits exactly one leaf per dimension (Nickerson ending conditions).
    - Codes never change meaning. Retired codes are marked deprecated, never reused.
    - Event types come from the Ontology layer and are frozen here as a controlled list (ONT.2 dependency).
    - The classification unit is the CLAIM, not the ticket. One ticket may carry a primary claim and secondary claims (ONT.8).

scope_values:
  ADJUDICATE: In MVP. Full rule support; may be auto-resolved within the authority matrix.
  ADJUDICATE_WITH_APPROVAL: Rules support the check, but a human must approve the outcome (autonomy tier APPROVE).
  TRIAGE_TO_HUMAN: The AI classifies, preserves evidence and summarizes; a human decides (autonomy tier HUMAN).
  ROUTE_TO_SUPPORT: Not an adjudicable dispute (no contested charge or remedy); route to normal support. Used as negative samples.
  BACKLOG: Recognized by the classifier; rules not written in v0.1. Handled by rule GEN-R07 (escalate as a policy gap) and playbook PB-TRIAGE-HUMAN.
scope_playbooks:      # default playbook by scope when a leaf names none
  TRIAGE_TO_HUMAN: PB-TRIAGE-HUMAN
  BACKLOG: PB-TRIAGE-HUMAN
  ROUTE_TO_SUPPORT: PB-ROUTE-SUPPORT

vocabularies:

  # ------------------------------------------------------------------
  - id: TX-CASE
    name: Dispute category and type
    zh: 争议类别与类型
    used_by: [Claim.taxonomy_code, DisputeTicket.dispute_type]
    assigned_when: At intake (may be corrected later). Safety language anywhere overrides to SE (rule CLS-01).
    levels: [category, type]
    values:

      - code: CW
        level: category
        label: Cancellation and Waiting Fee
        zh: 取消费与等候费
        term_sources:
          - "Ryde rider article 23534478435353 'Cancellation and Waiting Fee'"
          - "Ryde driver article 33362932998937 'Cancellation and Waiting Time Policy'"
        children:
          - code: CW-NOSHOW
            label: No-show cancellation fee
            zh: 乘客缺席（no-show）取消费争议
            definition: The rider contests a cancellation fee charged after the DRIVER canceled the trip because the rider did not show up.
            excludes: "Fee after the RIDER canceled (CW-RIDERCANCEL); waiting fee on a completed trip (CW-WAITING)."
            term_sources:
              - "Handbook category 2 'No-Show Charge': 'Driver didn't show up but I was charged a cancellation fee.'"
              - "Ryde rider article 4407754403353 'What if my driver hasn't arrived, but has indicated that he/she arrived?'"
              - "Ryde driver article 115001438754 'I am unable to contact my rider. The rider did not turn up. What should I do?'"
            organizer_code: no_show_charge          # observed in DISP-002 dispute_ticket.dispute_type
            example_phrases: ["the driver never showed up", "I was there, the driver was not", "charged a cancellation fee for a no-show", "couldn't find the car"]
            scope: ADJUDICATE
            rule_family: CW
            playbook: PB-CW-NOSHOW
          - code: CW-RIDERCANCEL
            label: Rider cancellation fee
            zh: 乘客自行取消被收费
            definition: The rider contests a cancellation fee charged after the RIDER canceled (on-demand after the free window, or an advance trip inside the cut-off).
            excludes: "Driver-initiated no-show cancellation (CW-NOSHOW)."
            term_sources:
              - "Ryde rider article 4407761228825 'Will I be charged for cancelling a ride?'"
              - "Ryde rider article 18229758389017 'Cancellation Fee Waiver Request'"
            organizer_code: null
            example_phrases: ["I canceled because the driver was far away and still got charged", "charged after canceling"]
            scope: ADJUDICATE
            rule_family: CW
            playbook: PB-CW-RIDERCANCEL
          - code: CW-WAITING
            label: Waiting time fee
            zh: 等候费争议
            definition: The rider contests a waiting time fee added at the end of a completed trip.
            term_sources:
              - "Ryde rider article 4407754351257 'Why am I charged for a Waiting Time Fee?'"
              - "Ryde rider article 27085468660505 'Waiting Fee Waiver Request'"
              - "Ryde driver article 4408071347993 'How Does the Waiting Fee Work?'"
            organizer_code: null
            example_phrases: ["why was I charged a waiting fee", "I boarded within a minute"]
            scope: ADJUDICATE
            rule_family: CW
            playbook: PB-CW-WAITING
          - code: CW-DRIVERNOSHOW
            label: Driver did not arrive or was uncontactable
            zh: 司机未到或联系不上（乘客未被收费）
            definition: The rider reports that the driver did not come, was uncontactable or canceled, and no fee was charged to the rider; the rider seeks redress or reports the driver.
            excludes: "Any case where the rider was charged a fee (classify by that fee: CW-RIDERCANCEL or CW-NOSHOW)."
            term_sources:
              - "Ryde rider article 115000772593 'My Ryde driver is uncontactable. What should I do?'"
            organizer_code: null
            scope: BACKLOG
            rule_family: CW
          - code: CW-FEEMISSED
            label: Driver did not receive a cancellation or waiting fee
            zh: 司机未收到取消费或等候费
            definition: The DRIVER claims a cancellation or waiting time fee that was not credited or not added.
            term_sources:
              - "Ryde driver article 4408079464217 'What if I forgot to add in the Waiting Time Fee?'"
              - "Ryde driver article 23575142762393 'I wish to make an appeal'"
              - "Ryde driver article 4408071485081 'How do I charge the Cancellation or Waiting Time Fee if the Rider pays by Cash?'"
            organizer_code: null
            scope: BACKLOG
            rule_family: CW
          - code: CW-OTHER
            label: Other cancellation or waiting issue
            zh: 其他取消或等候问题
            definition: Fits the category but no type above; record free text.
            scope: BACKLOG

      - code: FC
        level: category
        label: Fares and Charges
        zh: 车费与收费
        term_sources:
          - "Ryde Help Centre section 'Fares and Charges' (Rider, 4406764226201) and 'Fares & Charges' (Driver, 4406764191129)"
        children:
          - code: FC-ROUTE
            label: Route deviation / longer route
            zh: 绕路或路线更长
            definition: The claimant says the driver's route, unexpected stops or a longer trip duration made the trip longer and/or raised the fare.
            term_note: "The handbook lists 'Route deviation analysis', 'unexpected stops' and 'trip duration vs. estimated time' as GPS evidence for this type."
            excludes: "Disputes about the ERP/toll amount itself (FC-TOLL), even if caused by the route; destination-edit fees (FC-DEST)."
            term_sources:
              - "Handbook category 1 'Route Deviation': 'Driver took a longer route and I was overcharged.'"
              - "Ryde rider article 4412121982745 'Can I suggest my preferred route to the driver?'"
              - "Ryde driver article 4412122016153 'Am I required to follow the suggested route by the rider?'"
            organizer_code: route_deviation          # assumed (snake_case of the handbook name); not yet observed in organizer data
            example_phrases: ["took a longer route", "went the long way", "overcharged because of the route", "driver detoured"]
            scope: ADJUDICATE
            rule_family: FC
            playbook: PB-FC-ROUTE
          - code: FC-TOLL
            label: ERP / toll overcharge
            zh: ERP 或过路费多收
            definition: The claimant contests the ERP or road-toll amount added to the trip. This includes ERP that a longer route caused, which FC-R01 opens as its own claim from a route ticket.
            term_sources:
              - "Ryde rider article 30741244296217 'I was overcharged for ERP/toll'"
              - "Ryde rider article 115000772653 'Do I need to pay ERP charges?'"
              - "Ryde driver articles 115001438614 'Which trips do I need to include ERP?' and 900005170163 'How to add ERP to my trip fare?'"
            organizer_code: null
            example_phrases: ["charged ERP twice", "there was no ERP on this road", "ERP amount is wrong"]
            scope: ADJUDICATE
            rule_family: FC
            playbook: PB-FC-TOLL
          - code: FC-DEST
            label: Add/edit destination fee
            zh: 改目的地费
            definition: The claimant contests the add/edit destination fee or the fare recalculated after a destination edit.
            term_sources:
              - "Ryde Help Centre section 'Add/Edit Destination Fee' (Rider, 51386363038873) and 'Add/Edit Destination' (Driver, 51400100407321)"
            organizer_code: null
            scope: ADJUDICATE_WITH_APPROVAL
            approval_reason: "The fee condition can be checked (FC-R09), but the recalculated fare comes from Ryde's pricing, which is not published, so the amount cannot be verified."
            rule_family: FC
            playbook: PB-FC-DEST
          - code: FC-NOPICKUP
            label: Trip completed without pickup
            zh: 未接到乘客却完成行程并收费
            definition: The rider was charged a fare although the trip was completed without the rider onboard.
            term_sources:
              - "Ryde rider article 18230976652185 'Driver completed the trip without picking me up'"
              - "Ryde driver article 20692560042649 'I completed a trip without picking up the rider'"
            organizer_code: null
            scope: ADJUDICATE_WITH_APPROVAL
            approval_reason: "A full refund reverses a completed fare, and whether the rider boarded rests on GPS from both phones, which is often missing."
            rule_family: FC
            playbook: PB-FC-NOPICKUP
          - code: FC-SURCHARGE
            label: Surcharge or entry fee
            zh: 附加费或入场费
            definition: The claimant contests a surcharge or entry fee (Sentosa entrance, Jurong Island pass, bulky item or wheelchair fee, child seat).
            term_sources:
              - "Ryde rider articles 17735760737817 'Sentosa Entrance Fee', 48945760704537 'Jurong Island Entry Pass', 4408072421785 'Are surcharges included in the base fee?', 4408080441497 'Do I need to pay an extra fee for my bulky items or wheelchair?', 37057430899225 'Baby and Child seat'"
            organizer_code: null
            scope: BACKLOG
            rule_family: FC
          - code: FC-PAYMENT
            label: Payment or transaction fee issue
            zh: 支付或交易费问题
            definition: Platform fee, transaction fee, duplicate charge, unpaid fare or cash collection issues.
            term_sources:
              - "Ryde rider articles 22836370596377 'Platform Fee', 52594357168281 'Transaction Fee', 18230595517465 'I forgot to pay for my trip.', 115000777574 'How can I pay my Ryde driver?'"
              - "Ryde driver articles 4842763548825 'Fare Evasion', 115001439613 'How do I collect payment from my pickups?'"
            organizer_code: null
            scope: BACKLOG
            rule_family: FC
          - code: FC-TIP
            label: Tip charged or not removed
            zh: 小费被收取或未能取消
            definition: The rider contests a tip amount that was charged, including a tip added automatically and not removed (ToU s.6.2). Questions about how to tip are EX-OTHER.
            term_sources:
              - "Ryde rider articles 18230620209049 'How do I tip my driver?', 62021500374041 'Can I tip more than $10?'"
              - "Ryde Terms of Use s.6.2: 'This will automatically be included in the User Charges after the Solution has been provided and given to the Partner unless you choose to remove the tip.'"
            scope: BACKLOG
          - code: FC-SURGE
            label: Surge or dynamic price
            zh: 高峰加价或动态价格
            definition: The claimant contests a surge or demand-based price component.
            term_sources:
              - "Handbook MVP evidence: 'Payment & Fare Data' includes 'surge pricing disputes'"
              - "Ryde driver article 900005170043 'How are the trip fares calculated?'"
            scope: BACKLOG
            rule_family: FC
          - code: FC-PROMO
            label: Promo code or discount not applied
            zh: 优惠码或折扣未生效
            definition: The rider says a promo code, voucher or discount was not applied to a trip fare.
            term_sources:
              - "Handbook MVP evidence: 'Payment & Fare Data' includes 'promo code usage'"
            scope: BACKLOG
            rule_family: FC
          - code: FC-OTHER
            label: Other fare or charge issue
            zh: 其他车费问题
            scope: BACKLOG

      - code: DM
        level: category
        label: Rider made a mess / damage
        zh: 车内脏污与损坏
        term_sources:
          - "Ryde driver article 900004381243 'My Rider Made a Mess'"
          - "Handbook category 3 'Property Damage / Mess'"
        children:
          - code: DM-CLEANING
            label: Cleaning fee claim
            zh: 清洁费索赔
            definition: The driver claims a cleaning fee for a mess caused by the rider, or the rider contests such a fee.
            term_sources:
              - "Handbook: 'Rider spilled drinks in the car and driver is claiming cleaning fees.'"
              - "Ryde driver article 900004381243 'My Rider Made a Mess'"
            organizer_code: property_damage          # assumed
            scope: ADJUDICATE_WITH_APPROVAL
            approval_reason: "Ryde reimburses cleaning costs subject to verification under its Vehicle Contamination Policy (ToU s.11), and judging photos and receipts needs a person."
            rule_family: DM
            playbook: PB-DM-CLEANING
          - code: DM-DAMAGE
            label: Vehicle damage
            zh: 车辆损坏
            scope: TRIAGE_TO_HUMAN
          - code: DM-OTHER
            label: Other mess or damage issue
            zh: 其他
            scope: BACKLOG

      - code: SE
        level: category
        label: Safety & Emergency
        zh: 安全与紧急情况
        term_sources:
          - "Ryde Help Centre section 'Safety & Emergency' (Rider, 17001140853529; Driver, 17000727296025)"
          - "Handbook category 4 'Safety Incident'"
        children:
          - code: SE-CONDUCT
            label: Inappropriate behavior or harassment
            zh: 不当行为或骚扰
            term_sources:
              - "Handbook: 'Driver behaved inappropriately during the trip.'"
              - "Ryde rider article 51354502165913 'Report a safety issue'"
            organizer_code: safety_incident          # assumed
            scope: TRIAGE_TO_HUMAN
            rule_family: SE
            playbook: PB-TRIAGE-HUMAN
          - code: SE-DRIVING
            label: Unsafe driving
            zh: 危险驾驶
            scope: TRIAGE_TO_HUMAN
            rule_family: SE
          - code: SE-MISMATCH
            label: Driver or vehicle does not match the app
            zh: 司机或车辆与 app 不符
            term_sources:
              - "Ryde rider articles 35170207360025 'Driver profile did not match on app', 115000777594 'My Ryde driver came in a different car from the one in his/her profile.'"
            scope: TRIAGE_TO_HUMAN
            rule_family: SE
          - code: SE-ACCIDENT
            label: Accident
            zh: 交通事故
            term_sources:
              - "Ryde rider article 900003838306 'I was involved in an accident'; driver article 900003838386"
            scope: TRIAGE_TO_HUMAN
            rule_family: SE
          - code: SE-RECORDING
            label: In-vehicle recording device
            zh: 车内录像设备
            term_sources:
              - "Ryde rider article 51813221666457 'What should I do if I notice a driver using a dashcam/IVRD?'"
            scope: TRIAGE_TO_HUMAN
            rule_family: SE
          - code: SE-TERMINATED
            label: Ride terminated after the trip started
            zh: 行程中途被终止
            term_sources:
              - "Ryde articles 16925196526489 / 16925303332889 'Can driver terminate a ride after trip started ?'"
            scope: TRIAGE_TO_HUMAN
            rule_family: SE
          - code: SE-OTHER
            label: Other safety concern
            zh: 其他安全问题
            scope: TRIAGE_TO_HUMAN

      - code: EX
        level: category
        label: Ryde Experience (no contested charge)
        zh: 服务体验（无争议款项）
        term_sources:
          - "Ryde Help Centre section 'Ryde Experience' (Rider, 4406764216985; Driver, 4406764180761)"
        children:
          - code: EX-LOST
            label: Lost or found item
            zh: 失物
            term_sources: ["Ryde rider article 25969395777305 'I lost my item.'", "Ryde driver article 360011925934 'I found an item'"]
            scope: ROUTE_TO_SUPPORT
          - code: EX-RATING
            label: Rating issue
            zh: 评分问题
            term_sources:
              - "Ryde rider article 48132902021017 'Why was a 5-star rating submitted even though I didn't rate the trip?'"
              - "Ryde driver article 4408079364889 'What if my Rider rates me poorly because of the Cancellation or Waiting Time Fee?'"
            scope: ROUTE_TO_SUPPORT
          - code: EX-FEEDBACK
            label: Feedback about the driver or rider
            zh: 对司机或乘客的一般反馈
            term_sources: ["Ryde rider article 18230876398105", "Ryde driver article 20690825386521"]
            scope: ROUTE_TO_SUPPORT
          - code: EX-LOCATION
            label: Pick-up or drop-off location issue (no charge contested)
            zh: 上下车点问题（无争议款项）
            definition: Location problem reported without contesting any charge. If a fee is contested because of a location problem, classify by the fee (for example CW-NOSHOW) and record the reason code CW-R-PIN-AMBIGUOUS.
            term_sources: ["Ryde articles 18230398581913 / 20691147765401 'Report issue with pick-up & drop-off location'"]
            scope: ROUTE_TO_SUPPORT
          - code: EX-APP
            label: App or tracking problem
            zh: App 或定位追踪问题
            term_sources: ["Ryde rider articles 18230787646361 'Issue with tracking the driver', 46037468973337 'In-App Calling Feature'"]
            scope: ROUTE_TO_SUPPORT
          - code: EX-OTHER
            label: Other experience issue
            zh: 其他体验问题
            scope: ROUTE_TO_SUPPORT

      - code: OT
        level: category
        label: Other / unclassified
        zh: 其他（自填）
        children:
          - code: OT-OTHER
            label: Other (free text)
            zh: 其他（自填）
            definition: Cannot be placed anywhere else. Always fill the free-text field. If a charge is contested it is escalated (GEN-R07); if not, it goes to support (CLS-03). A rising share signals that the taxonomy needs a new value.
            scope: BACKLOG

  # ------------------------------------------------------------------
  - id: TX-ROLE
    name: Party role
    zh: 当事方角色
    note: Roles are NOT entity types. An Account plays a role in a Trip, a Ticket or a Charge (ONT.4 Step 2, ONT.8).
    values:
      - {code: RIDER, label: Rider, zh: 乘客, context: Trip, aliases: [rider], term_source: "DISP-002 trip_data.rider_id; Ryde 'Rider' category"}
      - {code: DRIVER, label: Driver, zh: 司机, context: Trip, aliases: [driver], term_source: "DISP-002 trip_data.driver_id; Ryde 'Driver' category (driver-partner)"}
      - {code: CLAIMANT, label: Claimant (filer), zh: 申诉方, context: DisputeTicket, term_source: "DISP-002 dispute_ticket.filed_by"}
      - {code: RESPONDENT, label: Respondent, zh: 被申诉方, context: DisputeTicket}
      - {code: PAYER, label: Payer, zh: 付款方, context: Charge or Remedy}
      - {code: PAYEE, label: Payee, zh: 收款方, context: Charge or Remedy, term_source: "DISP-002 cancellation_policy.fee_goes_to = driver_compensation"}
      - {code: PLATFORM, label: Ryde acting as a party (for example the payer of a voucher or the sender of system messages), zh: 平台（作为一方）, context: "Trip, Charge, Ruling", aliases: [system], term_source: "Ryde Terms of Use; DISP-002 chat_logs[].sender = system"}
      - {code: PLATFORM_LINKER, label: Ryde linking the user with a partner, zh: 平台作为撮合方, context: Trip, term_source: "ToU s.1"}
      - {code: PLATFORM_COLLECTION_AGENT, label: Ryde collecting charges for the driver, zh: 平台作为代收方, context: Charge, term_source: "ToU s.6.1"}
      - {code: PLATFORM_REFUND_DECIDER, label: Ryde deciding refunds, zh: 平台作为退款决定方, context: Ruling, term_source: "ToU s.7.2"}
      - {code: PLATFORM_CLEANING_VERIFIER, label: Ryde verifying cleaning claims, zh: 平台作为清洁费核实方, context: "Charge (CLEANING_FEE)", term_source: "ToU s.11"}
      - {code: REVIEWER, label: Human reviewer, zh: 人工复核员, context: Ruling}
      - {code: OTHER, label: Other, zh: 其他（自填）}

