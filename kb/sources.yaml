# FairRyde Knowledge Base - SOURCE REGISTRY
# Every rule cites a document from this registry (or a Ryde Help Centre article, registered automatically from
# sources/ryde_policy_corpus.json as RYDE-<article id>). verify_against tells the build script where to check quotes.
# All verify_against files are bundled under kb/sources/ so the check can be rerun anywhere.
# External pages (Grab, Bolt, DiDi, LTA, IMDA) were read on 2026-10-05 and their exact wording was recorded in the
# fact-check note (sources/research/09_fact_check.md); quotes are verified against that record, not the live page.

meta:
  version: 0.1.0
  updated: 2026-10-05
  note: Ryde Help Centre articles (125 of them; 2 added on 2026-10-05 to verify taxonomy term sources) are registered automatically from the corpus with title, URL, audience and edited date.

